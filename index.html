<script id="lt-share-redirect-early">
// Redirection très tôt des liens de partage sans hash.
// Exemple : /TheTournament/?tournoi=id-xxx → /TheTournament/#/tournaments/id-xxx
(function () {
  try {
    var params = new URLSearchParams(window.location.search || '');
    var tid = params.get('tournoi') || params.get('tournament') || params.get('t');
    if (!tid) return;

    var cleanPath = window.location.pathname.replace(/\/index\.html$/, '/');
    var target = window.location.origin + cleanPath + '#/tournaments/' + encodeURIComponent(tid);

    // location.replace évite de garder ?tournoi=... dans l'historique et force la SPA
    // à démarrer directement sur la fiche tournoi, pas sur l'accueil.
    if (window.location.href !== target) {
      window.location.replace(target);
    }
  } catch (e) {}
})();
</script>

<style>
/* =====================================================
   LE TOURNOI — design sobre, éditorial, premium
   Palette : navy nuit / ivoire chaud / terracotta discrète
   Typo : Poppins (titres) + DM Sans (corps) + JetBrains Mono (mono/détails)
   ===================================================== */

:root {
  /* Encre — à dominante verte (palette §7bis-2 CPO) */
  --ink: #1B1F1A;
  --ink-soft: #2C332B;
  --ink-mute: #5A6358;
  --ink-faint: #8A9388;

  /* Papier — blancs cassés neutres */
  --paper: #F7F7F4;
  --paper-soft: #EDEEE9;
  --paper-deep: #E2E4DD;

  /* Accent — vert gazon (signature) */
  --accent: #2E5339;
  --accent-deep: #1F3D28;
  --accent-soft: #4A7A58;
  --accent-2: #E0A83E; /* jaune carton — urgences/badges uniquement, jamais CTA */

  /* Tons secondaires — catégories (noms historiques conservés, valeurs §7bis-2 :
     --olive = cat-2 vert clair terrain, --bronze = cat-3 jaune carton, --slate = cat-4 bleu maillot) */
  --olive: #3D6B4A;
  --bronze: #E0A83E;
  --slate: #33507A;

  /* Filets et séparateurs */
  --line: rgba(27, 31, 26, 0.10);
  --line-soft: rgba(27, 31, 26, 0.05);
  --line-strong: rgba(27, 31, 26, 0.20);

  /* Typo */
  --font-serif: 'Poppins', system-ui, sans-serif;
  --font-sans: 'DM Sans', -apple-system, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

  /* Espacement */
  --container: clamp(1.25rem, 4vw, 3rem);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  display: flex; flex-direction: column;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; }
::selection { background: var(--ink); color: var(--paper); }

/* ===========================================
   NAVIGATION — sobre, ligne fine, beaucoup d'air
   =========================================== */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--ink);
  border-bottom: 1px solid rgba(247,247,244,0.08);
  padding: 0 var(--container);
  height: 64px;
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
}
.brand { display: flex; align-items: center; gap: 0.75rem; }
.brand-mark {
  width: 28px; height: 28px;
  background: var(--accent-2);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
}
.brand-mark svg { width: 34px; height: 34px; }
.brand-name {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--paper);
  display: flex; align-items: center; gap: 0.5rem;
}
.brand-name .dot { display: none; }
.brand-idf {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--accent-2);
  border: 1px solid var(--accent-2);
  padding: 0.15rem 0.35rem;
  border-radius: 2px;
}
.nav-links {
  display: flex; gap: 2.25rem; align-items: center;
  font-size: 13px; font-weight: 500;
  letter-spacing: -0.005em;
}
.nav-link {
  color: rgba(247,247,244,0.55);
  transition: color 0.25s ease;
  position: relative; padding: 0.3rem 0;
}
.nav-link:hover, .nav-link.active { color: var(--paper); }
.nav-link.active::after {
  content: ""; position: absolute;
  bottom: -22px; left: 0; right: 0;
  height: 3px; background: var(--accent-2);
}
.nav-right { display: flex; align-items: center; gap: 0.65rem; }
.role-badge {
  font-family: var(--font-mono); font-size: 10px;
  padding: 0.3rem 0.55rem;
  background: rgba(247,247,244,0.08);
  color: rgba(247,247,244,0.6);
  border: 1px solid rgba(247,247,244,0.15);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 500;
}

/* ===========================================
   BOUTONS — minimal, ligne fine, pas d'ombre dure
   =========================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem;
  padding: 0.7rem 1.4rem;
  font-family: var(--font-sans);
  font-size: 13px; font-weight: 500;
  letter-spacing: -0.005em;
  transition: all 0.25s ease;
  white-space: nowrap;
  border: 1px solid transparent;
  border-radius: 2px;
  cursor: pointer;
}
.btn-primary {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink);
}
.btn-primary:hover {
  background: var(--ink-soft); border-color: var(--ink-soft);
}
.btn-orange {
  background: var(--accent); color: var(--paper);
  border-color: var(--accent);
}
.btn-orange:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn-outline {
  border-color: var(--line-strong); color: var(--ink);
  background: transparent;
}
.btn-outline:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-ghost { color: var(--ink-mute); background: transparent; }
.btn-ghost:hover { color: var(--ink); }
.btn-success { background: var(--olive); color: var(--paper); border-color: var(--olive); }
.btn-success:hover { background: #4a5732; border-color: #4a5732; }
.btn-danger {
  color: var(--accent-deep);
  border: 1px solid rgba(151, 73, 46, 0.25);
  background: transparent;
}
.btn-danger:hover { background: rgba(151, 73, 46, 0.06); border-color: rgba(151, 73, 46, 0.4); }
.btn-lg { padding: 0.9rem 1.8rem; font-size: 14px; }
.btn-sm { padding: 0.5rem 1rem; font-size: 12px; }
.btn-full { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-arrow {
  width: 6px; height: 6px;
  border-top: 1.5px solid currentColor;
  border-right: 1.5px solid currentColor;
  transform: rotate(45deg);
  transition: transform 0.25s ease;
  margin-left: 0.15rem;
}
.btn:hover .btn-arrow { transform: rotate(45deg) translate(2px, -2px); }

/* ===========================================
   LAYOUT
   =========================================== */
.main { flex: 1; width: 100%; }
.container { max-width: 1280px; margin: 0 auto; padding: 0 var(--container); }
.section { padding: 4rem 0; }
.section-lg { padding: 6rem 0; }

.page-head {
  padding: 4rem var(--container) 3rem;
  border-bottom: 1px solid var(--line);
  max-width: 1280px; margin: 0 auto;
}
.page-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 1rem;
}
.page-title {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: clamp(2.5rem, 5.5vw, 4.5rem);
  line-height: 1.02;
  letter-spacing: -0.02em;
  max-width: 900px;
}
.page-title em {
  font-style: italic;
  font-weight: 300;
  color: var(--accent);
}
.page-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.15rem;
  font-style: italic;
  color: var(--ink-mute);
  margin-top: 1.5rem;
  max-width: 580px;
  line-height: 1.55;
  letter-spacing: -0.005em;
}
.page-head-actions {
  display: flex; gap: 0.65rem;
  margin-top: 2rem; flex-wrap: wrap;
}

/* ===========================================
   HERO — éditorial, large, calme
   =========================================== */
.hero {
  background: var(--paper);
  padding: 5rem var(--container) 4rem;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
}
.hero-eyebrow {
  display: none; /* remplacé par .hero-badge-saison */
}
.hero-grid {
  max-width: 1280px; margin: 0 auto;
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 4rem; align-items: end;
}
@media (max-width: 880px) { .hero-grid { grid-template-columns: 1fr; gap: 3rem; } }
.hero-content { position: relative; z-index: 2; }
.hero-eyebrow::before { display: none; }
.hero-h1 {
  font-family: var(--font-serif);
  font-weight: 900;
  font-size: clamp(2.4rem, 5vw, 3.625rem); /* 58px desktop */
  line-height: 0.93;
  letter-spacing: -0.025em;
  max-width: 580px;
  margin-bottom: 1.5rem;
  color: var(--paper);
}
.hero-h1 em {
  font-style: normal;
  font-weight: 900;
  color: var(--accent-2);
}
.hero-h1 .underline {
  position: relative;
  display: inline-block;
}
.hero-h1 .underline::after {
  content: ""; position: absolute;
  bottom: 0.05em; left: 0; right: 0;
  height: 3px; background: var(--accent-2); opacity: 0.4;
}
.hero-sub {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 14px;
  line-height: 1.6;
  color: rgba(247,247,244,0.45);
  max-width: 420px;
  margin-bottom: 32px;
}
.hero-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
/* CTA hero spécifiques §5 */
.hero-cta-primary {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: var(--accent-2); color: var(--ink);
  font-family: var(--font-serif); font-weight: 800; font-size: 15px;
  padding: 16px 34px; border-radius: 3px; border: none;
  text-decoration: none; cursor: pointer; letter-spacing: 0.04em;
  transition: opacity 0.15s;
}
.hero-cta-primary:hover { opacity: 0.88; }
.hero-cta-secondary {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: transparent; color: var(--paper);
  font-family: var(--font-serif); font-weight: 700; font-size: 15px;
  padding: 14px 28px; border-radius: 3px;
  border: 2px solid rgba(247,247,244,0.30);
  text-decoration: none; cursor: pointer;
  transition: border-color 0.15s;
}
.hero-cta-secondary:hover { border-color: rgba(247,247,244,0.6); }
/* Masquer les hero-numbers (remplacés par hero-stats-band) */
.hero-numbers { display: none; }
.hero-number-val {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 2.75rem;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.hero-number-val em {
  font-style: italic;
  color: var(--accent);
}
.hero-number-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
  margin-top: 0.65rem;
}
.hero {
  background: var(--ink);
  padding: 5rem var(--container) 0;
  position: relative;
  overflow: hidden;
}
.hero-deco {
  position: absolute;
  top: -10%; right: -8%;
  width: 55%; height: 120%;
  opacity: 0.12;
  color: var(--accent);
  pointer-events: none;
  z-index: 0;
}
.hero-deco svg { width: 100%; height: 100%; }
/* Pastille saison */
.hero-badge-saison {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: rgba(46,83,57,0.4);
  border: 1px solid var(--accent);
  border-radius: 2px;
  padding: 0.3rem 0.7rem;
  margin-bottom: 1.5rem;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(247,247,244,0.7);
}
.hero-badge-saison::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent-2);
  flex-shrink: 0;
}
/* Bande stats fond --ink */
.hero-stats-band {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--accent);
  position: relative;
}
.hero-stat {
  padding: 16px 24px;
  border-right: 1px solid rgba(247,247,244,0.12);
  text-align: center;
}
.hero-stat:last-child { border-right: none; }
.hero-stat-val {
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 700;
  color: var(--paper);
  line-height: 1;
  margin-bottom: 4px;
}
.hero-stat-val.open { color: var(--accent-2); }
.hero-stat-lbl {
  font-family: var(--font-sans);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: rgba(247,247,244,0.55);
}
@media (max-width: 880px) {
  .hero-stats-band { grid-template-columns: repeat(4,1fr); }
  .hero-stat { padding: 12px 8px; }
  .hero-stat-val { font-size: 18px; }
}

/* ===========================================
   ACCOUNT ROLES — cards minimales
   =========================================== */
.roles-section {
  background: var(--paper);
  padding: 6rem var(--container);
  border-bottom: 1px solid var(--line);
}
.roles-grid {
  max-width: 1280px; margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
@media (max-width: 880px) { .roles-grid { grid-template-columns: 1fr; } }
.role-card {
  background: var(--paper);
  padding: 2.5rem 2rem;
  transition: background 0.3s ease;
  display: flex; flex-direction: column;
}
.role-card:hover { background: var(--paper-soft); }
.role-card-icon {
  width: 52px; height: 52px;
  background: rgba(184, 92, 60, 0.08);
  border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  margin-bottom: 1.1rem;
}
.role-card-eye {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--accent);
  margin-bottom: 0.75rem;
}
.role-card-title {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: 1.7rem;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-bottom: 1rem;
}
.role-card-title em {
  font-style: italic;
  color: var(--accent);
}
.role-card-desc {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mute);
  font-size: 0.98rem;
  margin-bottom: 1.5rem;
  line-height: 1.5;
}
.role-card-bullets {
  list-style: none;
  margin-bottom: 2rem;
  display: flex; flex-direction: column;
  gap: 0.55rem;
}
.role-card-bullets li {
  font-size: 13.5px;
  padding-left: 1.25rem;
  position: relative;
  color: var(--ink-soft);
  line-height: 1.5;
}
.role-card-bullets li::before {
  content: "—";
  color: var(--accent);
  position: absolute; left: 0;
  font-weight: 400;
}

/* ===========================================
   Section common
   =========================================== */
.section-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 1rem;
}
.section-h2 {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: clamp(2rem, 4vw, 3rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 2.5rem;
  max-width: 800px;
}
.section-h2 em {
  font-style: italic;
  color: var(--accent);
}

/* ===========================================
   GRIDS
   =========================================== */
.grid { display: grid; gap: 1.5rem; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

/* ===========================================
   CARDS — épurées, gradient subtil, ligne fine
   =========================================== */
.t-card {
  background: var(--paper);
  border: 1px solid var(--line);
  position: relative;
  display: flex; flex-direction: column;
  transition: border-color 0.3s ease, transform 0.3s ease;
  overflow: hidden; cursor: pointer;
  border-radius: 3px;
}
.t-card:hover {
  border-color: var(--ink);
  transform: translateY(-2px);
}
.t-card-img {
  height: 140px;
  background: var(--paper-soft);
  border-top: 5px solid var(--ink);
  position: relative;
  overflow: hidden;
  color: var(--ink); /* teinte héritée par le motif via currentColor */
}
.t-card-img.alt-1 { border-top-color: var(--olive);  color: var(--olive); }
.t-card-img.alt-2 { border-top-color: var(--bronze); color: var(--bronze); }
.t-card-img.alt-3 { border-top-color: var(--slate);  color: var(--slate); }
.t-card-img.alt-4 { border-top-color: var(--accent); color: var(--accent); }
.t-card-pattern {
  position: absolute;
  width: 90px; height: 60px;
  right: -8px; bottom: -8px;
  opacity: 0.09;
  transition: opacity 0.2s ease;
  pointer-events: none;
}
.t-card:hover .t-card-pattern { opacity: 0.15; }
.t-card-mark {
  position: absolute; top: 1.1rem; left: 1.25rem;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-soft);
  z-index: 1;
}
.t-card-num {
  position: absolute; bottom: 0.4rem; right: 1.25rem;
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 300;
  font-size: 5rem;
  line-height: 1;
  color: var(--ink);
  opacity: 0.1;
  letter-spacing: -0.04em;
  z-index: 1;
}
.t-card-body {
  padding: 1.5rem 1.5rem 1.5rem;
  flex: 1; display: flex; flex-direction: column;
}
.t-card-club {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--accent);
  margin-bottom: 0.85rem;
}
.t-card-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.4rem;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-bottom: 0.5rem;
}
.t-card-meta {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.92rem;
  color: var(--ink-mute);
  margin-bottom: 1.25rem;
}
.t-card-foot {
  margin-top: auto;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
}
.t-card-status {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 0.3rem 0.6rem;
  border: 1px solid var(--line);
  border-radius: 2px;
}
.t-card-status.open { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.t-card-status.draft { background: transparent; color: var(--ink-mute); }
.t-card-status.live { background: var(--olive); color: var(--paper); border-color: var(--olive); }
.t-card-status.urgent { background: var(--accent-2); color: var(--ink); border-color: var(--accent-2); }
.t-card-status.cancelled { background: transparent; color: var(--ink-mute); border-color: var(--ink-mute); text-decoration: line-through; }
/* Ligne catégorie+format §7ter */
.t-card-category {
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
  margin-bottom: 0.35rem;
}
/* Compteur équipes §7ter */
.t-card-count {
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  color: var(--ink-mute);
  letter-spacing: 0.05em;
}
.t-card-progress {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  color: var(--ink-soft);
}

/* ===========================================
   FORMS
   =========================================== */
.form-group { margin-bottom: 1.5rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
@media (max-width: 600px) {
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
}
.form-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-mute);
  margin-bottom: 0.6rem;
}
.form-help {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 12.5px;
  color: var(--ink-mute);
  margin-top: 0.5rem;
  line-height: 1.5;
}
.input, .select, .textarea {
  width: 100%;
  padding: 0.85rem 1rem;
  background: var(--paper);
  border: 1px solid var(--line-strong);
  font-size: 14px;
  color: var(--ink);
  font-family: var(--font-sans);
  border-radius: 2px;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--ink);
  background: var(--paper);
}
.textarea { resize: vertical; min-height: 110px; line-height: 1.5; }

.radio-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 0.5rem;
}
.radio-c {
  padding: 1rem 1.1rem;
  border: 1px solid var(--line-strong);
  cursor: pointer;
  transition: all 0.2s ease;
  background: var(--paper);
  border-radius: 2px;
}
.radio-c:hover { border-color: var(--ink); }
.radio-c.selected {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink);
}
.radio-c-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.1rem;
  letter-spacing: -0.01em;
  margin-bottom: 0.2rem;
}
.radio-c-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 12.5px;
  opacity: 0.85;
}

.field-error {
  color: var(--accent-deep);
  font-size: 12px;
  margin-top: 0.3rem;
  display: none;
}
.field-error.show { display: block; }
.form-error {
  background: rgba(151, 73, 46, 0.08);
  color: var(--accent-deep);
  border: 1px solid rgba(151, 73, 46, 0.2);
  padding: 0.85rem 1rem;
  font-size: 13px;
  margin-bottom: 1rem;
  border-radius: 2px;
  display: none;
}
.form-error.show { display: block; }

.day-checks { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.day-check {
  padding: 0.55rem 0.9rem;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  user-select: none;
  transition: all 0.2s ease;
  border-radius: 2px;
}
.day-check:hover { border-color: var(--ink); }
.day-check.selected {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink);
}

/* ===========================================
   AUTH
   =========================================== */
.auth-page { max-width: 480px; margin: 5rem auto; padding: 0 var(--container); }
.auth-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 3rem 2.5rem;
  border-radius: 3px;
}
.auth-card::before { display: none; }
.auth-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 1rem;
}
.auth-title {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 2.25rem;
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin-bottom: 0.6rem;
}
.auth-title em {
  font-style: italic;
  font-weight: 300;
  color: var(--accent);
}
.auth-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mute);
  font-size: 1rem;
  margin-bottom: 2rem;
  line-height: 1.5;
}
.auth-footer-link {
  margin-top: 1.75rem; text-align: center;
  font-size: 13px; color: var(--ink-mute);
}
.auth-footer-link a {
  color: var(--ink); font-weight: 500;
  border-bottom: 1px solid var(--accent);
  padding-bottom: 1px;
  transition: border-color 0.2s;
}
.auth-footer-link a:hover { border-color: var(--ink); }
.auth-demo {
  margin-top: 1.5rem;
  padding: 1.1rem 1.25rem;
  background: var(--paper-soft);
  border-left: 2px solid var(--accent);
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.8;
  color: var(--ink-soft);
  border-radius: 0 2px 2px 0;
}
.auth-demo code {
  background: var(--ink); color: var(--paper);
  padding: 1px 6px;
  font-size: 10px;
  border-radius: 2px;
}
.signup-mode-radios {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
}
.signup-radio-opt {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.7rem 1rem;
  border: 1.5px solid var(--line-strong);
  border-radius: 6px;
  cursor: pointer;
  background: var(--paper-soft);
  transition: border-color 0.15s, background 0.15s;
  user-select: none;
}
.signup-radio-opt.opt-real.selected {
  background: var(--accent);
  border-color: var(--accent);
  opacity: 1;
}
.signup-radio-opt.opt-demo {
  opacity: 0.6;
}
.signup-radio-opt.opt-demo.selected {
  background: var(--ink-mute);
  border-color: var(--ink-mute);
  opacity: 1;
}
.signup-radio-opt input[type="radio"] {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  cursor: pointer;
  margin: 0;
  accent-color: var(--paper);
}
.signup-radio-opt input[type="radio"]:disabled {
  opacity: 0.3;
}
.signup-radio-name {
  font-family: var(--font-sans);
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--ink);
  line-height: 1;
}
.signup-radio-opt.selected .signup-radio-name {
  color: var(--paper);
}
.signup-radio-opt.opt-demo .signup-radio-name {
  font-weight: 400;
  font-size: 0.88rem;
  color: var(--ink-soft);
}
.signup-radio-opt.opt-demo.selected .signup-radio-name {
  color: var(--paper);
}

.auth-tabs {
  display: flex; gap: 0;
  border: 1px solid var(--line-strong);
  margin-bottom: 1.5rem;
  border-radius: 2px;
  overflow: hidden;
}
.auth-tab {
  flex: 1; padding: 0.85rem 0.5rem;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  cursor: pointer;
  text-align: center;
  border-right: 1px solid var(--line-strong);
  transition: all 0.2s ease;
  background: var(--paper);
}
.auth-tab:last-child { border-right: none; }
.auth-tab:hover { color: var(--ink); background: var(--paper-soft); }
.auth-tab.active {
  background: var(--ink);
  color: var(--paper);
}

/* ===========================================
   DASHBOARD
   =========================================== */
.dash-greeting {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 2.4rem;
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin-bottom: 0.5rem;
}
.dash-greeting em {
  font-style: italic;
  color: var(--accent);
}
.dash-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mute);
  margin-bottom: 3rem;
  font-size: 1.05rem;
}
.dash-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin-bottom: 3rem;
  border-radius: 2px;
  overflow: hidden;
}
.dash-stat {
  background: var(--paper);
  padding: 1.5rem 1.5rem;
}
.dash-stat-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
  margin-bottom: 0.85rem;
}
.dash-stat-val {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 2.4rem;
  line-height: 1;
  letter-spacing: -0.025em;
  color: var(--ink);
}
.dash-stat-val em {
  font-style: italic;
  color: var(--accent);
}
.dash-section { margin-bottom: 4rem; }
.dash-section-h {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 1.5rem; padding-bottom: 1rem;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
  gap: 0.75rem;
}
.dash-section-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.4rem;
  letter-spacing: -0.015em;
}
.dash-empty {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  padding: 3rem 1.5rem;
  text-align: center;
  border-radius: 2px;
}
.dash-empty-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.3rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.5rem;
}
.dash-empty-text {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mute);
  margin-bottom: 1.25rem;
  font-size: 0.98rem;
}

/* ===========================================
   TOURNAMENT DETAIL HERO
   =========================================== */
.tourn-hero {
  background: var(--ink);
  color: var(--paper);
  padding: 5rem var(--container) 4rem;
  position: relative;
  overflow: hidden;
}
.tourn-hero::before { display: none; }
.tourn-hero-inner {
  max-width: 1280px; margin: 0 auto;
  position: relative; z-index: 2;
}
.tourn-hero-club {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent-soft);
  margin-bottom: 1.25rem;
}
.tourn-hero-title {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  letter-spacing: -0.03em;
  line-height: 1.02;
  margin-bottom: 2rem;
  color: var(--paper);
}
.tourn-hero-title em {
  font-style: italic;
  font-weight: 300;
  color: var(--accent-soft);
}
.tourn-hero-meta {
  display: flex; flex-wrap: wrap;
  gap: 2rem 3.5rem;
  margin-top: 2rem; padding-top: 2rem;
  border-top: 1px solid rgba(247, 247, 244, 0.12);
}
.tourn-meta-item { display: flex; flex-direction: column; gap: 0.5rem; }
.tourn-meta-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: rgba(247, 247, 244, 0.5);
}
.tourn-meta-val {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.15rem;
  letter-spacing: -0.01em;
  color: var(--paper);
}
.tourn-body {
  max-width: 1280px; margin: 0 auto;
  padding: 3rem var(--container) 4rem;
  display: grid; grid-template-columns: 1fr 340px;
  gap: 3.5rem;
}
@media (max-width: 880px) { .tourn-body { grid-template-columns: 1fr; gap: 2rem; } }

.detail-tabs {
  display: flex; gap: 0.25rem;
  border-bottom: 1px solid var(--line);
  margin-bottom: 2.5rem;
  overflow-x: auto;
  /* Hide scrollbar — tabs wrap on small screens instead */
  scrollbar-width: none;
  -ms-overflow-style: none;
  flex-wrap: wrap;
}
.detail-tabs::-webkit-scrollbar { display: none; }
.detail-tab {
  padding: 0.9rem 1.25rem;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  cursor: pointer;
  border-bottom: 1px solid transparent;
  margin-bottom: -1px;
  transition: color 0.25s, border-color 0.25s;
  white-space: nowrap;
  display: inline-flex; align-items: center; gap: 0.5rem;
}
.detail-tab.active { color: var(--ink); border-color: var(--accent); }
.detail-tab:hover { color: var(--ink); }
.tab-badge {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent); color: var(--paper);
  font-size: 9px; font-weight: 600;
  padding: 2px 6px;
  border-radius: 999px;
  min-width: 18px;
}
.detail-content { min-height: 200px; }
.detail-section { margin-bottom: 2.5rem; }
.detail-section-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.3rem;
  letter-spacing: -0.015em;
  margin-bottom: 1.25rem;
  padding-bottom: 0.65rem;
  border-bottom: 1px solid var(--line);
}
.detail-text {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--ink-soft);
  letter-spacing: -0.005em;
}

/* ===========================================
   List rows
   =========================================== */
.list { display: flex; flex-direction: column; gap: 0.6rem; }
.list-row {
  display: flex; align-items: center; gap: 1.25rem;
  padding: 1.1rem 1.25rem;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 2px;
  transition: border-color 0.25s, background 0.25s;
}
.list-row:hover { border-color: var(--ink); background: var(--paper-soft); }
.list-num {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 1.6rem;
  width: 36px;
  color: var(--accent);
  text-align: center;
  flex-shrink: 0;
  line-height: 1;
}
.list-info { flex: 1; min-width: 0; }
.list-name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.1rem;
  letter-spacing: -0.015em;
  line-height: 1.3;
}
.list-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.88rem;
  color: var(--ink-mute);
  margin-top: 0.25rem;
}
.list-status {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 0.3rem 0.6rem;
  border: 1px solid var(--line);
  white-space: nowrap;
  border-radius: 2px;
}
.list-status.paid, .list-status.approved, .list-status.confirme {
  background: var(--olive); color: var(--paper); border-color: var(--olive);
}
.list-status.pending {
  background: transparent; color: var(--ink-mute);
  border-color: var(--line-strong);
}
.list-status.rejected, .list-status.refuse {
  background: transparent; color: var(--accent-deep);
  border-color: rgba(151, 73, 46, 0.3);
}
.list-actions { display: flex; gap: 0.4rem; flex-shrink: 0; flex-wrap: wrap; }

/* ===========================================
   App card
   =========================================== */
.app-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 1.25rem 1.5rem;
  display: grid; grid-template-columns: 1fr auto;
  gap: 1.25rem; align-items: center;
  border-radius: 2px;
  transition: border-color 0.25s;
}
.app-card:hover { border-color: var(--ink); }
@media (max-width: 600px) { .app-card { grid-template-columns: 1fr; } }
.app-card-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.2rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.25rem;
}
.app-card-meta {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.88rem;
  color: var(--ink-mute);
  margin-bottom: 0.5rem;
}
.app-card-msg {
  background: var(--paper-soft);
  padding: 0.65rem 0.85rem;
  border-left: 2px solid var(--accent);
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 0.95rem;
  font-style: italic;
  margin-top: 0.6rem;
  border-radius: 0 2px 2px 0;
  color: var(--ink-soft);
  line-height: 1.55;
}
.app-actions { display: flex; gap: 0.4rem; flex-shrink: 0; flex-wrap: wrap; }

/* ===========================================
   Aside
   =========================================== */
.tourn-aside { position: sticky; top: 100px; }
.aside-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 1.75rem;
  margin-bottom: 1rem;
  border-radius: 2px;
}
.aside-card::before { display: none; }
.aside-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.25rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.4rem;
}
.aside-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.92rem;
  color: var(--ink-mute);
  margin-bottom: 1.5rem;
  line-height: 1.5;
}
.aside-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px; margin: 1.25rem 0;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.aside-stat {
  background: var(--paper-soft);
  padding: 0.85rem 0.9rem;
}
.aside-stat-label {
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
}
.aside-stat-val {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.35rem;
  letter-spacing: -0.015em;
  margin-top: 0.3rem;
}
.aside-share {
  padding-top: 1.25rem;
  border-top: 1px solid var(--line);
}
.aside-share-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
  margin-bottom: 0.75rem;
}
.share-row { display: flex; gap: 0.4rem; }
.share-btn {
  width: 36px; height: 36px;
  background: transparent;
  border: 1px solid var(--line-strong);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-mute);
  transition: all 0.2s ease;
  border-radius: 2px;
}
.share-btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.share-btn svg { width: 15px; height: 15px; }

/* ===========================================
   PROFILE pages
   =========================================== */
.profile-hero {
  background: var(--ink); color: var(--paper);
  padding: 4rem var(--container);
  position: relative;
}
.profile-hero::before { display: none; }
.profile-hero.sponsor::before { display: none; }
.profile-hero-inner {
  max-width: 1280px; margin: 0 auto;
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: 2.5rem; flex-wrap: wrap;
}
.profile-avatar {
  width: 84px; height: 84px;
  background: var(--paper);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.75rem;
  letter-spacing: -0.02em;
  border: none;
  border-radius: 3px;
  flex-shrink: 0;
}
.profile-avatar.team { background: var(--olive); color: var(--paper); }
.profile-avatar.sponsor { background: var(--bronze); color: var(--paper); }
.profile-info { flex: 1; min-width: 0; }
.profile-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent-soft);
  margin-bottom: 0.85rem;
}
.profile-name {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: clamp(1.85rem, 4vw, 2.75rem);
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin-bottom: 0.5rem;
}
.profile-meta {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: rgba(247, 247, 244, 0.7);
  font-size: 1rem;
  line-height: 1.5;
}
.profile-body {
  display: grid; grid-template-columns: 1fr 320px;
  gap: 3rem;
}
@media (max-width: 880px) { .profile-body { grid-template-columns: 1fr; gap: 2rem; } }

/* ===========================================
   Players
   =========================================== */
.players-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 0.6rem;
}
.player-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 0.95rem 1rem;
  display: flex; align-items: center; gap: 0.85rem;
  transition: border-color 0.25s;
  border-radius: 2px;
}
.player-card:hover { border-color: var(--ink); }
.player-num {
  width: 36px; height: 36px;
  background: var(--paper-soft);
  color: var(--ink);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1rem;
  letter-spacing: -0.02em;
  flex-shrink: 0;
  border-radius: 2px;
}
.player-info { flex: 1; min-width: 0; }
.player-name {
  font-family: var(--font-sans);
  font-size: 13px; font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.player-pos {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  margin-top: 0.2rem;
}

/* ===========================================
   Availability
   =========================================== */
.avail-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.avail-day {
  padding: 0.65rem 1rem;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  border-radius: 2px;
}
.avail-day.on {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

/* ===========================================
   CALENDAR
   =========================================== */
.cal-section {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 1.75rem;
  margin-bottom: 1.5rem;
  border-radius: 2px;
}
.cal-header {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 1rem;
  margin-bottom: 1.75rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--line);
}
.cal-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.4rem;
  letter-spacing: -0.015em;
}
.match-list { display: flex; flex-direction: column; gap: 0.6rem; }
.match-row {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  padding: 1.1rem 1.25rem;
  display: grid; grid-template-columns: 75px 1fr auto auto;
  gap: 1.5rem; align-items: center;
  transition: border-color 0.25s;
  border-radius: 2px;
}
.match-row:hover { border-color: var(--ink); }
@media (max-width: 700px) {
  .match-row { grid-template-columns: 1fr; gap: 0.65rem; }
}
.match-time {
  font-family: var(--font-serif);
  font-weight: 300;
  text-align: center;
}
.match-time-hr {
  font-size: 1.5rem;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.match-time-day {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  margin-top: 0.45rem;
}
.match-teams {
  display: flex; align-items: center; gap: 1rem;
  min-width: 0;
}
.match-team {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.05rem;
  letter-spacing: -0.015em;
  flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.match-team.right { text-align: right; }
.match-vs {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.95rem;
  color: var(--ink-mute);
  padding: 0 0.5rem;
  flex-shrink: 0;
}
.match-score {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.35rem;
  letter-spacing: -0.01em;
  background: var(--ink);
  color: var(--paper);
  padding: 0.3rem 0.85rem;
  line-height: 1;
  flex-shrink: 0;
  border-radius: 2px;
}
.match-field {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  white-space: nowrap;
}
.match-stage {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  padding: 0.25rem 0.55rem;
  background: var(--paper);
  border: 1px solid var(--line-strong);
  color: var(--ink-mute);
  margin-bottom: 0.5rem;
  border-radius: 2px;
}
.match-stage.finale {
  background: var(--bronze); color: var(--paper); border-color: var(--bronze);
}
.match-stage.demi {
  background: var(--accent); color: var(--paper); border-color: var(--accent);
}
.match-stage.quart {
  background: var(--slate); color: var(--paper); border-color: var(--slate);
}
.match-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }

/* ===========================================
   Sponsor tiers
   =========================================== */
.sponsor-tiers { display: flex; flex-direction: column; gap: 1rem; }
.sponsor-tier {
  border: 1px solid var(--line);
  padding: 1.5rem 1.75rem;
  background: var(--paper);
  border-radius: 2px;
  transition: border-color 0.25s;
}
.sponsor-tier:hover { border-color: var(--ink); }
.sponsor-tier-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 1rem; padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--line);
}
.sponsor-tier-name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.4rem;
  letter-spacing: -0.015em;
}
.sponsor-tier-price {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.2rem;
  letter-spacing: -0.02em;
  color: var(--accent);
}
.sponsor-tier-perks {
  display: flex; flex-direction: column;
  gap: 0.45rem;
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 0.95rem;
  color: var(--ink-soft);
  line-height: 1.5;
}
.sponsor-tier-perks li {
  list-style: none;
  padding-left: 1.2rem;
  position: relative;
}
.sponsor-tier-perks li::before {
  content: "—";
  color: var(--accent);
  position: absolute; left: 0;
}
.tier-foot {
  margin-top: 1.1rem;
  padding-top: 0.85rem;
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 0.5rem;
}
.tier-slots {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  color: var(--ink-mute);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

/* ===========================================
   Animations
   =========================================== */
.anim-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 1rem;
}
.anim-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 1.5rem 1.5rem 1.35rem;
  position: relative; cursor: pointer;
  transition: border-color 0.25s, background 0.25s;
  border-radius: 2px;
}
.anim-card:hover { border-color: var(--ink); }
.anim-card.selected {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink);
}
.anim-card.selected .anim-icon { color: var(--accent-soft); }
.anim-card.selected .anim-name { color: var(--paper); }
.anim-card.selected .anim-desc { color: rgba(247, 247, 244, 0.7); }
.anim-card.selected .anim-price { color: var(--accent-soft); }
.anim-icon {
  font-size: 1.5rem;
  color: var(--accent);
  margin-bottom: 0.85rem;
  font-family: var(--font-serif);
  font-style: italic;
  line-height: 1;
}
.anim-name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.2rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.5rem;
}
.anim-desc {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.9rem;
  color: var(--ink-mute);
  margin-bottom: 0.9rem;
  line-height: 1.5;
}
.anim-price {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.05em;
}
.anim-tag {
  position: absolute; top: 1rem; right: 1rem;
  background: var(--accent); color: var(--paper);
  padding: 0.25rem 0.55rem;
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border-radius: 2px;
}

/* ===========================================
   TOAST + MODAL
   =========================================== */
/* ===== Toggle affichage mot de passe ===== */
.input-pwd-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.input-pwd-wrap .input {
  flex: 1;
  padding-right: 2.8rem;
}
.btn-toggle-pwd {
  position: absolute;
  right: 0.75rem;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.1rem;
  color: var(--ink-mute);
  padding: 0;
  line-height: 1;
}
.btn-toggle-pwd:hover { color: var(--ink); }

/* ===== Ticker bandeau défilant ===== */
.ticker-wrap {
  position: relative; z-index: 110;
  background: var(--accent-2);
  height: 22px;
  overflow: hidden;
  display: flex; align-items: center;
}
.ticker-track {
  display: flex;
  white-space: nowrap;
  animation: ticker 18s linear infinite;
}
.ticker-copy {
  display: flex; align-items: center;
  flex-shrink: 0;
  padding-right: 0;
}
.ticker-item {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink);
  padding: 3px 24px;
  white-space: nowrap;
}
@keyframes ticker {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
@media (prefers-reduced-motion: reduce) {
  .ticker-track { animation: none; }
}

/* ===== Bandeau mode démo ===== */
#demo-banner {
  position: sticky; top: 0; z-index: 200;
  background: var(--accent-2); /* jaune carton — palette §7bis-2 */
  color: var(--ink);
  text-align: center;
  padding: 0.6rem 1rem;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.4;
}
#demo-banner a {
  color: var(--ink);
  text-decoration: underline;
  margin-left: 0.5rem;
}
@media (max-width: 700px) {
  #demo-banner { font-size: 12px; padding: 0.55rem 0.85rem; }
}

.toast-container {
  position: fixed; bottom: 2rem; right: 2rem;
  z-index: 1000;
  display: flex; flex-direction: column; gap: 0.5rem;
}
.toast {
  background: var(--ink); color: var(--paper);
  padding: 0.95rem 1.35rem;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border-left: 2px solid var(--accent);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  max-width: 340px;
  border-radius: 2px;
}
.toast.success { border-color: var(--olive); }
.toast.error { border-color: var(--accent); }
@keyframes toastIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes toastOut { to { transform: translateX(120%); opacity: 0; } }

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(27, 31, 26, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 1rem;
  animation: fadeIn 0.25s ease;
  overflow-y: auto;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 2.5rem;
  max-width: 540px; width: 100%;
  position: relative;
  max-height: 90vh; overflow-y: auto;
  border-radius: 3px;
}
.modal::before { display: none; }
.modal-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.6rem;
  letter-spacing: -0.02em;
  margin-bottom: 0.85rem;
}
.modal-body {
  font-family: var(--font-serif);
  font-weight: 300;
  color: var(--ink-soft);
  margin-bottom: 1.75rem;
  line-height: 1.6;
  font-size: 1rem;
}
.modal-actions {
  display: flex; gap: 0.6rem;
  justify-content: flex-end; flex-wrap: wrap;
}

/* ===========================================
   FOOTER
   =========================================== */
.footer {
  background: var(--ink);
  color: rgba(247, 247, 244, 0.75);
  padding: 4rem var(--container) 2rem;
  margin-top: auto;
}
.footer-legal-links { display: inline-flex; gap: 1rem; flex-wrap: wrap; }
.footer-legal-link { color: var(--ink-mute); text-decoration: none; font-size: 13px; transition: color 0.15s; }
.footer-legal-link:hover { color: var(--accent); }
.legal-page { max-width: 760px; margin: 0 auto; padding: 1rem 0 3rem; }
.legal-page h1 { font-family: var(--font-serif); font-weight: 700; font-size: clamp(1.8rem, 3.5vw, 2.6rem); letter-spacing: -0.02em; color: var(--ink); margin-bottom: 0.5rem; }
.legal-page .legal-updated { font-family: var(--font-sans); font-size: 13px; color: var(--ink-mute); margin-bottom: 2rem; }
.legal-page h2 { font-family: var(--font-serif); font-weight: 600; font-size: 1.3rem; letter-spacing: -0.02em; color: var(--accent); margin: 2rem 0 0.75rem; }
.legal-page p, .legal-page li { font-family: var(--font-sans); font-size: 15px; line-height: 1.65; color: var(--ink-soft); }
.legal-page p { margin-bottom: 0.85rem; }
.legal-page ul { margin: 0 0 0.85rem 1.25rem; }
.legal-page li { margin-bottom: 0.4rem; }
.legal-page a { color: var(--accent); }
.legal-page strong { color: var(--ink); font-weight: 600; }
.legal-note { background: var(--paper-soft); border-left: 3px solid var(--accent); border-radius: 4px; padding: 0.85rem 1.1rem; margin: 1rem 0; font-size: 14px; }

.footer-inner {
  max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: 1.5fr 2fr;
  gap: 3.5rem;
}
@media (max-width: 720px) { .footer-legal-links { display: inline-flex; gap: 1rem; flex-wrap: wrap; }
.footer-legal-link { color: var(--ink-mute); text-decoration: none; font-size: 13px; transition: color 0.15s; }
.footer-legal-link:hover { color: var(--accent); }

.legal-page .legal-updated { font-family: var(--font-sans); font-size: 13px; color: var(--ink-mute); margin-bottom: 2rem; }

.legal-page p, .legal-page li { font-family: var(--font-sans); font-size: 15px; line-height: 1.65; color: var(--ink-soft); }
.legal-page p { margin-bottom: 0.85rem; }
.legal-page ul { margin: 0 0 0.85rem 1.25rem; }
.legal-page li { margin-bottom: 0.4rem; }
.legal-page a { color: var(--accent); }
.legal-page strong { color: var(--ink); font-weight: 600; }
.legal-note { background: var(--paper-soft); border-left: 3px solid var(--accent); border-radius: 4px; padding: 0.85rem 1.1rem; margin: 1rem 0; font-size: 14px; }

.footer-inner { grid-template-columns: 1fr; } }
.footer-brand .brand-mark { background: var(--accent-2); color: #fff; }
.footer-brand .brand-name { color: var(--paper); }
/* Bande éditoriale §7ter */
.site-footer-editorial {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.6rem var(--container);
  background: var(--paper-deep);
  border-top: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;

}

  display: grid;

@media (max-width: 700px) {
  .nav-links { display: none; }

.fade-in {
  opacity: 0;

}

/* ===== Real signup success screen ===== */
.real-signup-success .icon {
  font-family: var(--font-serif); font-style: italic;
  font-size: 3rem; color: var(--accent);
  margin-bottom: 1rem; line-height: 1; text-align: center;
}
.real-signup-success { padding: 0.5rem 0; }

/* ===== User dropdown menu (connected nav) ===== */
.nav-user-menu { position: relative; }
.nav-user-btn { padding: 0.35rem 0.7rem; border: 1px solid var(--line); }
.nav-user-btn:hover { border-color: var(--ink); }
.nav-user-dropdown {
  position: absolute; top: calc(100% + 0.5rem); right: 0;
  background: var(--paper); border: 1px solid var(--ink);
  min-width: 240px; z-index: 200;
  display: none;
  border-radius: 2px;
  box-shadow: 0 8px 24px rgba(27, 31, 26, 0.12);
  overflow: hidden;
}
.nav-user-dropdown.open { display: block; }
.nav-dd-head {
  padding: 1rem 1.1rem 0.85rem;
  border-bottom: 1px solid var(--line);
  background: var(--paper-soft);
}
.nav-dd-name {
  font-family: var(--font-serif); font-weight: 400;
  font-size: 1rem; letter-spacing: -0.015em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav-dd-sub {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--accent); margin-top: 0.3rem;
}
.nav-dd-link {
  display: block; width: 100%; text-align: left;
  padding: 0.7rem 1.1rem;
  font-family: var(--font-sans); font-size: 13px;
  color: var(--ink-soft); cursor: pointer;
  background: transparent; border: none;
  letter-spacing: -0.005em;
  transition: background 0.15s, color 0.15s;
}
.nav-dd-link:hover {
  background: var(--paper-soft); color: var(--ink);
}
.nav-dd-sep { border-top: 1px solid var(--line); margin: 0.25rem 0; }
.nav-dd-logout { color: var(--accent-deep) !important; }
.nav-dd-logout:hover { background: rgba(151, 73, 46, 0.06) !important; color: var(--accent-deep) !important; }

/* ===== Tournament detail info grid ===== */
.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.info-item {
  background: var(--paper);
  padding: 1rem 1.1rem;
}
.info-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
  margin-bottom: 0.5rem;
}
.info-val {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.05rem;
  letter-spacing: -0.015em;
  color: var(--ink);
  line-height: 1.3;
}

/* ===== Venue box ===== */
.venue-box {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  padding: 1.25rem 1.5rem;
  border-radius: 2px;
}
.venue-name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.2rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.4rem;
}
.venue-address {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mute);
  margin-bottom: 0.85rem;
}
.venue-map-link {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
  border-bottom: 1px solid var(--accent);
  padding-bottom: 1px;
}
.venue-map-link:hover { color: var(--accent-deep); }

/* ===== Contact box ===== */
.contact-box {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  padding: 1.25rem 1.5rem;
  border-radius: 2px;
}
.contact-box > p {
  font-family: var(--font-serif);
  font-size: 1.1rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.75rem;
}
.contact-lines { display: flex; gap: 1.5rem; flex-wrap: wrap; }
.contact-line {
  font-family: var(--font-mono);
  font-size: 13px; font-weight: 500;
  color: var(--ink-soft);
  border-bottom: 1px solid var(--line);
  padding-bottom: 1px;
  transition: color 0.2s;
}
.contact-line:hover { color: var(--accent); border-color: var(--accent); }

/* ===== Pain section (3 douleurs) ===== */
.section-pain {
  padding: 5rem var(--container);
  background: var(--paper);
}
.pain-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin-top: 3rem;
}
@media (max-width: 900px) { .pain-grid { grid-template-columns: 1fr; } }
.pain-card {
  background: var(--paper);
  padding: 2rem 1.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}
.pain-card-icon {
  width: 56px; height: 56px;
  background: rgba(184, 92, 60, 0.08);
  border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  margin-bottom: 1.25rem;
  flex-shrink: 0;
}
.pain-num {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
}
.pain-title {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: 1.25rem;
  letter-spacing: -0.02em;
  color: var(--ink);
  line-height: 1.25;
}
.pain-desc {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink-soft);
}

/* ===== How it works section ===== */
.section-how {
  padding: 5rem var(--container);
  background: var(--paper-soft);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.how-grid {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-top: 3rem;
  border: 1px solid var(--line);
}
.how-step {
  display: flex;
  align-items: flex-start;
  gap: 2rem;

  transition: background 0.2s;
}
.how-step:last-child { border-bottom: none; }
.how-step:hover { background: var(--paper-soft); }
.how-step-icon {
  color: var(--accent);

  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(184, 92, 60, 0.08);
  border-radius: 2px;

}
.how-step-num {
  font-family: var(--font-mono);

  flex-shrink: 0;
  border-radius: 2px;
  margin-top: 0.15rem;
}
.how-step-body { flex: 1; }
.how-step-title {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 0.5rem;
}
.how-step-desc {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink-soft);
}

.section-cta {
  background: var(--ink);

  border-top: 3px solid var(--accent);
}
.cta-inner {

}

/* ===== Module finances ===== */
.fin-notice {
  display: flex;
  align-items: flex-start;
  gap: 0.85rem;

  margin-bottom: 0.25rem;
}
.fin-notice-icon {
  font-size: 1.1rem;
  flex-shrink: 0;
  margin-top: 0.1rem;

/* ===== Module finances ===== */
.fin-bilan {
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--ink);
  color: var(--paper);

  margin-bottom: 0.5rem;
}

  flex: 1;
  padding: 1.5rem 1.25rem;

.fin-bilan-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;

  margin-bottom: 0.5rem;
}
.fin-bilan-val {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.6rem;
  letter-spacing: -0.02em;
  line-height: 1;

.fin-green { color: #4caf7d; }
.fin-red { color: #e07060; }

  flex-direction: column;
  gap: 0;
  border: 1px solid var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.fin-empty {
  padding: 1rem 1.25rem;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 0.9rem;
  color: var(--ink-mute);

.fin-row {

  gap: 0.75rem;
  padding: 0.85rem 1.25rem;
  border-bottom: 1px solid var(--line);

.fin-row:last-child { border-bottom: none; }
.fin-row-auto { background: var(--paper-soft); }
.fin-row-manual { background: var(--paper-soft); padding: 0.65rem 1rem; }
.fin-row-add { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; width: 100%; }

}

/* Anti-scraper contact display — email/tel affiché via CSS pseudo-éléments  */
/* Un aspirateur de HTML brut ne voit que data-a et data-b fragmentés         */
/* Un robot sans CSS ne peut pas reconstituer l'adresse complète              */
.contact-css-reveal {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.65rem 1rem;
  background: var(--paper);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 2px;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.2s;
  /* Empêche la sélection directe du texte par les bots                       */
  user-select: none;
  -webkit-user-select: none;
}
.contact-css-reveal:hover { border-color: var(--accent); color: var(--accent); }
/* Les deux moitiés du contact sont assemblées uniquement via CSS content     */
.contact-css-reveal::before {
  content: attr(data-a);
  letter-spacing: 0;
}
.contact-css-reveal::after {
  content: attr(data-b);
  letter-spacing: 0;
}
/* Icône selon le type */
.contact-css-reveal[data-k="email"]::before {
  content: "✉  " attr(data-a);
}
.contact-css-reveal[data-k="phone"]::before {
  content: "☎  " attr(data-a);
}

const SAISON_BASCULE_MOIS = 7;  // juillet = bascule saison (calendrier FFF)
const SEUIL_URGENT_PLACES = 3;  // places restantes déclenchant badge urgent

/** Retourne la saison en cours au format "AAAA–AA" */
function getSaison() {
  const now   = new Date();
  const annee = now.getFullYear();
  const mois  = now.getMonth() + 1; // 1 = janvier
  if (mois >= SAISON_BASCULE_MOIS) {
    return `${annee}–${String(annee + 1).slice(-2)}`;
  } else {
    return `${annee - 1}–${String(annee).slice(-2)}`;
  }
}

/** Nombre de places restantes pour un tournoi (calcul côté client) */
function placesRestantes(tournoi) {
  if (!tournoi.maxTeams) return null;
  const inscrits = (state.registrations || [])
    .filter(r => r.tournamentId === tournoi.id && r.status === 'approved')
    .length;
  return tournoi.maxTeams - inscrits;
}

  messages.push(`${open.length} TOURNOI${open.length !== 1 ? 'S' : ''} OUVERT${open.length !== 1 ? 'S' : ''} EN IDF`);
  open.forEach(t => {
    const places = placesRestantes(t);
    if (places !== null && places <= SEUIL_URGENT_PLACES && places > 0) {
      messages.push(`${t.name.toUpperCase()} : ${places} PLACE${places > 1 ? 'S' : ''} RESTANTE${places > 1 ? 'S' : ''}`);

  });
  const SEP = ' ·· ';
  const html = messages.map(m =>
    `<span class="ticker-item">${escapeHtml(m)}</span>`
  ).join(`<span class="ticker-item" aria-hidden="true">${SEP}</span>`);

  const c2 = document.getElementById('ticker-c2');
  if (c1) c1.innerHTML = html;
  if (c2) c2.innerHTML = html; // copie identique pour loop CSS sans JS

// Helper : envoyer une inscription réelle vers Supabase
async function submitRealSignup(type, data, consents) {
  if (!supabaseClient) {
    return {
      error: 'La connexion à la base de données est indisponible. Vérifiez les clés Supabase dans le fichier.'
    };
  }

  const table = type === 'club'
    ? 'clubs'
    : type === 'team'
    ? 'teams'
    : 'sponsors';

  // Whitelist stricte : seules les colonnes qui existent dans Supabase
  let payload = {};

  if (type === 'club') {
    payload = {
      name:            data.name       || null,
      email:           data.email      || null,
      president:       data.president  || null,
      phone:           data.phone      || null,
      department:      data.department || null,
      city:            data.city       || null,
      status:          'pending',
      activation_code: data._activationCode || null,
      password:        data.password   || null,
      recovery_code:   data._recoveryCode || null
    };
  } else if (type === 'team') {
    payload = {
      name:            data.name            || null,
      email:           data.email           || null,
      manager:         data.manager         || null,
      phone:           data.phone           || null,
      club:            '',
      category:        '',
      level:           '',
      password:        data.password        || null,
      activation_code: data._activationCode || null,
      recovery_code:   data._recoveryCode   || null
      // status omis — défaut serveur 'new' (DBA confirmé)
    };
  } else {
    payload = {
      name:            data.name            || null,
      email:           data.email           || null,
      sector:          data.sector          || null,
      contact:         data.contact         || null,
      phone:           data.phone           || null,
      budget_range:    data.budgetRange     || null,
      password:        data.password        || null,
      activation_code: data._activationCode || null,
      recovery_code:   data._recoveryCode   || null
      // status omis — défaut serveur 'new' (DBA confirmé)
    };
  }

  // Supprimer les clés null pour éviter les erreurs de colonnes non renseignées
  Object.keys(payload).forEach((key) => {
    if (payload[key] === null) {
      delete payload[key];
    }
  });


  // Trace du consentement RGPD
  const consentRow = {
    email: data.email,
    account_type: type,
    consent_data_collection: consents.dataCollection === true,
    consent_marketing: consents.marketing === true
  };

  try {
    // IMPORTANT :
    // Ne pas ajouter .select() ici.
    // L'inscription publique doit insérer sans relire la ligne,
    // sinon il faut aussi une policy SELECT sur la table.
    const { error: err1 } = await supabaseClient
      .from(table)
      .insert([payload]);

    console.log('[Le Tournoi] INSERT result → error:', err1);

    if (err1) {
      console.error('[Le Tournoi] Supabase error:', err1);

      if (err1.code === '23505') {
        return { error: 'Cette adresse email est déjà enregistrée.' };

      return { error: 'Inscription impossible : ' + err1.message };

    // Consentement RGPD : non bloquant
    try {
      const { error: consentError } = await supabaseClient
        .from('consents')
        .insert([consentRow]);

      if (consentError) {
        console.warn('[Le Tournoi] Consentement non enregistré:', consentError);
      }
    } catch (ce) {
      console.warn('[Le Tournoi] Erreur consentement non bloquante:', ce);
    }

    return { account: payload };
  } catch (e) {
    return { error: 'Erreur réseau : ' + e.message };
  }

// ===========================================
// PERSISTANCE TOURNOIS — Supabase (jalon J1)
