<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Tournoi — la plateforme des tournois de foot amateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* =====================================================
   LE TOURNOI — design sobre, éditorial, premium
   Palette : navy nuit / ivoire chaud / terracotta discrète
   Typo : Fraunces (serif éditoriale) + Inter (texte) + JetBrains Mono (détails)
   ===================================================== */

:root {
  /* Encre — bleus nuit profonds */
  --ink: #1A1F2E;
  --ink-soft: #2C3346;
  --ink-mute: #5A6378;
  --ink-faint: #8A93A8;

  /* Papier — ivoires chauds */
  --paper: #FAF7F2;
  --paper-soft: #F2EEE6;
  --paper-deep: #E8E2D5;

  /* Accent — terracotta sobre */
  --accent: #B85C3C;
  --accent-deep: #97492E;
  --accent-soft: #D4886A;

  /* Tons secondaires */
  --olive: #5C6B3F;
  --bronze: #9B7A4A;
  --slate: #4A5568;

  /* Filets et séparateurs */
  --line: rgba(26, 31, 46, 0.10);
  --line-soft: rgba(26, 31, 46, 0.05);
  --line-strong: rgba(26, 31, 46, 0.20);

  /* Typo */
  --font-serif: 'Fraunces', 'Times New Roman', serif;
  --font-sans: 'Inter', -apple-system, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

  /* Espacement */
  --container: clamp(1.25rem, 4vw, 3rem);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  display: flex; flex-direction: column;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; }
::selection { background: var(--ink); color: var(--paper); }

/* ===========================================
   NAVIGATION — sobre, ligne fine, beaucoup d'air
   =========================================== */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(250, 247, 242, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 1.1rem var(--container);
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
}
.brand { display: flex; align-items: center; gap: 0.75rem; }
.brand-mark {
  width: 32px; height: 32px;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  font-size: 18px;
  letter-spacing: -0.02em;
  border-radius: 2px;
}
.brand-mark span { transform: translateY(-1px); }
.brand-name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 20px;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.brand-name .dot { color: var(--accent); }
.nav-links {
  display: flex; gap: 2.25rem; align-items: center;
  font-size: 13px; font-weight: 500;
  letter-spacing: -0.005em;
}
.nav-link {
  color: var(--ink-mute);
  transition: color 0.25s ease;
  position: relative; padding: 0.3rem 0;
}
.nav-link:hover, .nav-link.active { color: var(--ink); }
.nav-link.active::after {
  content: ""; position: absolute;
  bottom: -32px; left: 0; right: 0;
  height: 1px; background: var(--accent);
}
.nav-right { display: flex; align-items: center; gap: 0.65rem; }
.role-badge {
  font-family: var(--font-mono); font-size: 10px;
  padding: 0.3rem 0.55rem;
  background: var(--paper-soft);
  color: var(--ink-mute);
  border: 1px solid var(--line);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 500;
}

/* ===========================================
   BOUTONS — minimal, ligne fine, pas d'ombre dure
   =========================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem;
  padding: 0.7rem 1.4rem;
  font-family: var(--font-sans);
  font-size: 13px; font-weight: 500;
  letter-spacing: -0.005em;
  transition: all 0.25s ease;
  white-space: nowrap;
  border: 1px solid transparent;
  border-radius: 2px;
  cursor: pointer;
}
.btn-primary {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink);
}
.btn-primary:hover {
  background: var(--ink-soft); border-color: var(--ink-soft);
}
.btn-orange {
  background: var(--accent); color: var(--paper);
  border-color: var(--accent);
}
.btn-orange:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn-outline {
  border-color: var(--line-strong); color: var(--ink);
  background: transparent;
}
.btn-outline:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-ghost { color: var(--ink-mute); background: transparent; }
.btn-ghost:hover { color: var(--ink); }
.btn-success { background: var(--olive); color: var(--paper); border-color: var(--olive); }
.btn-success:hover { background: #4a5732; border-color: #4a5732; }
.btn-danger {
  color: var(--accent-deep);
  border: 1px solid rgba(151, 73, 46, 0.25);
  background: transparent;
}
.btn-danger:hover { background: rgba(151, 73, 46, 0.06); border-color: rgba(151, 73, 46, 0.4); }
.btn-lg { padding: 0.9rem 1.8rem; font-size: 14px; }
.btn-sm { padding: 0.5rem 1rem; font-size: 12px; }
.btn-full { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-arrow {
  width: 6px; height: 6px;
  border-top: 1.5px solid currentColor;
  border-right: 1.5px solid currentColor;
  transform: rotate(45deg);
  transition: transform 0.25s ease;
  margin-left: 0.15rem;
}
.btn:hover .btn-arrow { transform: rotate(45deg) translate(2px, -2px); }

/* ===========================================
   LAYOUT
   =========================================== */
.main { flex: 1; width: 100%; }
.container { max-width: 1280px; margin: 0 auto; padding: 0 var(--container); }
.section { padding: 4rem 0; }
.section-lg { padding: 6rem 0; }

.page-head {
  padding: 4rem var(--container) 3rem;
  border-bottom: 1px solid var(--line);
  max-width: 1280px; margin: 0 auto;
}
.page-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 1rem;
}
.page-title {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: clamp(2.5rem, 5.5vw, 4.5rem);
  line-height: 1.02;
  letter-spacing: -0.025em;
  max-width: 900px;
}
.page-title em {
  font-style: italic;
  font-weight: 300;
  color: var(--accent);
}
.page-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.15rem;
  font-style: italic;
  color: var(--ink-mute);
  margin-top: 1.5rem;
  max-width: 580px;
  line-height: 1.55;
  letter-spacing: -0.005em;
}
.page-head-actions {
  display: flex; gap: 0.65rem;
  margin-top: 2rem; flex-wrap: wrap;
}

/* ===========================================
   HERO — éditorial, large, calme
   =========================================== */
.hero {
  background: var(--paper);
  padding: 5rem var(--container) 4rem;
  position: relative;
  border-bottom: 1px solid var(--line);
}
.hero-grid {
  max-width: 1280px; margin: 0 auto;
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 4rem; align-items: end;
}
@media (max-width: 880px) { .hero-grid { grid-template-columns: 1fr; gap: 3rem; } }
.hero-content { position: relative; z-index: 2; }
.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 1.75rem;
  display: flex; align-items: center; gap: 0.85rem;
}
.hero-eyebrow::before {
  content: ""; width: 28px; height: 1px;
  background: var(--accent);
}
.hero-h1 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: clamp(2.8rem, 7vw, 5.5rem);
  line-height: 1;
  letter-spacing: -0.03em;
  margin-bottom: 1.75rem;
  color: var(--ink);
}
.hero-h1 em {
  font-style: italic;
  font-weight: 300;
  color: var(--accent);
}
.hero-h1 .underline {
  position: relative;
  display: inline-block;
}
.hero-h1 .underline::after {
  content: ""; position: absolute;
  bottom: 0.05em; left: 0; right: 0;
  height: 1px; background: var(--accent);
}
.hero-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: clamp(1.05rem, 1.4vw, 1.25rem);
  line-height: 1.55;
  color: var(--ink-soft);
  max-width: 520px;
  margin-bottom: 2.25rem;
  letter-spacing: -0.005em;
}
.hero-actions { display: flex; gap: 0.65rem; flex-wrap: wrap; }

.hero-numbers {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2rem 2.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--line);
  align-self: end;
}
.hero-number-val {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 2.75rem;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.hero-number-val em {
  font-style: italic;
  color: var(--accent);
}
.hero-number-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
  margin-top: 0.65rem;
}
.hero-deco { display: none; }

/* ===========================================
   ACCOUNT ROLES — cards minimales
   =========================================== */
.roles-section {
  background: var(--paper);
  padding: 6rem var(--container);
  border-bottom: 1px solid var(--line);
}
.roles-grid {
  max-width: 1280px; margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
@media (max-width: 880px) { .roles-grid { grid-template-columns: 1fr; } }
.role-card {
  background: var(--paper);
  padding: 2.5rem 2rem;
  transition: background 0.3s ease;
  display: flex; flex-direction: column;
}
.role-card:hover { background: var(--paper-soft); }
.role-card-eye {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--accent);
  margin-bottom: 1.5rem;
}
.role-card-title {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.7rem;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-bottom: 1rem;
}
.role-card-title em {
  font-style: italic;
  color: var(--accent);
}
.role-card-desc {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mute);
  font-size: 0.98rem;
  margin-bottom: 1.5rem;
  line-height: 1.5;
}
.role-card-bullets {
  list-style: none;
  margin-bottom: 2rem;
  display: flex; flex-direction: column;
  gap: 0.55rem;
}
.role-card-bullets li {
  font-size: 13.5px;
  padding-left: 1.25rem;
  position: relative;
  color: var(--ink-soft);
  line-height: 1.5;
}
.role-card-bullets li::before {
  content: "—";
  color: var(--accent);
  position: absolute; left: 0;
  font-weight: 400;
}

/* ===========================================
   Section common
   =========================================== */
.section-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 1rem;
}
.section-h2 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: clamp(2rem, 4vw, 3rem);
  line-height: 1.05;
  letter-spacing: -0.025em;
  margin-bottom: 2.5rem;
  max-width: 800px;
}
.section-h2 em {
  font-style: italic;
  color: var(--accent);
}

/* ===========================================
   GRIDS
   =========================================== */
.grid { display: grid; gap: 1.5rem; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

/* ===========================================
   CARDS — épurées, gradient subtil, ligne fine
   =========================================== */
.t-card {
  background: var(--paper);
  border: 1px solid var(--line);
  position: relative;
  display: flex; flex-direction: column;
  transition: border-color 0.3s ease, transform 0.3s ease;
  overflow: hidden; cursor: pointer;
  border-radius: 3px;
}
.t-card:hover {
  border-color: var(--ink);
  transform: translateY(-2px);
}
.t-card-img {
  height: 140px;
  background: linear-gradient(135deg, var(--ink) 0%, var(--ink-soft) 100%);
  position: relative;
  overflow: hidden;
}
.t-card-img.alt-1 { background: linear-gradient(135deg, var(--olive) 0%, #2c3522 100%); }
.t-card-img.alt-2 { background: linear-gradient(135deg, var(--bronze) 0%, #6e5532 100%); }
.t-card-img.alt-3 { background: linear-gradient(135deg, var(--slate) 0%, #2d3540 100%); }
.t-card-img.alt-4 { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%); }
.t-card-img::after {
  content: ""; position: absolute;
  inset: 0;
  background: radial-gradient(circle at 70% 30%, rgba(250,247,242,0.08) 0%, transparent 60%);
}
.t-card-mark {
  position: absolute; top: 1.1rem; left: 1.25rem;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: rgba(250, 247, 242, 0.7);
}
.t-card-num {
  position: absolute; bottom: 0.4rem; right: 1.25rem;
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 300;
  font-size: 5rem;
  line-height: 1;
  color: rgba(250, 247, 242, 0.12);
  letter-spacing: -0.04em;
}
.t-card-body {
  padding: 1.5rem 1.5rem 1.5rem;
  flex: 1; display: flex; flex-direction: column;
}
.t-card-club {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--accent);
  margin-bottom: 0.85rem;
}
.t-card-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.4rem;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-bottom: 0.5rem;
}
.t-card-meta {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.92rem;
  color: var(--ink-mute);
  margin-bottom: 1.25rem;
}
.t-card-foot {
  margin-top: auto;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
}
.t-card-status {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 0.3rem 0.6rem;
  border: 1px solid var(--line);
  border-radius: 2px;
}
.t-card-status.open { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.t-card-status.draft { background: transparent; color: var(--ink-mute); }
.t-card-status.live { background: var(--olive); color: var(--paper); border-color: var(--olive); }
.t-card-progress {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  color: var(--ink-soft);
}

/* ===========================================
   FORMS
   =========================================== */
.form-group { margin-bottom: 1.5rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
@media (max-width: 600px) {
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
}
.form-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-mute);
  margin-bottom: 0.6rem;
}
.form-help {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 12.5px;
  color: var(--ink-mute);
  margin-top: 0.5rem;
  line-height: 1.5;
}
.input, .select, .textarea {
  width: 100%;
  padding: 0.85rem 1rem;
  background: var(--paper);
  border: 1px solid var(--line-strong);
  font-size: 14px;
  color: var(--ink);
  font-family: var(--font-sans);
  border-radius: 2px;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--ink);
  background: var(--paper);
}
.textarea { resize: vertical; min-height: 110px; line-height: 1.5; }

.radio-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 0.5rem;
}
.radio-c {
  padding: 1rem 1.1rem;
  border: 1px solid var(--line-strong);
  cursor: pointer;
  transition: all 0.2s ease;
  background: var(--paper);
  border-radius: 2px;
}
.radio-c:hover { border-color: var(--ink); }
.radio-c.selected {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink);
}
.radio-c-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.1rem;
  letter-spacing: -0.01em;
  margin-bottom: 0.2rem;
}
.radio-c-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 12.5px;
  opacity: 0.85;
}

.form-error {
  background: rgba(151, 73, 46, 0.08);
  color: var(--accent-deep);
  border: 1px solid rgba(151, 73, 46, 0.2);
  padding: 0.85rem 1rem;
  font-size: 13px;
  margin-bottom: 1rem;
  border-radius: 2px;
  display: none;
}
.form-error.show { display: block; }

.day-checks { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.day-check {
  padding: 0.55rem 0.9rem;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  user-select: none;
  transition: all 0.2s ease;
  border-radius: 2px;
}
.day-check:hover { border-color: var(--ink); }
.day-check.selected {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink);
}

/* ===========================================
   AUTH
   =========================================== */
.auth-page { max-width: 480px; margin: 5rem auto; padding: 0 var(--container); }
.auth-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 3rem 2.5rem;
  border-radius: 3px;
}
.auth-card::before { display: none; }
.auth-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 1rem;
}
.auth-title {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 2.25rem;
  letter-spacing: -0.025em;
  line-height: 1.05;
  margin-bottom: 0.6rem;
}
.auth-title em {
  font-style: italic;
  font-weight: 300;
  color: var(--accent);
}
.auth-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mute);
  font-size: 1rem;
  margin-bottom: 2rem;
  line-height: 1.5;
}
.auth-footer-link {
  margin-top: 1.75rem; text-align: center;
  font-size: 13px; color: var(--ink-mute);
}
.auth-footer-link a {
  color: var(--ink); font-weight: 500;
  border-bottom: 1px solid var(--accent);
  padding-bottom: 1px;
  transition: border-color 0.2s;
}
.auth-footer-link a:hover { border-color: var(--ink); }
.auth-demo {
  margin-top: 1.5rem;
  padding: 1.1rem 1.25rem;
  background: var(--paper-soft);
  border-left: 2px solid var(--accent);
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.8;
  color: var(--ink-soft);
  border-radius: 0 2px 2px 0;
}
.auth-demo code {
  background: var(--ink); color: var(--paper);
  padding: 1px 6px;
  font-size: 10px;
  border-radius: 2px;
}
.auth-tabs {
  display: flex; gap: 0;
  border: 1px solid var(--line-strong);
  margin-bottom: 1.5rem;
  border-radius: 2px;
  overflow: hidden;
}
.auth-tab {
  flex: 1; padding: 0.85rem 0.5rem;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  cursor: pointer;
  text-align: center;
  border-right: 1px solid var(--line-strong);
  transition: all 0.2s ease;
  background: var(--paper);
}
.auth-tab:last-child { border-right: none; }
.auth-tab:hover { color: var(--ink); background: var(--paper-soft); }
.auth-tab.active {
  background: var(--ink);
  color: var(--paper);
}

.mode-toggle {
  display: flex; gap: 0;
  border: 1px solid var(--line-strong);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}
.mode-toggle-opt {
  flex: 1;
  padding: 0.75rem 0.5rem;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-mute);
  cursor: pointer;
  border-right: 1px solid var(--line-strong);
  background: var(--paper);
  transition: all 0.2s ease;
  line-height: 1.4;
}
.mode-toggle-opt:last-child { border-right: none; }
.mode-toggle-opt:hover { color: var(--ink); background: var(--paper-soft); }
.mode-toggle-opt.active {
  background: var(--accent);
  color: var(--paper);
  border-color: var(--accent);
}
.mode-toggle-opt small {
  display: block;
  font-size: 9px;
  opacity: 0.8;
  margin-top: 2px;
  letter-spacing: 0.05em;
  text-transform: none;
  font-style: italic;
}

.consent-box {
  margin-top: 1.25rem;
  padding: 1.1rem 1.25rem;
  background: var(--paper-soft);
  border: 1px solid var(--line-strong);
  border-left: 3px solid var(--accent);
  border-radius: 2px;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.consent-box label {
  display: flex;
  gap: 0.65rem;
  align-items: flex-start;
  font-size: 12px;
  line-height: 1.55;
  color: var(--ink-soft);
  cursor: pointer;
}
.consent-box input[type="checkbox"] {
  margin-top: 3px;
  flex-shrink: 0;
  accent-color: var(--accent);
  width: 15px; height: 15px;
  cursor: pointer;
}
.consent-box a { color: var(--accent); }

.real-signup-success {
  text-align: center;
}
.real-signup-success .icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--paper);
  font-size: 1.5rem;
  margin: 0 auto 1.5rem;
}

/* ===========================================
   DASHBOARD
   =========================================== */
.dash-greeting {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 2.4rem;
  letter-spacing: -0.025em;
  line-height: 1.05;
  margin-bottom: 0.5rem;
}
.dash-greeting em {
  font-style: italic;
  color: var(--accent);
}
.dash-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mute);
  margin-bottom: 3rem;
  font-size: 1.05rem;
}
.dash-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin-bottom: 3rem;
  border-radius: 2px;
  overflow: hidden;
}
.dash-stat {
  background: var(--paper);
  padding: 1.5rem 1.5rem;
}
.dash-stat-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
  margin-bottom: 0.85rem;
}
.dash-stat-val {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 2.4rem;
  line-height: 1;
  letter-spacing: -0.025em;
  color: var(--ink);
}
.dash-stat-val em {
  font-style: italic;
  color: var(--accent);
}
.dash-section { margin-bottom: 4rem; }
.dash-section-h {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 1.5rem; padding-bottom: 1rem;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
  gap: 0.75rem;
}
.dash-section-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.4rem;
  letter-spacing: -0.015em;
}
.dash-empty {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  padding: 3rem 1.5rem;
  text-align: center;
  border-radius: 2px;
}
.dash-empty-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.3rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.5rem;
}
.dash-empty-text {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mute);
  margin-bottom: 1.25rem;
  font-size: 0.98rem;
}

/* ===========================================
   TOURNAMENT DETAIL HERO
   =========================================== */
.tourn-hero {
  background: var(--ink);
  color: var(--paper);
  padding: 5rem var(--container) 4rem;
  position: relative;
  overflow: hidden;
}
.tourn-hero::before { display: none; }
.tourn-hero-inner {
  max-width: 1280px; margin: 0 auto;
  position: relative; z-index: 2;
}
.tourn-hero-club {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent-soft);
  margin-bottom: 1.25rem;
}
.tourn-hero-title {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  letter-spacing: -0.03em;
  line-height: 1.02;
  margin-bottom: 2rem;
  color: var(--paper);
}
.tourn-hero-title em {
  font-style: italic;
  font-weight: 300;
  color: var(--accent-soft);
}
.tourn-hero-meta {
  display: flex; flex-wrap: wrap;
  gap: 2rem 3.5rem;
  margin-top: 2rem; padding-top: 2rem;
  border-top: 1px solid rgba(250, 247, 242, 0.12);
}
.tourn-meta-item { display: flex; flex-direction: column; gap: 0.5rem; }
.tourn-meta-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: rgba(250, 247, 242, 0.5);
}
.tourn-meta-val {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.15rem;
  letter-spacing: -0.01em;
  color: var(--paper);
}
.tourn-body {
  max-width: 1280px; margin: 0 auto;
  padding: 3rem var(--container) 4rem;
  display: grid; grid-template-columns: 1fr 340px;
  gap: 3.5rem;
}
@media (max-width: 880px) { .tourn-body { grid-template-columns: 1fr; gap: 2rem; } }

.detail-tabs {
  display: flex; gap: 0.25rem;
  border-bottom: 1px solid var(--line);
  margin-bottom: 2.5rem;
  overflow-x: auto;
}
.detail-tab {
  padding: 0.9rem 1.25rem;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  cursor: pointer;
  border-bottom: 1px solid transparent;
  margin-bottom: -1px;
  transition: color 0.25s, border-color 0.25s;
  white-space: nowrap;
  display: inline-flex; align-items: center; gap: 0.5rem;
}
.detail-tab.active { color: var(--ink); border-color: var(--accent); }
.detail-tab:hover { color: var(--ink); }
.tab-badge {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent); color: var(--paper);
  font-size: 9px; font-weight: 600;
  padding: 2px 6px;
  border-radius: 999px;
  min-width: 18px;
}
.detail-content { min-height: 200px; }
.detail-section { margin-bottom: 2.5rem; }
.detail-section-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.3rem;
  letter-spacing: -0.015em;
  margin-bottom: 1.25rem;
  padding-bottom: 0.65rem;
  border-bottom: 1px solid var(--line);
}
.detail-text {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--ink-soft);
  letter-spacing: -0.005em;
}

/* ===========================================
   List rows
   =========================================== */
.list { display: flex; flex-direction: column; gap: 0.6rem; }
.list-row {
  display: flex; align-items: center; gap: 1.25rem;
  padding: 1.1rem 1.25rem;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 2px;
  transition: border-color 0.25s, background 0.25s;
}
.list-row:hover { border-color: var(--ink); background: var(--paper-soft); }
.list-num {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 1.6rem;
  width: 36px;
  color: var(--accent);
  text-align: center;
  flex-shrink: 0;
  line-height: 1;
}
.list-info { flex: 1; min-width: 0; }
.list-name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.1rem;
  letter-spacing: -0.015em;
  line-height: 1.3;
}
.list-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.88rem;
  color: var(--ink-mute);
  margin-top: 0.25rem;
}
.list-status {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 0.3rem 0.6rem;
  border: 1px solid var(--line);
  white-space: nowrap;
  border-radius: 2px;
}
.list-status.paid, .list-status.approved, .list-status.confirme {
  background: var(--olive); color: var(--paper); border-color: var(--olive);
}
.list-status.pending {
  background: transparent; color: var(--ink-mute);
  border-color: var(--line-strong);
}
.list-status.rejected, .list-status.refuse {
  background: transparent; color: var(--accent-deep);
  border-color: rgba(151, 73, 46, 0.3);
}
.list-actions { display: flex; gap: 0.4rem; flex-shrink: 0; flex-wrap: wrap; }

/* ===========================================
   App card
   =========================================== */
.app-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 1.25rem 1.5rem;
  display: grid; grid-template-columns: 1fr auto;
  gap: 1.25rem; align-items: center;
  border-radius: 2px;
  transition: border-color 0.25s;
}
.app-card:hover { border-color: var(--ink); }
@media (max-width: 600px) { .app-card { grid-template-columns: 1fr; } }
.app-card-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.2rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.25rem;
}
.app-card-meta {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.88rem;
  color: var(--ink-mute);
  margin-bottom: 0.5rem;
}
.app-card-msg {
  background: var(--paper-soft);
  padding: 0.65rem 0.85rem;
  border-left: 2px solid var(--accent);
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 0.95rem;
  font-style: italic;
  margin-top: 0.6rem;
  border-radius: 0 2px 2px 0;
  color: var(--ink-soft);
  line-height: 1.55;
}
.app-actions { display: flex; gap: 0.4rem; flex-shrink: 0; flex-wrap: wrap; }

/* ===========================================
   Aside
   =========================================== */
.tourn-aside { position: sticky; top: 100px; }
.aside-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 1.75rem;
  margin-bottom: 1rem;
  border-radius: 2px;
}
.aside-card::before { display: none; }
.aside-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.25rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.4rem;
}
.aside-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.92rem;
  color: var(--ink-mute);
  margin-bottom: 1.5rem;
  line-height: 1.5;
}
.aside-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px; margin: 1.25rem 0;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.aside-stat {
  background: var(--paper-soft);
  padding: 0.85rem 0.9rem;
}
.aside-stat-label {
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
}
.aside-stat-val {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.35rem;
  letter-spacing: -0.015em;
  margin-top: 0.3rem;
}
.aside-share {
  padding-top: 1.25rem;
  border-top: 1px solid var(--line);
}
.aside-share-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
  margin-bottom: 0.75rem;
}
.share-row { display: flex; gap: 0.4rem; }
.share-btn {
  width: 36px; height: 36px;
  background: transparent;
  border: 1px solid var(--line-strong);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-mute);
  transition: all 0.2s ease;
  border-radius: 2px;
}
.share-btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.share-btn svg { width: 15px; height: 15px; }

/* ===========================================
   PROFILE pages
   =========================================== */
.profile-hero {
  background: var(--ink); color: var(--paper);
  padding: 4rem var(--container);
  position: relative;
}
.profile-hero::before { display: none; }
.profile-hero.sponsor::before { display: none; }
.profile-hero-inner {
  max-width: 1280px; margin: 0 auto;
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: 2.5rem; flex-wrap: wrap;
}
.profile-avatar {
  width: 84px; height: 84px;
  background: var(--paper);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.75rem;
  letter-spacing: -0.02em;
  border: none;
  border-radius: 3px;
  flex-shrink: 0;
}
.profile-avatar.team { background: var(--olive); color: var(--paper); }
.profile-avatar.sponsor { background: var(--bronze); color: var(--paper); }
.profile-info { flex: 1; min-width: 0; }
.profile-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent-soft);
  margin-bottom: 0.85rem;
}
.profile-name {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: clamp(1.85rem, 4vw, 2.75rem);
  letter-spacing: -0.025em;
  line-height: 1.05;
  margin-bottom: 0.5rem;
}
.profile-meta {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: rgba(250, 247, 242, 0.7);
  font-size: 1rem;
  line-height: 1.5;
}
.profile-body {
  display: grid; grid-template-columns: 1fr 320px;
  gap: 3rem;
}
@media (max-width: 880px) { .profile-body { grid-template-columns: 1fr; gap: 2rem; } }

/* ===========================================
   Players
   =========================================== */
.players-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 0.6rem;
}
.player-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 0.95rem 1rem;
  display: flex; align-items: center; gap: 0.85rem;
  transition: border-color 0.25s;
  border-radius: 2px;
}
.player-card:hover { border-color: var(--ink); }
.player-num {
  width: 36px; height: 36px;
  background: var(--paper-soft);
  color: var(--ink);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1rem;
  letter-spacing: -0.02em;
  flex-shrink: 0;
  border-radius: 2px;
}
.player-info { flex: 1; min-width: 0; }
.player-name {
  font-family: var(--font-sans);
  font-size: 13px; font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.player-pos {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  margin-top: 0.2rem;
}

/* ===========================================
   Availability
   =========================================== */
.avail-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.avail-day {
  padding: 0.65rem 1rem;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  border-radius: 2px;
}
.avail-day.on {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

/* ===========================================
   CALENDAR
   =========================================== */
.cal-section {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 1.75rem;
  margin-bottom: 1.5rem;
  border-radius: 2px;
}
.cal-header {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 1rem;
  margin-bottom: 1.75rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--line);
}
.cal-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.4rem;
  letter-spacing: -0.015em;
}
.match-list { display: flex; flex-direction: column; gap: 0.6rem; }
.match-row {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  padding: 1.1rem 1.25rem;
  display: grid; grid-template-columns: 75px 1fr auto auto;
  gap: 1.5rem; align-items: center;
  transition: border-color 0.25s;
  border-radius: 2px;
}
.match-row:hover { border-color: var(--ink); }
@media (max-width: 700px) {
  .match-row { grid-template-columns: 1fr; gap: 0.65rem; }
}
.match-time {
  font-family: var(--font-serif);
  font-weight: 300;
  text-align: center;
}
.match-time-hr {
  font-size: 1.5rem;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.match-time-day {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  margin-top: 0.45rem;
}
.match-teams {
  display: flex; align-items: center; gap: 1rem;
  min-width: 0;
}
.match-team {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.05rem;
  letter-spacing: -0.015em;
  flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.match-team.right { text-align: right; }
.match-vs {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.95rem;
  color: var(--ink-mute);
  padding: 0 0.5rem;
  flex-shrink: 0;
}
.match-score {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.35rem;
  letter-spacing: -0.01em;
  background: var(--ink);
  color: var(--paper);
  padding: 0.3rem 0.85rem;
  line-height: 1;
  flex-shrink: 0;
  border-radius: 2px;
}
.match-field {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  white-space: nowrap;
}
.match-stage {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  padding: 0.25rem 0.55rem;

// HELPERS
function uid() { return 'id-' + Math.random().toString(36).slice(2, 10); }
function getAccount() {
  if (!state.currentType) return null;
  const c = state.currentType === 'club' ? 'clubs' : state.currentType === 'team' ? 'teams' : 'sponsors';
  return state[c].find(a => a.id === state.currentId);
}
function getTournament(id) { return state.tournaments.find(t => t.id === id); }
function getAnim(id) { return state.catalog.animations.find(a => a.id === id); }
function getClub(id) { return state.clubs.find(c => c.id === id); }
function getTeam(id) { return state.teams.find(t => t.id === id); }
function getSponsor(id) { return state.sponsors.find(s => s.id === id); }
function esc(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso) {
  const d = new Date(iso);
  const m = ['jan','fév','mar','avr','mai','juin','juil','août','sept','oct','nov','déc'];
  return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDay(iso) {
  const d = new Date(iso);
  return ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][d.getDay()];
}
function fmtMoney(n) { return n === 0 ? 'Gratuit' : `${n} €`; }
function formatLabel(v) { const f = state.catalog.formats.find(x => x.v === v); return f ? f.l : v; }
function levelLabel(v) { const l = state.catalog.levels.find(x => x.v === v); return l ? l.l : v; }
function posLabel(v) { const p = state.catalog.positions.find(x => x.v === v); return p ? p.l : v; }

function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function modal(title, body, actions) {
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3 class="modal-title">${esc(title)}</h3>
        <div class="modal-body">${body}</div>
        <div class="modal-actions">${actions}</div>
      </div>
    </div>`;
}
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }
function navigate(h) { if (window.location.hash === h) render(); else window.location.hash = h; }
function getRoute() { return window.location.hash.slice(1) || '/'; }
window.addEventListener('hashchange', () => { activeTab = 'overview'; render(); });
window.addEventListener('load', render);

// AUTH
function signupAccount(type, d) {
  const coll = type === 'club' ? 'clubs' : type === 'team' ? 'teams' : 'sponsors';
  if (state[coll].find(a => a.email === d.email)) return { error: 'Email déjà utilisé.' };
  const account = { id: uid(), type, ...d };
  state[coll].push(account);
  state.currentType = type; state.currentId = account.id;
  saveState(); return { account };
}
function loginAccount(type, email, pwd) {
  const coll = type === 'club' ? 'clubs' : type === 'team' ? 'teams' : 'sponsors';
  const account = state[coll].find(a => a.email === email && a.password === pwd);
  if (!account) return { error: 'Email ou mot de passe incorrect.' };
  state.currentType = type; state.currentId = account.id;
  saveState(); return { account };
}
function logout() { state.currentType = null; state.currentId = null; saveState(); navigate('#/'); toast('Déconnecté'); }

function render() {
  renderNav(); renderFooter();
  const r = getRoute();
  if (r === '/') return renderHome();
  if (r === '/signup') return renderSignup();
  if (r === '/login') return renderLogin();
  if (r === '/dashboard') return requireAuth(renderDashboard);
  if (r === '/tournaments') return renderTournaments();
  if (r === '/tournaments/new') return requireAuth(renderCreateTournament, ['club']);
  if (r.startsWith('/tournaments/')) return renderTournamentDetail(r.split('/')[2]);
  if (r === '/teams') return renderTeamsList();
  if (r.startsWith('/teams/')) return renderTeamProfile(r.split('/')[2]);
  if (r === '/sponsors') return renderSponsorsList();
  if (r.startsWith('/sponsors/')) return renderSponsorProfile(r.split('/')[2]);
  document.getElementById('app').innerHTML = `<div class="page-head"><h1 class="page-title">404 — <em>introuvable</em></h1><div class="page-head-actions"><a href="#/" class="btn btn-primary">Retour</a></div></div>`;
}
function requireAuth(cb, allowed) {
  const a = getAccount();
  if (!a) { toast('Connecte-toi d\'abord', 'error'); navigate('#/login'); return; }
  if (allowed && !allowed.includes(a.type)) {
    toast('Action réservée à un autre type de compte', 'error');
    navigate('#/dashboard'); return;
  }
  cb();
}

function makeMark(name) {
  return name.split(' ').filter(w => w.length > 1).slice(0, 3).map(w => w[0]).join('').toUpperCase().slice(0, 3);
}

async function handleSignup(e, type) {
  e.preventDefault();
  const errEl = document.getElementById('signup-err');
  errEl.classList.remove('show');
  const name = document.getElementById('f-name').value.trim();
  let d;
  if (type === 'club') {
    d = { name, email: document.getElementById('f-email').value.trim().toLowerCase(),
      password: document.getElementById('f-pwd').value,
      president: document.getElementById('f-pres').value.trim(),
      city: document.getElementById('f-city').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      mark: makeMark(name),
      logoClass: ['alt-1','alt-2','alt-3','alt-4',''][state.clubs.length % 5] };
  } else if (type === 'team') {
    d = { name, email: document.getElementById('f-email').value.trim().toLowerCase(),
      password: document.getElementById('f-pwd').value,
      club: document.getElementById('f-club').value.trim(),
      category: document.getElementById('f-cat').value,
      level: document.getElementById('f-lvl').value,
      manager: document.getElementById('f-mgr').value.trim(),
      city: document.getElementById('f-city').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      mark: makeMark(name), bio: '', availability: ['sat', 'sun'], players: [] };
  } else {
    d = { name, email: document.getElementById('f-email').value.trim().toLowerCase(),
      password: document.getElementById('f-pwd').value,
      sector: document.getElementById('f-sect').value.trim(),
      city: document.getElementById('f-city').value.trim(),
      contact: document.getElementById('f-cont').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      budgetRange: document.getElementById('f-budget').value,
      mark: makeMark(name), description: '', preferredCategories: [] };
  }

  // ====== Inscription réelle (Supabase) ======
  if (signupMode === 'real') {
    const consentData = document.getElementById('consent-data');
    const consentMarketing = document.getElementById('consent-marketing');
    if (!consentData || !consentData.checked) {
      errEl.textContent = 'Coche le consentement RGPD obligatoire pour continuer.';
      errEl.classList.add('show'); return;
    }
    const submitBtn = e.target.querySelector('button[type="submit"]');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Envoi…'; }
    const r = await submitRealSignup(type, d, {
      dataCollection: consentData.checked,
      marketing: consentMarketing ? consentMarketing.checked : false
    });
    if (submitBtn) { submitBtn.disabled = false; }
    if (r.error) {
      errEl.textContent = r.error; errEl.classList.add('show');
      if (submitBtn) submitBtn.innerHTML = type === 'club' ? 'Créer mon club <span class="btn-arrow"></span>' : type === 'team' ? 'Créer mon équipe <span class="btn-arrow"></span>' : 'Devenir sponsor <span class="btn-arrow"></span>';
      return;
    }
    // Succès inscription réelle — affichage écran de confirmation
    document.getElementById('app').innerHTML = `
      <div class="auth-page">
        <div class="auth-card real-signup-success">
          <div class="icon">✓</div>
          <h1 class="auth-title" style="margin-bottom: 1rem;">Merci <em>${escapeHtml(name)}</em>.</h1>
          <p class="detail-text" style="margin-bottom: 1.5rem;">On a bien reçu ta demande d'inscription. <strong>On te recontacte sous 24h</strong> pour t'expliquer la suite et t'accompagner sur tes premiers usages.</p>
          <p class="detail-text" style="margin-bottom: 2rem;">Si tu as une question urgente, écris à <a href="mailto:contact@letournoi.foot" style="border-bottom: 1px solid var(--accent);">contact@letournoi.foot</a>.</p>
          <a href="#/" class="btn btn-primary">Retour à l'accueil</a>
        </div>
      </div>`;
    return;
  }

  // ====== Mode démo (inchangé) ======
  const r = signupAccount(type, d);
  if (r.error) { errEl.textContent = r.error; errEl.classList.add('show'); return; }
  toast('Bienvenue !', 'success');
  navigate('#/dashboard');
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// CALENDAR TAB
function renderTabCalendar(t, isOwner) {
  if (t.matches.length === 0 && !isOwner) {
    return `<div class="dash-empty"><div class="dash-empty-title">Calendrier pas encore publié</div><p class="dash-empty-text">Le club n'a pas encore programmé les matchs.</p></div>`;
  }
  const byStage = { poule: [], quart: [], demi: [], finale: [], autre: [] };
  t.matches.forEach(m => { (byStage[m.stage] || byStage.autre).push(m); });
  const labels = { poule: 'Phase de poules', quart: 'Quarts de finale', demi: 'Demi-finales', finale: 'Finale', autre: 'Autres matchs' };

  return `
    ${isOwner ? `
      <div style="background: var(--paper-deep); border-left: 3px solid var(--accent); padding: 0.9rem 1.1rem; margin-bottom: 1.5rem; font-family: var(--font-mono); font-size: 12px; line-height: 1.5;">
        <strong style="text-transform: uppercase; letter-spacing: 0.1em;">Mode organisateur</strong><br>
        Programme tes matchs avec terrains et horaires. Les équipes verront le calendrier en temps réel.
      </div>
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
        <button class="btn btn-orange btn-sm" onclick="addMatchModal('${t.id}')">+ Ajouter un match</button>
        <button class="btn btn-outline btn-sm" onclick="generateBracketModal('${t.id}')">⚙ Générer le bracket</button>
      </div>` : ''}
    ${t.matches.length === 0 ? `
      <div class="dash-empty">
        <div class="dash-empty-title">Aucun match programmé</div>
        <p class="dash-empty-text">Commence par ajouter ton premier match ou générer le bracket.</p>
      </div>` : Object.keys(byStage).map(stage => {
      const ms = byStage[stage];
      if (ms.length === 0) return '';
      return `
        <div class="cal-section">
          <div class="cal-header">
            <div class="cal-title">${labels[stage]}</div>
            <div style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.1em;">${ms.length} match${ms.length > 1 ? 's' : ''}</div>
          </div>
          <div class="match-list">
            ${ms.sort((a, b) => (a.time || '').localeCompare(b.time || '')).map(m => matchRow(m, t, isOwner)).join('')}
          </div>
        </div>`;
    }).join('')}`;
}
function matchRow(m, t, isOwner) {
  const hasScore = m.scoreA !== null && m.scoreB !== null;
  return `
    <div class="match-row">
      <div class="match-time">
        <div class="match-time-hr">${esc(m.time || '?')}</div>
        <div class="match-time-day">${m.date ? fmtDate(m.date).split(' ').slice(0, 2).join(' ') : ''}</div>
      </div>
      <div>
        ${m.stage !== 'autre' ? `<span class="match-stage ${m.stage}">${m.stage}${m.poule ? ' ' + m.poule : ''}</span>` : ''}
        <div class="match-teams">
          <span class="match-team">${esc(m.teamA || 'À déterminer')}</span>
          ${hasScore ? `<span class="match-score">${m.scoreA} - ${m.scoreB}</span>` : `<span class="match-vs">vs</span>`}
          <span class="match-team right">${esc(m.teamB || 'À déterminer')}</span>
        </div>
      </div>
      <div class="match-field">${esc(m.field || '—')}</div>
      ${isOwner ? `
        <div class="match-actions">
          <button class="btn btn-outline btn-sm" onclick="editMatchModal('${t.id}', '${m.id}')">Édit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteMatch('${t.id}', '${m.id}')">×</button>
        </div>` : `<div></div>`}
    </div>`;
}

  let html = '';
  if (isOwner && pending.length > 0) {
    html += `

        <h3 class="detail-section-title">Demandes en attente (${pending.length})</h3>
        <div class="list">
          ${pending.map(r => `
            <div class="app-card">
              <div>
                <div class="app-card-title">${esc(r.teamName)}</div>
                <div class="app-card-meta">${esc(r.clubName)} · inscription ${fmtDate(r.registeredAt)}${r.teamId ? ' · <a href="#/teams/' + r.teamId + '" style="color: var(--accent); border-bottom: 1px solid;">Voir profil</a>' : ''}</div>
                ${r.message ? `<div class="app-card-msg">"${esc(r.message)}"</div>` : ''}

            </div>`).join('')}
        </div>
      </div>`;
  }
  html += `
    <div class="detail-section">
      <h3 class="detail-section-title">Équipes confirmées (${approved.length}/${t.maxTeams})</h3>
      ${approved.length === 0 ? `
        <div class="dash-empty">
          <div class="dash-empty-title">Pas encore d'équipe confirmée</div>
          <p class="dash-empty-text">${a?.type === 'team' ? 'Sois la première à postuler.' : 'Les inscriptions vont arriver.'}</p>
          ${a?.type === 'team' && !t.registrations.some(r => r.teamId === a.id) ? `<button class="btn btn-orange btn-sm" onclick="applyTournamentModal('${t.id}')">Postuler</button>` : ''}
        </div>` : `
        <div class="list">
          ${approved.map((r, i) => `
            <div class="list-row">
              <div class="list-num">${String(i + 1).padStart(2, '0')}</div>
              <div class="list-info">
                <div class="list-name">${esc(r.teamName)}</div>
                <div class="list-sub">${esc(r.clubName)}${r.teamId ? ' · <a href="#/teams/' + r.teamId + '" style="color: var(--accent); border-bottom: 1px solid;">Profil</a>' : ''}</div>
              </div>
              <span class="list-status approved">✓ Confirmée</span>
            </div>`).join('')}
        </div>`}
    </div>`;
  if (isOwner && rejected.length > 0) {
    html += `
      <div class="detail-section">
        <h3 class="detail-section-title" style="color: var(--ink-mute);">Refusées (${rejected.length})</h3>
        <div class="list" style="opacity: 0.6;">
          ${rejected.map(r => `
            <div class="list-row">
              <div class="list-num">×</div>
              <div class="list-info"><div class="list-name">${esc(r.teamName)}</div><div class="list-sub">${esc(r.clubName)}</div></div>
              <span class="list-status rejected">Refusée</span>
            </div>`).join('')}
        </div>
      </div>`;
  }
  return html;
}

      <h3 class="detail-section-title">${isOwner ? 'Catalogue des animations' : 'Animations prévues'}</h3>

        <div class="anim-grid">
          ${state.catalog.animations.map(an => {
            const sel = t.animations.includes(an.id);
            if (!isOwner && !sel) return '';
            return `
              <div class="anim-card ${sel ? 'selected' : ''}" ${isOwner ? `onclick="toggleAnim('${t.id}', '${an.id}')"` : ''}>
                ${sel ? '<span class="anim-tag">✓ Choisie</span>' : ''}
                <div class="anim-icon">${an.icon}</div>
                <div class="anim-name">${esc(an.name)}</div>
                <div class="anim-desc">${esc(an.desc)}</div>

              </div>`;
          }).join('')}

}
function toggleAnim(tid, aid) {
  const t = getTournament(tid);
  if (t.animations.includes(aid)) { t.animations = t.animations.filter(a => a !== aid); toast('Retirée'); }
  else { t.animations.push(aid); toast('Ajoutée', 'success'); }
  saveState(); renderTournamentDetail(tid);
}

// ASIDE
function renderAside(t, isOwner, a) {
  const conf = t.registrations.filter(r => r.status !== 'rejected').length;
  const spTotal = t.sponsorProposals.filter(sp => sp.status === 'confirme').reduce((s, sp) => s + sp.amount, 0);
  const animTot = t.animations.reduce((s, id) => s + (getAnim(id)?.price || 0), 0);
  const teamsRev = t.registrations.filter(r => r.status === 'approved').length * t.entryFee;
  const canApply = a?.type === 'team' && !t.registrations.some(r => r.teamId === a.id);
  const hasApplied = a?.type === 'team' && t.registrations.some(r => r.teamId === a.id);
  const myReg = hasApplied ? t.registrations.find(r => r.teamId === a.id) : null;
  const canPropose = a?.type === 'sponsor' && !t.sponsorProposals.some(sp => sp.sponsorId === a.id);
  const hasProposed = a?.type === 'sponsor' && t.sponsorProposals.some(sp => sp.sponsorId === a.id);
  const myProp = hasProposed ? t.sponsorProposals.find(sp => sp.sponsorId === a.id) : null;

  let html = `
    <div class="aside-card">
      <div class="aside-title">Inscription</div>
      <p class="aside-sub">${conf}/${t.maxTeams} équipes</p>
      <div class="aside-stats">
        <div class="aside-stat"><div class="aside-stat-label">Places</div><div class="aside-stat-val">${t.maxTeams - conf}</div></div>
        <div class="aside-stat"><div class="aside-stat-label">Tarif</div><div class="aside-stat-val">${fmtMoney(t.entryFee)}</div></div>
      </div>`;
  if (!a) {
    html += `<a href="#/login" class="btn btn-orange btn-full">Se connecter pour postuler</a>`;
  } else if (canApply && conf < t.maxTeams) {
    html += `<button class="btn btn-orange btn-full" onclick="applyTournamentModal('${t.id}')">Postuler avec mon équipe <span class="btn-arrow"></span></button>`;
  } else if (hasApplied) {
    html += `<div style="padding: 0.8rem; background: var(--paper-deep); border-left: 3px solid var(--accent); font-family: var(--font-mono); font-size: 12px;">Statut : <strong>${myReg.status === 'pending' ? 'En attente' : myReg.status === 'approved' ? 'Confirmée' : 'Refusée'}</strong></div>`;
  } else if (conf >= t.maxTeams) {
    html += `<button class="btn btn-outline btn-full" disabled>Complet</button>`;
  } else if (a?.type === 'club') {
    html += `<button class="btn btn-outline btn-full" onclick="quickRegisterModal('${t.id}')">Inscrire manuellement</button>`;
  }
  html += `
    <div class="aside-share">
      <div class="aside-share-label">Partager</div>
      <div class="share-row">
        <a href="https://wa.me/?text=${encodeURIComponent(t.name + ' — ' + fmtDate(t.date) + ' — ' + window.location.href)}" target="_blank" class="share-btn">${ICONS.wa}</a>
        <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank" class="share-btn">${ICONS.fb}</a>
        <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href); toast('Lien copié', 'success')">${ICONS.cp}</button>
      </div>
    </div>
  </div>`;

  if (a?.type === 'sponsor') {
    html += `
      <div class="aside-card">
        <div class="aside-title">Sponsoring</div>
        ${canPropose ? `
          <p class="aside-sub">Soutiens ce tournoi en proposant un sponsoring.</p>
          <button class="btn btn-orange btn-full" onclick="proposeSponsorModal('${t.id}')">Proposer mon sponsoring <span class="btn-arrow"></span></button>
        ` : hasProposed ? `
          <p class="aside-sub">Tu as déjà fait une proposition.</p>
          <div style="padding: 0.8rem; background: var(--paper-deep); border-left: 3px solid var(--accent); font-family: var(--font-mono); font-size: 12px;">
            Statut : <strong>${myProp.status === 'pending' ? 'En attente' : myProp.status === 'confirme' ? 'Acceptée' : 'Refusée'}</strong><br>
            ${esc(myProp.tier).toUpperCase()} · ${myProp.amount}€
          </div>` : ''}
      </div>`;
  }

  if (isOwner) {
    html += `
      <div class="aside-card">
        <div class="aside-title">Budget</div>
        <div class="aside-stats">
          <div class="aside-stat"><div class="aside-stat-label">Recettes équipes</div><div class="aside-stat-val">${teamsRev}€</div></div>
          <div class="aside-stat"><div class="aside-stat-label">Sponsors</div><div class="aside-stat-val">${spTotal}€</div></div>
          <div class="aside-stat"><div class="aside-stat-label">Anim</div><div class="aside-stat-val">${animTot}€</div></div>
          <div class="aside-stat" style="background: var(--ink); color: var(--paper);"><div class="aside-stat-label">Solde net</div><div class="aside-stat-val" style="color: var(--accent);">${teamsRev + spTotal - animTot}€</div></div>
        </div>
      </div>`;
  }

  return html;
}

  m.teamB = document.getElementById('e-tB').value.trim();

  const sA = document.getElementById('e-sA').value;
  const sB = document.getElementById('e-sB').value;

}
function deleteMatch(tid, mid) {
  if (!confirm('Supprimer ce match ?')) return;
  const t = getTournament(tid);
  t.matches = t.matches.filter(m => m.id !== mid);
  saveState(); toast('Match supprimé'); renderTournamentDetail(tid);
}
function generateBracketModal(tid) {
  const t = getTournament(tid);
  const conf = t.registrations.filter(r => r.status === 'approved');
  if (conf.length < 4) { toast('Au moins 4 équipes confirmées requises', 'error'); return; }
  modal('Générer le bracket',
    `<p>Cette action va créer automatiquement les matchs à partir des ${conf.length} équipes confirmées.</p>
     <p style="margin-top: 0.5rem;">Les matchs existants seront remplacés.</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
     <button class="btn btn-orange" onclick="confirmGenerate('${tid}')">Générer</button>`);
}
function confirmGenerate(tid) {
  const t = getTournament(tid);
  const conf = t.registrations.filter(r => r.status === 'approved');
  t.matches = [];
  const shuf = [...conf].sort(() => Math.random() - 0.5);
  let stage = shuf.length <= 4 ? 'demi' : 'quart';
  if (shuf.length === 2) stage = 'finale';
  let hr = 14, field = 1;
  for (let i = 0; i < shuf.length; i += 2) {
    if (shuf[i + 1]) {
      t.matches.push({
        id: uid(), stage, date: t.date,
        time: `${String(hr).padStart(2, '0')}:00`,
        field: `Terrain ${field}`,
        teamA: shuf[i].teamName, teamB: shuf[i + 1].teamName,
        scoreA: null, scoreB: null
      });
      field = field === 1 ? 2 : 1;
      if (field === 1) hr += 1;
    }
  }
  saveState(); closeModal(); toast(`Bracket généré : ${t.matches.length} matchs`, 'success');
  activeTab = 'calendar'; renderTournamentDetail(tid);
}

              <div style="font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--ink-soft);">

              </div>`}
            <div class="aside-share">
              <div class="aside-share-label">Partager</div>
              <div class="share-row">
                <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href); toast('Lien copié', 'success')">${ICONS.cp}</button>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>`;
}

// SPONSORS LIST + PROFILE
function renderSponsorsList() {
  document.getElementById('app').innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow">Annuaire sponsors</div>
      <h1 class="page-title">${state.sponsors.length} sponsors<br>prêts à <em>soutenir</em>.</h1>
      <p class="page-sub">Découvre les commerces qui soutiennent le foot amateur.</p>
      <div class="page-head-actions"><a href="#/signup" class="btn btn-orange">+ Devenir sponsor</a></div>
    </div>
    <div class="container" style="padding-top: 2.5rem; padding-bottom: 3rem;">
      <div class="grid grid-3">
        ${state.sponsors.map(s => `
          <div class="t-card" onclick="navigate('#/sponsors/${s.id}')">
            <div class="t-card-img" style="background: linear-gradient(135deg, var(--bronze) 0%, #6e5532 100%); height: 110px;">
              <span class="t-card-mark">${esc(s.mark)}</span>
            </div>
            <div class="t-card-body">
              <div class="t-card-club">${esc(s.sector)} · ${esc(s.city)}</div>
              <h3 class="t-card-title">${esc(s.name)}</h3>
              <p class="t-card-meta">Budget ${esc(s.budgetRange)}</p>
              <div class="t-card-foot">
                <span class="t-card-status open">Sponsor</span>
                <span class="t-card-progress">${s.preferredCategories.length} cat.</span>
              </div>
            </div>
          </div>`).join('')}
      </div>
    </div>`;
}

function renderSponsorProfile(id) {
  const s = getSponsor(id);
  if (!s) { document.getElementById('app').innerHTML = '<div class="page-head"><h1 class="page-title">Sponsor introuvable</h1></div>'; return; }
  const a = getAccount();
  const isOwner = a?.type === 'sponsor' && a.id === s.id;
  const props = [];
  state.tournaments.forEach(t => t.sponsorProposals.forEach(sp => { if (sp.sponsorId === s.id) props.push({ t, sp }); }));

  document.getElementById('app').innerHTML = `
    <section class="profile-hero sponsor">
      <div class="profile-hero-inner">
        <div class="profile-avatar sponsor">${esc(s.mark)}</div>
        <div class="profile-info">
          <div class="profile-eyebrow">Sponsor · ${esc(s.sector)}</div>
          <h1 class="profile-name">${esc(s.name)}</h1>
          <p class="profile-meta">${esc(s.city)} · Budget ${esc(s.budgetRange)} · ${props.filter(p => p.sp.status === 'confirme').length} tournois soutenus</p>
        </div>
        ${isOwner ? `<button class="btn btn-orange" onclick="editSponsorProfileModal()">Modifier</button>` : ''}
      </div>
    </section>
    <div class="container" style="padding-top: 2.5rem; padding-bottom: 3rem;">
      <div class="profile-body">
        <div>
          <div class="detail-section">
            <h3 class="detail-section-title">À propos</h3>
            <p class="detail-text">${s.description ? esc(s.description) : '<em style="color: var(--ink-mute);">Aucune description.</em>'}</p>
          </div>
          <div class="detail-section">
            <h3 class="detail-section-title">Catégories préférées</h3>
            ${s.preferredCategories.length ? `
              <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
                ${s.preferredCategories.map(c => `<span class="avail-day on">${formatLabel(c)}</span>`).join('')}
              </div>` : '<p class="detail-text"><em style="color: var(--ink-mute);">Aucune préférence définie. Ouvert à tous les tournois.</em></p>'}
          </div>
          ${props.length > 0 ? `
            <div class="detail-section">
              <h3 class="detail-section-title">Engagements (${props.length})</h3>
              <div class="list">
                ${props.map(p => `
                  <div class="list-row" onclick="navigate('#/tournaments/${p.t.id}')" style="cursor: pointer;">
                    <div class="list-num" style="color: ${p.sp.tier === 'or' ? 'var(--bronze)' : p.sp.tier === 'argent' ? 'var(--ink-mute)' : 'var(--bronze)'};">${p.sp.tier === 'or' ? '◆' : p.sp.tier === 'argent' ? '◇' : '●'}</div>
                    <div class="list-info">
                      <div class="list-name">${esc(p.t.name)}</div>
                      <div class="list-sub">${esc(p.sp.tier).toUpperCase()} · ${p.sp.amount}€ · ${fmtDate(p.t.date)}</div>
                    </div>
                    <span class="list-status ${p.sp.status}">${p.sp.status === 'confirme' ? 'Confirmé' : p.sp.status === 'pending' ? 'En attente' : 'Refusé'}</span>
                  </div>`).join('')}
              </div>
            </div>` : ''}
        </div>
        <aside class="tourn-aside">
          <div class="aside-card">
            <div class="aside-title">Coordonnées</div>
            <p class="aside-sub">Contact : ${esc(s.contact)}</p>
            ${!a ? '<p style="font-family: var(--font-serif); font-style: italic; font-size: 0.85rem; color: var(--ink-mute);">Connecte-toi pour voir les coordonnées.</p>' : `
              <div style="font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--ink-soft);">
                <strong>${esc(s.phone || '—')}</strong><br>${esc(s.email)}
              </div>`}
            <div class="aside-stats">
              <div class="aside-stat"><div class="aside-stat-label">Secteur</div><div class="aside-stat-val" style="font-size: 1rem;">${esc(s.sector)}</div></div>
              <div class="aside-stat"><div class="aside-stat-label">Ville</div><div class="aside-stat-val" style="font-size: 1rem;">${esc(s.city)}</div></div>
            </div>
            <div class="aside-share">
              <div class="aside-share-label">Partager</div>
              <div class="share-row">
                <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href); toast('Lien copié', 'success')">${ICONS.cp}</button>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>`;
}

// INIT
saveState();
render();
</script>
</body>
</html>
