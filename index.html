<html lang="fr">

<style>
/* =====================================================
   LE TOURNOI — design sobre, éditorial, premium
   Palette : navy nuit / ivoire chaud / terracotta discrète
   Typo : Poppins (titres) + DM Sans (corps) + JetBrains Mono (mono/détails)
   ===================================================== */

:root {
  /* Encre — bleus nuit profonds */
  --ink: #1A1F2E;
  --ink-soft: #2C3346;
  --ink-mute: #5A6378;
  --ink-faint: #8A93A8;

  /* Papier — ivoires chauds */
  --paper: #FAF7F2;
  --paper-soft: #F2EEE6;
  --paper-deep: #E8E2D5;

  /* Accent — terracotta sobre */
  --accent: #B85C3C;
  --accent-deep: #97492E;
  --accent-soft: #D4886A;

  /* Tons secondaires */
  --olive: #5C6B3F;
  --bronze: #9B7A4A;
  --slate: #4A5568;

  /* Filets et séparateurs */
  --line: rgba(26, 31, 46, 0.10);
  --line-soft: rgba(26, 31, 46, 0.05);
  --line-strong: rgba(26, 31, 46, 0.20);

  /* Typo */
  --font-serif: 'Poppins', system-ui, sans-serif;
  --font-sans: 'DM Sans', -apple-system, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

  /* Espacement */
  --container: clamp(1.25rem, 4vw, 3rem);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  display: flex; flex-direction: column;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; }
::selection { background: var(--ink); color: var(--paper); }

/* ===========================================
   NAVIGATION — sobre, ligne fine, beaucoup d'air
   =========================================== */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(250, 247, 242, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 1.1rem var(--container);
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
}
.brand { display: flex; align-items: center; gap: 0.75rem; }
.brand-mark {
  width: 32px; height: 32px;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  font-size: 18px;
  letter-spacing: -0.02em;
  border-radius: 2px;
}
.brand-mark span { transform: translateY(-1px); }
.brand-name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 20px;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.brand-name .dot { color: var(--accent); }
.nav-links {
  display: flex; gap: 2.25rem; align-items: center;
  font-size: 13px; font-weight: 500;
  letter-spacing: -0.005em;
}
.nav-link {
  color: var(--ink-mute);
  transition: color 0.25s ease;
  position: relative; padding: 0.3rem 0;
}
.nav-link:hover, .nav-link.active { color: var(--ink); }
.nav-link.active::after {
  content: ""; position: absolute;
  bottom: -32px; left: 0; right: 0;
  height: 1px; background: var(--accent);
}
.nav-right { display: flex; align-items: center; gap: 0.65rem; }
.role-badge {
  font-family: var(--font-mono); font-size: 10px;
  padding: 0.3rem 0.55rem;
  background: var(--paper-soft);
  color: var(--ink-mute);
  border: 1px solid var(--line);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 500;
}

/* ===========================================
   BOUTONS — minimal, ligne fine, pas d'ombre dure
   =========================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem;
  padding: 0.7rem 1.4rem;
  font-family: var(--font-sans);
  font-size: 13px; font-weight: 500;
  letter-spacing: -0.005em;
  transition: all 0.25s ease;
  white-space: nowrap;
  border: 1px solid transparent;
  border-radius: 2px;
  cursor: pointer;
}
.btn-primary {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink);
}
.btn-primary:hover {
  background: var(--ink-soft); border-color: var(--ink-soft);
}
.btn-orange {
  background: var(--accent); color: var(--paper);
  border-color: var(--accent);
}
.btn-orange:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn-outline {
  border-color: var(--line-strong); color: var(--ink);
  background: transparent;
}
.btn-outline:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-ghost { color: var(--ink-mute); background: transparent; }
.btn-ghost:hover { color: var(--ink); }
.btn-success { background: var(--olive); color: var(--paper); border-color: var(--olive); }
.btn-success:hover { background: #4a5732; border-color: #4a5732; }
.btn-danger {
  color: var(--accent-deep);
  border: 1px solid rgba(151, 73, 46, 0.25);
  background: transparent;
}
.btn-danger:hover { background: rgba(151, 73, 46, 0.06); border-color: rgba(151, 73, 46, 0.4); }
.btn-lg { padding: 0.9rem 1.8rem; font-size: 14px; }
.btn-sm { padding: 0.5rem 1rem; font-size: 12px; }
.btn-full { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-arrow {
  width: 6px; height: 6px;
  border-top: 1.5px solid currentColor;
  border-right: 1.5px solid currentColor;
  transform: rotate(45deg);
  transition: transform 0.25s ease;
  margin-left: 0.15rem;
}
.btn:hover .btn-arrow { transform: rotate(45deg) translate(2px, -2px); }

/* ===========================================
   LAYOUT
   =========================================== */
.main { flex: 1; width: 100%; }
.container { max-width: 1280px; margin: 0 auto; padding: 0 var(--container); }
.section { padding: 4rem 0; }
.section-lg { padding: 6rem 0; }

.page-head {
  padding: 4rem var(--container) 3rem;
  border-bottom: 1px solid var(--line);
  max-width: 1280px; margin: 0 auto;
}
.page-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 1rem;
}
.page-title {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: clamp(2.5rem, 5.5vw, 4.5rem);
  line-height: 1.02;
  letter-spacing: -0.02em;
  max-width: 900px;
}
.page-title em {
  font-style: italic;
  font-weight: 300;
  color: var(--accent);
}
.page-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.15rem;
  font-style: italic;
  color: var(--ink-mute);
  margin-top: 1.5rem;
  max-width: 580px;
  line-height: 1.55;
  letter-spacing: -0.005em;
}
.page-head-actions {
  display: flex; gap: 0.65rem;
  margin-top: 2rem; flex-wrap: wrap;
}

/* ===========================================
   HERO — éditorial, large, calme
   =========================================== */
.hero {
  background: var(--paper);
  padding: 5rem var(--container) 4rem;
  position: relative;
  border-bottom: 1px solid var(--line);
}
.hero-grid {
  max-width: 1280px; margin: 0 auto;
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 4rem; align-items: end;
}
@media (max-width: 880px) { .hero-grid { grid-template-columns: 1fr; gap: 3rem; } }
.hero-content { position: relative; z-index: 2; }
.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 1.75rem;
  display: flex; align-items: center; gap: 0.85rem;
}
.hero-eyebrow::before {
  content: ""; width: 28px; height: 1px;
  background: var(--accent);
}
.hero-h1 {
  font-family: var(--font-serif);
  font-weight: 800;
  font-size: clamp(2.8rem, 7vw, 5.5rem);
  line-height: 1;
  letter-spacing: -0.02em;
  margin-bottom: 1.75rem;
  color: var(--ink);
}
.hero-h1 em {
  font-style: italic;
  font-weight: 300;
  color: var(--accent);
}
.hero-h1 .underline {
  position: relative;
  display: inline-block;
}
.hero-h1 .underline::after {
  content: ""; position: absolute;
  bottom: 0.05em; left: 0; right: 0;
  height: 1px; background: var(--accent);
}
.hero-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: clamp(1.05rem, 1.4vw, 1.25rem);
  line-height: 1.55;
  color: var(--ink-soft);
  max-width: 520px;
  margin-bottom: 2.25rem;
  letter-spacing: -0.005em;
}
.hero-actions { display: flex; gap: 0.65rem; flex-wrap: wrap; }

.hero-numbers {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2rem 2.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--line);
  align-self: end;
}
.hero-number-val {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 2.75rem;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.hero-number-val em {
  font-style: italic;
  color: var(--accent);
}
.hero-number-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
  margin-top: 0.65rem;
}
.hero-deco { display: none; }

/* ===========================================
   ACCOUNT ROLES — cards minimales
   =========================================== */
.roles-section {
  background: var(--paper);
  padding: 6rem var(--container);
  border-bottom: 1px solid var(--line);
}
.roles-grid {
  max-width: 1280px; margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
@media (max-width: 880px) { .roles-grid { grid-template-columns: 1fr; } }
.role-card {
  background: var(--paper);
  padding: 2.5rem 2rem;
  transition: background 0.3s ease;
  display: flex; flex-direction: column;
}
.role-card:hover { background: var(--paper-soft); }
.role-card-icon {
  width: 52px; height: 52px;
  background: rgba(184, 92, 60, 0.08);
  border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  margin-bottom: 1.1rem;
}
.role-card-eye {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--accent);
  margin-bottom: 0.75rem;
}
.role-card-title {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: 1.7rem;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-bottom: 1rem;
}
.role-card-title em {
  font-style: italic;
  color: var(--accent);
}
.role-card-desc {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mute);
  font-size: 0.98rem;
  margin-bottom: 1.5rem;
  line-height: 1.5;
}
.role-card-bullets {
  list-style: none;
  margin-bottom: 2rem;
  display: flex; flex-direction: column;
  gap: 0.55rem;
}
.role-card-bullets li {
  font-size: 13.5px;
  padding-left: 1.25rem;
  position: relative;
  color: var(--ink-soft);
  line-height: 1.5;
}
.role-card-bullets li::before {
  content: "—";
  color: var(--accent);
  position: absolute; left: 0;
  font-weight: 400;
}

/* ===========================================
   Section common
   =========================================== */
.section-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 1rem;
}
.section-h2 {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: clamp(2rem, 4vw, 3rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 2.5rem;
  max-width: 800px;
}
.section-h2 em {
  font-style: italic;
  color: var(--accent);
}

/* ===========================================
   GRIDS
   =========================================== */
.grid { display: grid; gap: 1.5rem; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

/* ===========================================
   CARDS — épurées, gradient subtil, ligne fine
   =========================================== */
.t-card {
  background: var(--paper);
  border: 1px solid var(--line);
  position: relative;
  display: flex; flex-direction: column;
  transition: border-color 0.3s ease, transform 0.3s ease;
  overflow: hidden; cursor: pointer;
  border-radius: 3px;
}
.t-card:hover {
  border-color: var(--ink);
  transform: translateY(-2px);
}
.t-card-img {
  height: 140px;
  background: linear-gradient(135deg, var(--ink) 0%, var(--ink-soft) 100%);
  position: relative;
  overflow: hidden;
}
.t-card-img.alt-1 { background: linear-gradient(135deg, var(--olive) 0%, #2c3522 100%); }
.t-card-img.alt-2 { background: linear-gradient(135deg, var(--bronze) 0%, #6e5532 100%); }
.t-card-img.alt-3 { background: linear-gradient(135deg, var(--slate) 0%, #2d3540 100%); }
.t-card-img.alt-4 { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%); }
.t-card-img::after {
  content: ""; position: absolute;
  inset: 0;
  background: radial-gradient(circle at 70% 30%, rgba(250,247,242,0.08) 0%, transparent 60%);
}
.t-card-mark {
  position: absolute; top: 1.1rem; left: 1.25rem;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: rgba(250, 247, 242, 0.7);
}
.t-card-num {
  position: absolute; bottom: 0.4rem; right: 1.25rem;
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 300;
  font-size: 5rem;
  line-height: 1;
  color: rgba(250, 247, 242, 0.12);
  letter-spacing: -0.04em;
}
.t-card-body {
  padding: 1.5rem 1.5rem 1.5rem;
  flex: 1; display: flex; flex-direction: column;
}
.t-card-club {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--accent);
  margin-bottom: 0.85rem;
}
.t-card-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.4rem;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-bottom: 0.5rem;
}
.t-card-meta {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.92rem;
  color: var(--ink-mute);
  margin-bottom: 1.25rem;
}
.t-card-foot {
  margin-top: auto;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
}
.t-card-status {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 0.3rem 0.6rem;
  border: 1px solid var(--line);
  border-radius: 2px;
}
.t-card-status.open { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.t-card-status.draft { background: transparent; color: var(--ink-mute); }
.t-card-status.live { background: var(--olive); color: var(--paper); border-color: var(--olive); }
.t-card-progress {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  color: var(--ink-soft);
}

/* ===========================================
   FORMS
   =========================================== */
.form-group { margin-bottom: 1.5rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
@media (max-width: 600px) {
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
}
.form-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-mute);
  margin-bottom: 0.6rem;
}
.form-help {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 12.5px;
  color: var(--ink-mute);
  margin-top: 0.5rem;
  line-height: 1.5;
}
.input, .select, .textarea {
  width: 100%;
  padding: 0.85rem 1rem;
  background: var(--paper);
  border: 1px solid var(--line-strong);
  font-size: 14px;
  color: var(--ink);
  font-family: var(--font-sans);
  border-radius: 2px;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--ink);
  background: var(--paper);
}
.textarea { resize: vertical; min-height: 110px; line-height: 1.5; }

.radio-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 0.5rem;
}
.radio-c {
  padding: 1rem 1.1rem;
  border: 1px solid var(--line-strong);
  cursor: pointer;
  transition: all 0.2s ease;
  background: var(--paper);
  border-radius: 2px;
}
.radio-c:hover { border-color: var(--ink); }
.radio-c.selected {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink);
}
.radio-c-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.1rem;
  letter-spacing: -0.01em;
  margin-bottom: 0.2rem;
}
.radio-c-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 12.5px;
  opacity: 0.85;
}

.form-error {
  background: rgba(151, 73, 46, 0.08);
  color: var(--accent-deep);
  border: 1px solid rgba(151, 73, 46, 0.2);
  padding: 0.85rem 1rem;
  font-size: 13px;
  margin-bottom: 1rem;
  border-radius: 2px;
  display: none;
}
.form-error.show { display: block; }

.day-checks { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.day-check {
  padding: 0.55rem 0.9rem;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  user-select: none;
  transition: all 0.2s ease;
  border-radius: 2px;
}
.day-check:hover { border-color: var(--ink); }
.day-check.selected {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink);
}

/* ===========================================
   AUTH
   =========================================== */
.auth-page { max-width: 480px; margin: 5rem auto; padding: 0 var(--container); }
.auth-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 3rem 2.5rem;
  border-radius: 3px;
}
.auth-card::before { display: none; }
.auth-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 1rem;
}
.auth-title {

}
.auth-title em {

.auth-demo {

.auth-demo code {

.signup-mode-radios {

}
.signup-radio-opt {

.signup-radio-opt.opt-real.selected {

}
.signup-radio-opt.opt-demo {

}
.signup-radio-opt.opt-demo.selected {

.signup-radio-opt input[type="radio"] {

}

}
.signup-radio-name {
  font-family: var(--font-sans);
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--ink);

}
.signup-radio-opt.selected .signup-radio-name {
  color: var(--paper);
}
.signup-radio-opt.opt-demo .signup-radio-name {
  font-weight: 400;
  font-size: 0.88rem;
  color: var(--ink-soft);
}
.signup-radio-opt.opt-demo.selected .signup-radio-name {
  color: var(--paper);
}

.auth-tabs {
  display: flex; gap: 0;
  border: 1px solid var(--line-strong);
  margin-bottom: 1.5rem;
  border-radius: 2px;

}
.auth-tab {
  flex: 1; padding: 0.85rem 0.5rem;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);

  text-align: center;
  border-right: 1px solid var(--line-strong);

}
.auth-tab:last-child { border-right: none; }
.auth-tab:hover { color: var(--ink); background: var(--paper-soft); }
.auth-tab.active {
  background: var(--ink);
  color: var(--paper);
}

/* ===========================================
   DASHBOARD
   =========================================== */
.dash-greeting {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 2.4rem;
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin-bottom: 0.5rem;
}
.dash-greeting em {
  font-style: italic;
  color: var(--accent);
}
.dash-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mute);
  margin-bottom: 3rem;
  font-size: 1.05rem;
}
.dash-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

}
.dash-stat {
  background: var(--paper);

}
.dash-stat-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
  margin-bottom: 0.85rem;
}
.dash-stat-val {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 2.4rem;
  line-height: 1;
  letter-spacing: -0.025em;
  color: var(--ink);
}
.dash-stat-val em {
  font-style: italic;
  color: var(--accent);
}
.dash-section { margin-bottom: 4rem; }
.dash-section-h {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 1.5rem; padding-bottom: 1rem;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
  gap: 0.75rem;
}
.dash-section-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.4rem;

}
.dash-empty {
  background: var(--paper-soft);
  border: 1px solid var(--line);

  text-align: center;
  border-radius: 2px;
}
.dash-empty-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.3rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.5rem;
}
.dash-empty-text {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mute);
  margin-bottom: 1.25rem;
  font-size: 0.98rem;
}

/* ===========================================
   TOURNAMENT DETAIL HERO
   =========================================== */
.tourn-hero {
  background: var(--ink);
  color: var(--paper);
  padding: 5rem var(--container) 4rem;
  position: relative;
  overflow: hidden;
}
.tourn-hero::before { display: none; }
.tourn-hero-inner {
  max-width: 1280px; margin: 0 auto;
  position: relative; z-index: 2;
}
.tourn-hero-club {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent-soft);
  margin-bottom: 1.25rem;
}
.tourn-hero-title {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  letter-spacing: -0.03em;
  line-height: 1.02;
  margin-bottom: 2rem;
  color: var(--paper);
}
.tourn-hero-title em {
  font-style: italic;
  font-weight: 300;
  color: var(--accent-soft);
}
.tourn-hero-meta {
  display: flex; flex-wrap: wrap;
  gap: 2rem 3.5rem;
  margin-top: 2rem; padding-top: 2rem;
  border-top: 1px solid rgba(250, 247, 242, 0.12);
}
.tourn-meta-item { display: flex; flex-direction: column; gap: 0.5rem; }
.tourn-meta-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: rgba(250, 247, 242, 0.5);
}
.tourn-meta-val {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.15rem;
  letter-spacing: -0.01em;
  color: var(--paper);
}
.tourn-body {
  max-width: 1280px; margin: 0 auto;
  padding: 3rem var(--container) 4rem;
  display: grid; grid-template-columns: 1fr 340px;
  gap: 3.5rem;
}
@media (max-width: 880px) { .tourn-body { grid-template-columns: 1fr; gap: 2rem; } }

.detail-tabs {
  display: flex; gap: 0.25rem;
  border-bottom: 1px solid var(--line);
  margin-bottom: 2.5rem;
  overflow-x: auto;
  /* Hide scrollbar — tabs wrap on small screens instead */
  scrollbar-width: none;
  -ms-overflow-style: none;
  flex-wrap: wrap;
}
.detail-tabs::-webkit-scrollbar { display: none; }
.detail-tab {
  padding: 0.9rem 1.25rem;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  cursor: pointer;
  border-bottom: 1px solid transparent;
  margin-bottom: -1px;
  transition: color 0.25s, border-color 0.25s;
  white-space: nowrap;
  display: inline-flex; align-items: center; gap: 0.5rem;
}
.detail-tab.active { color: var(--ink); border-color: var(--accent); }
.detail-tab:hover { color: var(--ink); }
.tab-badge {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent); color: var(--paper);
  font-size: 9px; font-weight: 600;
  padding: 2px 6px;
  border-radius: 999px;
  min-width: 18px;
}
.detail-content { min-height: 200px; }
.detail-section { margin-bottom: 2.5rem; }
.detail-section-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.3rem;
  letter-spacing: -0.015em;
  margin-bottom: 1.25rem;
  padding-bottom: 0.65rem;
  border-bottom: 1px solid var(--line);
}
.detail-text {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--ink-soft);
  letter-spacing: -0.005em;
}

/* ===========================================
   List rows
   =========================================== */
.list { display: flex; flex-direction: column; gap: 0.6rem; }
.list-row {
  display: flex; align-items: center; gap: 1.25rem;
  padding: 1.1rem 1.25rem;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 2px;
  transition: border-color 0.25s, background 0.25s;
}
.list-row:hover { border-color: var(--ink); background: var(--paper-soft); }
.list-num {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 1.6rem;
  width: 36px;
  color: var(--accent);
  text-align: center;
  flex-shrink: 0;
  line-height: 1;
}
.list-info { flex: 1; min-width: 0; }
.list-name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.1rem;
  letter-spacing: -0.015em;
  line-height: 1.3;
}
.list-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.88rem;
  color: var(--ink-mute);
  margin-top: 0.25rem;
}
.list-status {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 0.3rem 0.6rem;
  border: 1px solid var(--line);
  white-space: nowrap;
  border-radius: 2px;
}
.list-status.paid, .list-status.approved, .list-status.confirme {
  background: var(--olive); color: var(--paper); border-color: var(--olive);
}
.list-status.pending {
  background: transparent; color: var(--ink-mute);
  border-color: var(--line-strong);
}
.list-status.rejected, .list-status.refuse {
  background: transparent; color: var(--accent-deep);
  border-color: rgba(151, 73, 46, 0.3);
}
.list-actions { display: flex; gap: 0.4rem; flex-shrink: 0; flex-wrap: wrap; }

/* ===========================================
   App card
   =========================================== */
.app-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 1.25rem 1.5rem;
  display: grid; grid-template-columns: 1fr auto;
  gap: 1.25rem; align-items: center;
  border-radius: 2px;
  transition: border-color 0.25s;
}
.app-card:hover { border-color: var(--ink); }
@media (max-width: 600px) { .app-card { grid-template-columns: 1fr; } }
.app-card-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.2rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.25rem;
}
.app-card-meta {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.88rem;
  color: var(--ink-mute);
  margin-bottom: 0.5rem;
}
.app-card-msg {
  background: var(--paper-soft);
  padding: 0.65rem 0.85rem;
  border-left: 2px solid var(--accent);
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 0.95rem;
  font-style: italic;
  margin-top: 0.6rem;
  border-radius: 0 2px 2px 0;
  color: var(--ink-soft);
  line-height: 1.55;
}
.app-actions { display: flex; gap: 0.4rem; flex-shrink: 0; flex-wrap: wrap; }

/* ===========================================
   Aside
   =========================================== */
.tourn-aside { position: sticky; top: 100px; }
.aside-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 1.75rem;
  margin-bottom: 1rem;
  border-radius: 2px;
}
.aside-card::before { display: none; }
.aside-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.25rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.4rem;
}
.aside-sub {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.92rem;
  color: var(--ink-mute);
  margin-bottom: 1.5rem;
  line-height: 1.5;
}
.aside-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px; margin: 1.25rem 0;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.aside-stat {
  background: var(--paper-soft);
  padding: 0.85rem 0.9rem;
}
.aside-stat-label {
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
}
.aside-stat-val {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 1.35rem;
  letter-spacing: -0.015em;
  margin-top: 0.3rem;
}
.aside-share {
  padding-top: 1.25rem;
  border-top: 1px solid var(--line);
}
.aside-share-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
  margin-bottom: 0.75rem;
}
.share-row { display: flex; gap: 0.4rem; }
.share-btn {
  width: 36px; height: 36px;
  background: transparent;
  border: 1px solid var(--line-strong);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-mute);
  transition: all 0.2s ease;
  border-radius: 2px;
}
.share-btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.share-btn svg { width: 15px; height: 15px; }

/* ===========================================
   PROFILE pages
   =========================================== */
.profile-hero {
  background: var(--ink); color: var(--paper);
  padding: 4rem var(--container);
  position: relative;
}
.profile-hero::before { display: none; }
.profile-hero.sponsor::before { display: none; }
.profile-hero-inner {
  max-width: 1280px; margin: 0 auto;
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: 2.5rem; flex-wrap: wrap;
}
.profile-avatar {
  width: 84px; height: 84px;
  background: var(--paper);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.75rem;
  letter-spacing: -0.02em;
  border: none;
  border-radius: 3px;
  flex-shrink: 0;
}
.profile-avatar.team { background: var(--olive); color: var(--paper); }
.profile-avatar.sponsor { background: var(--bronze); color: var(--paper); }
.profile-info { flex: 1; min-width: 0; }
.profile-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent-soft);
  margin-bottom: 0.85rem;
}
.profile-name {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: clamp(1.85rem, 4vw, 2.75rem);
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin-bottom: 0.5rem;
}
.profile-meta {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: rgba(250, 247, 242, 0.7);
  font-size: 1rem;
  line-height: 1.5;
}
.profile-body {
  display: grid; grid-template-columns: 1fr 320px;
  gap: 3rem;
}
@media (max-width: 880px) { .profile-body { grid-template-columns: 1fr; gap: 2rem; } }

/* ===========================================
   Players
   =========================================== */
.players-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 0.6rem;
}
.player-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 0.95rem 1rem;
  display: flex; align-items: center; gap: 0.85rem;
  transition: border-color 0.25s;
  border-radius: 2px;
}
.player-card:hover { border-color: var(--ink); }
.player-num {
  width: 36px; height: 36px;
  background: var(--paper-soft);
  color: var(--ink);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1rem;
  letter-spacing: -0.02em;
  flex-shrink: 0;
  border-radius: 2px;
}
.player-info { flex: 1; min-width: 0; }
.player-name {
  font-family: var(--font-sans);
  font-size: 13px; font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.player-pos {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  margin-top: 0.2rem;
}

/* ===========================================
   Availability
   =========================================== */
.avail-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.avail-day {
  padding: 0.65rem 1rem;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  border-radius: 2px;
}
.avail-day.on {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

/* ===========================================
   CALENDAR
   =========================================== */
.cal-section {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 1.75rem;
  margin-bottom: 1.5rem;
  border-radius: 2px;
}
.cal-header {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 1rem;
  margin-bottom: 1.75rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--line);
}
.cal-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.4rem;
  letter-spacing: -0.015em;
}
.match-list { display: flex; flex-direction: column; gap: 0.6rem; }
.match-row {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  padding: 1.1rem 1.25rem;
  display: grid; grid-template-columns: 75px 1fr auto auto;
  gap: 1.5rem; align-items: center;
  transition: border-color 0.25s;
  border-radius: 2px;
}
.match-row:hover { border-color: var(--ink); }
@media (max-width: 700px) {
  .match-row { grid-template-columns: 1fr; gap: 0.65rem; }
}
.match-time {
  font-family: var(--font-serif);
  font-weight: 300;
  text-align: center;
}
.match-time-hr {
  font-size: 1.5rem;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.match-time-day {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  margin-top: 0.45rem;
}
.match-teams {
  display: flex; align-items: center; gap: 1rem;
  min-width: 0;
}
.match-team {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.05rem;
  letter-spacing: -0.015em;
  flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.match-team.right { text-align: right; }
.match-vs {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.95rem;
  color: var(--ink-mute);
  padding: 0 0.5rem;
  flex-shrink: 0;
}
.match-score {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.35rem;
  letter-spacing: -0.01em;
  background: var(--ink);
  color: var(--paper);
  padding: 0.3rem 0.85rem;
  line-height: 1;
  flex-shrink: 0;
  border-radius: 2px;
}
.match-field {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-mute);
  white-space: nowrap;
}
.match-stage {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  padding: 0.25rem 0.55rem;
  background: var(--paper);
  border: 1px solid var(--line-strong);
  color: var(--ink-mute);
  margin-bottom: 0.5rem;
  border-radius: 2px;
}
.match-stage.finale {
  background: var(--bronze); color: var(--paper); border-color: var(--bronze);
}
.match-stage.demi {
  background: var(--accent); color: var(--paper); border-color: var(--accent);
}
.match-stage.quart {
  background: var(--slate); color: var(--paper); border-color: var(--slate);
}
.match-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }

/* ===========================================
   Sponsor tiers
   =========================================== */
.sponsor-tiers { display: flex; flex-direction: column; gap: 1rem; }
.sponsor-tier {
  border: 1px solid var(--line);
  padding: 1.5rem 1.75rem;
  background: var(--paper);
  border-radius: 2px;
  transition: border-color 0.25s;
}
.sponsor-tier:hover { border-color: var(--ink); }
.sponsor-tier-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 1rem; padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--line);
}
.sponsor-tier-name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.4rem;
  letter-spacing: -0.015em;
}
.sponsor-tier-price {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.2rem;
  letter-spacing: -0.02em;
  color: var(--accent);
}
.sponsor-tier-perks {
  display: flex; flex-direction: column;
  gap: 0.45rem;
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 0.95rem;
  color: var(--ink-soft);
  line-height: 1.5;
}
.sponsor-tier-perks li {
  list-style: none;
  padding-left: 1.2rem;
  position: relative;
}
.sponsor-tier-perks li::before {
  content: "—";
  color: var(--accent);
  position: absolute; left: 0;
}
.tier-foot {
  margin-top: 1.1rem;
  padding-top: 0.85rem;
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 0.5rem;
}
.tier-slots {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  color: var(--ink-mute);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

/* ===========================================
   Animations
   =========================================== */
.anim-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 1rem;
}
.anim-card {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 1.5rem 1.5rem 1.35rem;
  position: relative; cursor: pointer;
  transition: border-color 0.25s, background 0.25s;
  border-radius: 2px;
}
.anim-card:hover { border-color: var(--ink); }
.anim-card.selected {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink);
}
.anim-card.selected .anim-icon { color: var(--accent-soft); }
.anim-card.selected .anim-name { color: var(--paper); }
.anim-card.selected .anim-desc { color: rgba(250, 247, 242, 0.7); }
.anim-card.selected .anim-price { color: var(--accent-soft); }
.anim-icon {
  font-size: 1.5rem;
  color: var(--accent);
  margin-bottom: 0.85rem;
  font-family: var(--font-serif);
  font-style: italic;
  line-height: 1;
}
.anim-name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.2rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.5rem;
}
.anim-desc {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 0.9rem;
  color: var(--ink-mute);
  margin-bottom: 0.9rem;
  line-height: 1.5;
}
.anim-price {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.05em;
}
.anim-tag {
  position: absolute; top: 1rem; right: 1rem;
  background: var(--accent); color: var(--paper);
  padding: 0.25rem 0.55rem;
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border-radius: 2px;
}

/* ===========================================
   TOAST + MODAL
   =========================================== */
.toast-container {
  position: fixed; bottom: 2rem; right: 2rem;
  z-index: 1000;
  display: flex; flex-direction: column; gap: 0.5rem;
}
.toast {
  background: var(--ink); color: var(--paper);
  padding: 0.95rem 1.35rem;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border-left: 2px solid var(--accent);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  max-width: 340px;
  border-radius: 2px;
}
.toast.success { border-color: var(--olive); }
.toast.error { border-color: var(--accent); }
@keyframes toastIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes toastOut { to { transform: translateX(120%); opacity: 0; } }

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(26, 31, 46, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 1rem;
  animation: fadeIn 0.25s ease;
  overflow-y: auto;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 2.5rem;
  max-width: 540px; width: 100%;
  position: relative;
  max-height: 90vh; overflow-y: auto;
  border-radius: 3px;
}
.modal::before { display: none; }
.modal-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.6rem;
  letter-spacing: -0.02em;
  margin-bottom: 0.85rem;
}
.modal-body {
  font-family: var(--font-serif);
  font-weight: 300;
  color: var(--ink-soft);
  margin-bottom: 1.75rem;
  line-height: 1.6;
  font-size: 1rem;
}
.modal-actions {
  display: flex; gap: 0.6rem;
  justify-content: flex-end; flex-wrap: wrap;
}

/* ===========================================
   FOOTER
   =========================================== */
.footer {
  background: var(--ink);
  color: rgba(250, 247, 242, 0.75);
  padding: 4rem var(--container) 2rem;
  margin-top: auto;
}
.footer-legal-links { display: inline-flex; gap: 1rem; flex-wrap: wrap; }
.footer-legal-link { color: var(--ink-mute); text-decoration: none; font-size: 13px; transition: color 0.15s; }
.footer-legal-link:hover { color: var(--accent); }
.legal-page { max-width: 760px; margin: 0 auto; padding: 1rem 0 3rem; }
.legal-page h1 { font-family: var(--font-serif); font-weight: 700; font-size: clamp(1.8rem, 3.5vw, 2.6rem); letter-spacing: -0.02em; color: var(--ink); margin-bottom: 0.5rem; }
.legal-page .legal-updated { font-family: var(--font-sans); font-size: 13px; color: var(--ink-mute); margin-bottom: 2rem; }
.legal-page h2 { font-family: var(--font-serif); font-weight: 600; font-size: 1.3rem; letter-spacing: -0.02em; color: var(--accent); margin: 2rem 0 0.75rem; }
.legal-page p, .legal-page li { font-family: var(--font-sans); font-size: 15px; line-height: 1.65; color: var(--ink-soft); }
.legal-page p { margin-bottom: 0.85rem; }
.legal-page ul { margin: 0 0 0.85rem 1.25rem; }
.legal-page li { margin-bottom: 0.4rem; }
.legal-page a { color: var(--accent); }
.legal-page strong { color: var(--ink); font-weight: 600; }
.legal-note { background: var(--paper-soft); border-left: 3px solid var(--accent); border-radius: 4px; padding: 0.85rem 1.1rem; margin: 1rem 0; font-size: 14px; }

.footer-inner {
  max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: 1.5fr 2fr;
  gap: 3.5rem;
}
@media (max-width: 720px) { .footer-legal-links { display: inline-flex; gap: 1rem; flex-wrap: wrap; }
.footer-legal-link { color: var(--ink-mute); text-decoration: none; font-size: 13px; transition: color 0.15s; }
.footer-legal-link:hover { color: var(--accent); }
.legal-page { max-width: 760px; margin: 0 auto; padding: 1rem 0 3rem; }
.legal-page h1 { font-family: var(--font-serif); font-weight: 700; font-size: clamp(1.8rem, 3.5vw, 2.6rem); letter-spacing: -0.02em; color: var(--ink); margin-bottom: 0.5rem; }
.legal-page .legal-updated { font-family: var(--font-sans); font-size: 13px; color: var(--ink-mute); margin-bottom: 2rem; }
.legal-page h2 { font-family: var(--font-serif); font-weight: 600; font-size: 1.3rem; letter-spacing: -0.02em; color: var(--accent); margin: 2rem 0 0.75rem; }
.legal-page p, .legal-page li { font-family: var(--font-sans); font-size: 15px; line-height: 1.65; color: var(--ink-soft); }
.legal-page p { margin-bottom: 0.85rem; }
.legal-page ul { margin: 0 0 0.85rem 1.25rem; }
.legal-page li { margin-bottom: 0.4rem; }
.legal-page a { color: var(--accent); }
.legal-page strong { color: var(--ink); font-weight: 600; }
.legal-note { background: var(--paper-soft); border-left: 3px solid var(--accent); border-radius: 4px; padding: 0.85rem 1.1rem; margin: 1rem 0; font-size: 14px; }

.footer-inner { grid-template-columns: 1fr; } }
.footer-brand .brand-mark { background: var(--paper); color: var(--ink); }
.footer-brand .brand-name { color: var(--paper); }
.footer-tag {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  font-size: 1rem;
  color: rgba(250, 247, 242, 0.65);
  margin-top: 1.25rem;
  max-width: 320px;
  line-height: 1.55;
}
.footer-cols {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 2.5rem;
}
.footer-col-title {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent-soft);
  margin-bottom: 1.1rem;
}
.footer-link {
  display: block;
  padding: 0.35rem 0;
  font-size: 13.5px;
  color: rgba(250, 247, 242, 0.65);
  transition: color 0.2s;
  letter-spacing: -0.005em;
}
.footer-link:hover { color: var(--paper); }
.footer-bottom {
  max-width: 1280px; margin: 3rem auto 0;
  padding-top: 1.75rem;
  border-top: 1px solid rgba(250, 247, 242, 0.1);
  display: flex; justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;

  color: rgba(250, 247, 242, 0.4);

}

@media (max-width: 700px) {
  .nav-links { display: none; }
  .nav { padding: 0.85rem 1.25rem; }
  .tourn-aside { position: static; }
  .detail-tab { padding: 0.75rem 0.85rem; font-size: 10.5px; }
  .hero { padding: 3.5rem var(--container) 2.5rem; }

  .roles-section { padding: 4rem var(--container); }
}

.fade-in {
  opacity: 0;
  transform: translateY(16px);
  animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
.delay-1 { animation-delay: 0.12s; }
.delay-2 { animation-delay: 0.24s; }

/* ===== Real signup success screen ===== */
.real-signup-success .icon {
  font-family: var(--font-serif); font-style: italic;
  font-size: 3rem; color: var(--accent);
  margin-bottom: 1rem; line-height: 1; text-align: center;
}
.real-signup-success { padding: 0.5rem 0; }

/* ===== User dropdown menu (connected nav) ===== */
.nav-user-menu { position: relative; }
.nav-user-btn { padding: 0.35rem 0.7rem; border: 1px solid var(--line); }
.nav-user-btn:hover { border-color: var(--ink); }
.nav-user-dropdown {
  position: absolute; top: calc(100% + 0.5rem); right: 0;
  background: var(--paper); border: 1px solid var(--ink);
  min-width: 240px; z-index: 200;
  display: none;
  border-radius: 2px;
  box-shadow: 0 8px 24px rgba(26, 31, 46, 0.12);
  overflow: hidden;
}
.nav-user-dropdown.open { display: block; }
.nav-dd-head {
  padding: 1rem 1.1rem 0.85rem;
  border-bottom: 1px solid var(--line);
  background: var(--paper-soft);
}
.nav-dd-name {
  font-family: var(--font-serif); font-weight: 400;
  font-size: 1rem; letter-spacing: -0.015em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav-dd-sub {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--accent); margin-top: 0.3rem;
}
.nav-dd-link {
  display: block; width: 100%; text-align: left;
  padding: 0.7rem 1.1rem;
  font-family: var(--font-sans); font-size: 13px;
  color: var(--ink-soft); cursor: pointer;
  background: transparent; border: none;
  letter-spacing: -0.005em;
  transition: background 0.15s, color 0.15s;
}
.nav-dd-link:hover {
  background: var(--paper-soft); color: var(--ink);
}
.nav-dd-sep { border-top: 1px solid var(--line); margin: 0.25rem 0; }
.nav-dd-logout { color: var(--accent-deep) !important; }
.nav-dd-logout:hover { background: rgba(151, 73, 46, 0.06) !important; color: var(--accent-deep) !important; }

/* ===== Tournament detail info grid ===== */
.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.info-item {
  background: var(--paper);
  padding: 1rem 1.1rem;
}
.info-label {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ink-mute);
  margin-bottom: 0.5rem;
}
.info-val {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.05rem;
  letter-spacing: -0.015em;
  color: var(--ink);
  line-height: 1.3;
}

/* ===== Venue box ===== */
.venue-box {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  padding: 1.25rem 1.5rem;
  border-radius: 2px;
}
.venue-name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 1.2rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.4rem;
}
.venue-address {
  font-family: var(--font-serif);
  font-weight: 300;
  font-style: italic;
  color: var(--ink-mute);
  margin-bottom: 0.85rem;
}
.venue-map-link {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
  border-bottom: 1px solid var(--accent);
  padding-bottom: 1px;
}
.venue-map-link:hover { color: var(--accent-deep); }

/* ===== Contact box ===== */
.contact-box {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  padding: 1.25rem 1.5rem;
  border-radius: 2px;
}
.contact-box > p {
  font-family: var(--font-serif);
  font-size: 1.1rem;
  letter-spacing: -0.015em;
  margin-bottom: 0.75rem;
}
.contact-lines { display: flex; gap: 1.5rem; flex-wrap: wrap; }
.contact-line {
  font-family: var(--font-mono);
  font-size: 13px; font-weight: 500;
  color: var(--ink-soft);
  border-bottom: 1px solid var(--line);
  padding-bottom: 1px;
  transition: color 0.2s;
}
.contact-line:hover { color: var(--accent); border-color: var(--accent); }

/* ===== Pain section (3 douleurs) ===== */
.section-pain {
  padding: 5rem var(--container);
  background: var(--paper);
}
.pain-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin-top: 3rem;
}
@media (max-width: 900px) { .pain-grid { grid-template-columns: 1fr; } }
.pain-card {
  background: var(--paper);
  padding: 2rem 1.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}
.pain-card-icon {
  width: 56px; height: 56px;
  background: rgba(184, 92, 60, 0.08);
  border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  margin-bottom: 1.25rem;
  flex-shrink: 0;
}
.pain-num {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
}
.pain-title {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: 1.25rem;
  letter-spacing: -0.02em;
  color: var(--ink);
  line-height: 1.25;
}
.pain-desc {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink-soft);
}

/* ===== How it works section ===== */
.section-how {
  padding: 5rem var(--container);
  background: var(--paper-soft);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.how-grid {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-top: 3rem;
  border: 1px solid var(--line);
}
.how-step {

  align-items: flex-start;
  gap: 2rem;

  border-bottom: 1px solid var(--line);

}
.how-step:last-child { border-bottom: none; }
.how-step:hover { background: var(--paper-soft); }
.how-step-icon {

  display: flex; align-items: center; justify-content: center;
  background: rgba(184, 92, 60, 0.08);
  border-radius: 2px;
  margin-top: 0.15rem;
}
.how-step-num {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--accent);
  background: rgba(184, 92, 60, 0.08);
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border-radius: 2px;
  margin-top: 0.15rem;
}
.how-step-body { flex: 1; }
.how-step-title {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 0.5rem;
}
.how-step-desc {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink-soft);
}

/* ===== CTA section ===== */
.section-cta {
  background: var(--ink);
  padding: 5rem var(--container);
  border-top: 3px solid var(--accent);
}
.cta-inner {
  max-width: 620px;
}
.cta-title {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: clamp(1.8rem, 3.5vw, 2.6rem);
  letter-spacing: -0.02em;
  line-height: 1.15;
  color: var(--paper);
  margin: 0.75rem 0 1rem;
}
.cta-title em {
  font-style: italic;
  color: var(--accent-soft);
}
.cta-sub {
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  color: rgba(245, 239, 228, 0.65);
  margin-bottom: 2rem;
}
.cta-actions {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
}

/* ===== Module finances ===== */
.fin-notice {
  display: flex;
  align-items: flex-start;
  gap: 0.85rem;
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  padding: 1rem 1.25rem;
  border-radius: 2px;
  margin-bottom: 1.5rem;
  font-family: var(--font-serif);
  font-size: 0.9rem;
  line-height: 1.55;
  color: var(--ink-soft);
}
.fin-notice strong {
  display: block;
  color: var(--ink);
  font-weight: 400;
  margin-bottom: 0.25rem;
}
.fin-notice-icon {
  font-size: 1.1rem;
  flex-shrink: 0;
  margin-top: 0.1rem;
}
/* ===== Module finances ===== */
.fin-bilan {
  display: flex;
  align-items: center;
  gap: 0;

/* Anti-scraper contact display — email/tel affiché via CSS pseudo-éléments  */
/* Un aspirateur de HTML brut ne voit que data-a et data-b fragmentés         */
/* Un robot sans CSS ne peut pas reconstituer l'adresse complète              */
.contact-css-reveal {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.65rem 1rem;
  background: var(--paper);
  border: 1px solid var(--line);

  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.2s;
  /* Empêche la sélection directe du texte par les bots                       */
  user-select: none;
  -webkit-user-select: none;
}
.contact-css-reveal:hover { border-color: var(--accent); color: var(--accent); }
/* Les deux moitiés du contact sont assemblées uniquement via CSS content     */
.contact-css-reveal::before {
  content: attr(data-a);
  letter-spacing: 0;
}
.contact-css-reveal::after {
  content: attr(data-b);
  letter-spacing: 0;
}
/* Icône selon le type */
.contact-css-reveal[data-k="email"]::before {
  content: "✉  " attr(data-a);
}
.contact-css-reveal[data-k="phone"]::before {
  content: "☎  " attr(data-a);

async function submitRealSignup(type, data, consents) {
  if (!supabaseClient) {
    return {
      error: 'La connexion à la base de données est indisponible. Vérifiez les clés Supabase dans le fichier.'
    };
  }

  const table = type === 'club'
    ? 'clubs'
    : type === 'team'
    ? 'teams'
    : 'sponsors';

  // Whitelist stricte : seules les colonnes qui existent dans Supabase
  let payload = {};

  if (type === 'club') {
    payload = {
      name: data.name || null,
      email: data.email || null,
      city: data.city || null,
      president: data.president || null,
      phone: data.phone || null,
      status: 'pending'
    };
  } else if (type === 'team') {
    payload = {
      name: data.name || null,
      email: data.email || null,
      city: data.city || null,
      club: data.club || null,
      category: data.category || null,
      level: data.level || null,
      manager: data.manager || null,
      phone: data.phone || null,
      status: 'pending'
    };
  } else {
    payload = {
      name: data.name || null,
      email: data.email || null,
      city: data.city || null,
      sector: data.sector || null,
      contact: data.contact || null,
      phone: data.phone || null,
      status: 'pending'
    };
  }

  // Supprimer les clés null pour éviter les erreurs de colonnes non renseignées
  Object.keys(payload).forEach((key) => {
    if (payload[key] === null) {
      delete payload[key];

  console.log('[Le Tournoi] INSERT →', table, '| payload:', JSON.stringify(payload));

  // Trace du consentement RGPD

    email: data.email,
    account_type: type,
    consent_data_collection: consents.dataCollection === true,
    consent_marketing: consents.marketing === true
  };

    // sinon il faut aussi une policy SELECT sur la table.
    const { error: err1 } = await supabaseClient
      .from(table)
      .insert([payload]);

    console.log('[Le Tournoi] INSERT result → error:', err1);

    if (err1) {
      console.error('[Le Tournoi] Supabase error:', err1);

      if (err1.code === '23505') {

// PERSISTANCE TOURNOIS — Supabase (jalon J1)
// ===========================================
// En mode réel, les tournois sont enregistrés dans Supabase et partagés
// entre tous les visiteurs. En mode démo, tout reste en localStorage.

// Convertit un tournoi local (camelCase) vers une ligne Supabase (snake_case)
function tournamentToRow(t, ownerEmail) {
  return {
    id: t.id,
    owner_email: ownerEmail || t.ownerEmail || '',
    club_id: t.clubId || null,
    name: t.name || '',
    edition: t.edition || '',
    date: t.date || null,
    date_end: t.dateEnd || null,
    time_start: t.timeStart || null,
    time_end: t.timeEnd || null,
    location: t.location || '',
    format: t.format || '',
    team_size: t.teamSize || null,
    max_teams: t.maxTeams || null,
    entry_fee: t.entryFee || 0,
    surface: t.surface || '',
    level: t.level || '',
    description: t.description || '',
    status: t.status || 'open',
    // SÉCURITÉ (RSSI) : registrations et sponsor_proposals contiennent des données de contact (PII).
    // Ils ne doivent JAMAIS aller dans `tournaments`, qui est en lecture publique.
    // Voir syncRegistration() / syncSponsorProposal() pour leur écriture dédiée.
    sponsor_tiers: t.sponsorTiers || [],
    animations: t.animations || [],
    matches: t.matches || []
  };
}

// Convertit une ligne Supabase vers un tournoi local
function rowToTournament(row) {
  return {
    id: row.id,
    ownerEmail: row.owner_email,
    clubId: row.club_id,
    name: row.name,
    edition: row.edition,
    date: row.date,
    dateEnd: row.date_end,
    timeStart: row.time_start,
    timeEnd: row.time_end,
    location: row.location,
    venueName: (row.location || '').split(' — ')[0] || '',
    venueAddress: (row.location || '').split(' — ')[1] || '',
    format: row.format,
    categories: row.format ? [row.format] : [],
    teamSize: row.team_size,
    matchSize: String(row.team_size || ''),
    maxTeams: row.max_teams,
    entryFee: row.entry_fee,
    surface: row.surface,
    level: row.level,
    description: row.description,
    status: row.status,
    registrations: row.registrations || [],
    sponsorTiers: row.sponsor_tiers || [],
    animations: row.animations || [],
    matches: row.matches || [],
    registrations: [],      // rempli ensuite par loadRegistrationsFromSupabase()
    sponsorProposals: [],   // rempli ensuite par loadSponsorProposalsFromSupabase()
    _remote: true
  };
}

// Enregistre (upsert) un tournoi dans Supabase — appelé après chaque modification
async function syncTournament(t) {
  if (!supabaseClient || signupMode !== 'real') return true; // mode démo : rien à synchroniser
  try {
    const a = getAccount();
    const ownerEmail = (a && a.email) ? a.email : (t.ownerEmail || '');
    const row = tournamentToRow(t, ownerEmail);
    t.ownerEmail = ownerEmail;
    const { error } = await supabaseClient.from('tournaments').upsert(row);
    if (error) {
      console.error('[Le Tournoi] syncTournament:', error);
      // QA U5 : ne jamais échouer silencieusement — l'utilisateur doit savoir
      // que la modification reste locale (cet appareil) tant que la base la refuse.
      toast('Modification enregistrée sur cet appareil uniquement (sync base échouée)', 'error');
      return false;
    }
    console.log('[Le Tournoi] Tournoi synchronisé:', t.id);
    return true;
  } catch (e) {
    console.error('[Le Tournoi] syncTournament exception:', e);
    toast('Modification enregistrée sur cet appareil uniquement (sync base échouée)', 'error');
    return false;
  }
}

// Enregistre une candidature d'équipe (table dédiée, hors JSONB public) — RSSI
async function syncRegistration(tournamentId, registration) {
  if (!supabaseClient || signupMode !== 'real') return true;
  try {
    const row = {
      id: registration.id,
      tournament_id: tournamentId,
      team_id: registration.teamId || null,
      team_name: registration.teamName || '',
      club_name: registration.clubName || '',
      status: registration.status || 'pending',
      message: registration.message || '',
      registered_at: registration.registeredAt || new Date().toISOString()
    };
    // Pas de .select() : table INSERT-only pour anon (cf. recommandations DBA).
    const { error } = await supabaseClient.from('registrations').insert([row]);
    if (error) {
      console.error('[Le Tournoi] syncRegistration:', error);
      toast('Candidature enregistrée sur cet appareil uniquement (sync base échouée)', 'error');
      return false;
    }
    return true;
  } catch (e) {
    console.error('[Le Tournoi] syncRegistration exception:', e);
    toast('Candidature enregistrée sur cet appareil uniquement (sync base échouée)', 'error');
    return false;
  }
}

// Supprime un tournoi de Supabase
async function deleteTournamentRemote(id) {
  if (!supabaseClient || signupMode !== 'real') return;
  try {
    const { error } = await supabaseClient.from('tournaments').delete().eq('id', id);
    if (error) console.error('[Le Tournoi] deleteTournament:', error);
  } catch (e) { console.error('[Le Tournoi] deleteTournament exception:', e); }
}

// Charge tous les tournois depuis Supabase au démarrage (mode réel)
async function loadTournamentsFromSupabase() {
  if (!supabaseClient || signupMode !== 'real') return;
  try {
    // SÉCURITÉ (RSSI/DBA) : owner_email n'est plus lisible publiquement (PII organisateur).
    // Cette liste doit rester synchronisée avec le GRANT SELECT côté Supabase.
    const { data, error } = await supabaseClient
      .from('tournaments')
      .select('id, club_id, name, edition, date, date_end, time_start, time_end, location, format, team_size, max_teams, entry_fee, surface, level, description, status, sponsor_tiers, animations, matches, created_at')
      .order('date', { ascending: true });
    if (error) { console.error('[Le Tournoi] loadTournaments:', error); return; }
    if (data && data.length > 0) {
      const remote = data.map(rowToTournament);
      // Fusion : les tournois distants remplacent/complètent les tournois de démo
      const remoteIds = new Set(remote.map(t => t.id));
      const localOnly = state.tournaments.filter(t => !remoteIds.has(t.id) && !t._remote);
      state.tournaments = [...remote, ...localOnly];
      console.log('[Le Tournoi] ' + remote.length + ' tournoi(s) chargé(s) depuis Supabase');
      render();
    }
  } catch (e) { console.error('[Le Tournoi] loadTournaments exception:', e); }
}

// Charge les candidatures depuis leur table dédiée (RSSI) — vide si INSERT-only pour anon
async function loadRegistrationsFromSupabase() {
  if (!supabaseClient || signupMode !== 'real') return;
  try {
    const { data, error } = await supabaseClient.from('registrations').select('*');
    if (error) { console.error('[Le Tournoi] loadRegistrations:', error); return; }
    (data || []).forEach(row => {
      const t = state.tournaments.find(t => t.id === row.tournament_id);
      if (t) t.registrations.push({
        id: row.id, teamId: row.team_id, teamName: row.team_name, clubName: row.club_name,
        status: row.status, message: row.message, registeredAt: row.registered_at
      });
    });
    if (data && data.length) render();
  } catch (e) { console.error('[Le Tournoi] loadRegistrations exception:', e); }
}

// Charge les propositions de sponsoring depuis leur table dédiée (RSSI)
async function loadSponsorProposalsFromSupabase() {
  if (!supabaseClient || signupMode !== 'real') return;
  try {
    const { data, error } = await supabaseClient.from('sponsor_proposals').select('*');
    if (error) { console.error('[Le Tournoi] loadSponsorProposals:', error); return; }
    (data || []).forEach(row => {
      const t = state.tournaments.find(t => t.id === row.tournament_id);
      if (t) t.sponsorProposals.push({
        id: row.id, sponsorId: row.sponsor_id, name: row.name, tier: row.tier,
        tierLabel: row.tier_label, amount: row.amount, status: row.status,
        contactName: row.contact_name, contact: row.contact, notes: row.notes, message: row.message
      });
    });
    if (data && data.length) render();
  } catch (e) { console.error('[Le Tournoi] loadSponsorProposals exception:', e); }
}

const KEY = 'tournoo_v2';
let state = loadState();
let activeTab = 'overview';
let signupType = 'club';
let loginType = 'club';

function loadState() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const loaded = JSON.parse(s);
      // Migration v1.A — injecte les nouveaux catalogues si absents du localStorage existant
      if (!loaded.catalog) loaded.catalog = {};
      const fresh = seed();
      if (!loaded.catalog.matchSizes)        loaded.catalog.matchSizes        = fresh.catalog.matchSizes;
      if (!loaded.catalog.genders)           loaded.catalog.genders           = fresh.catalog.genders;
      if (!loaded.catalog.surfaces)          loaded.catalog.surfaces          = fresh.catalog.surfaces;
      if (!loaded.catalog.competitionFormats)loaded.catalog.competitionFormats= fresh.catalog.competitionFormats;
      // Always refresh formats catalog to get latest labels and new categories
      loaded.catalog.formats = fresh.catalog.formats;
      if (!loaded.catalog.positions)         loaded.catalog.positions         = fresh.catalog.positions;
      if (!loaded.catalog.levels)            loaded.catalog.levels            = fresh.catalog.levels;
      if (!loaded.catalog.days)              loaded.catalog.days              = fresh.catalog.days;
      // Migration — add contact privacy fields to existing accounts
      ['clubs','teams','sponsors'].forEach(coll => {
        if (!loaded[coll]) return;
        loaded[coll].forEach(acc => {
          if (acc.shareEmail === undefined) acc.shareEmail = true;
          if (acc.sharePhone === undefined) acc.sharePhone = true;
          if (!acc.website) acc.website = '';
          // Encode existing plain-text contacts if not yet encoded
          if (acc.email && !acc._contactsEncoded) {
            acc.emailEncoded = encodeContact(acc.email);
            acc.phoneEncoded = encodeContact(acc.phone || '');
            acc._contactsEncoded = true;
          }
        });
      });
      // Migration v1.B — add new animation IDs if missing from existing catalog
      if (loaded.catalog.animations) {
        const existingIds = new Set(loaded.catalog.animations.map(a => a.id));
        fresh.catalog.animations.forEach(fa => {
          if (!existingIds.has(fa.id)) loaded.catalog.animations.push(fa);
        });
      } else {
        loaded.catalog.animations = fresh.catalog.animations;
      }
      return loaded;
    }
  } catch(e) {}
  return seed();
}
function saveState() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function resetState() {
  if (confirm('Réinitialiser toutes les données ?')) {
    localStorage.removeItem(KEY); state = seed(); saveState();
    navigate('#/'); toast('Données réinitialisées', 'success');
  }
}

// HELPERS
function uid() { return 'id-' + Math.random().toString(36).slice(2, 10); }
function getAccount() {
  if (!state.currentType) return null;
  const c = state.currentType === 'club' ? 'clubs' : state.currentType === 'team' ? 'teams' : 'sponsors';
  return state[c].find(a => a.id === state.currentId);
}
function getTournament(id) { return state.tournaments.find(t => t.id === id); }
function getAnim(id) { return state.catalog.animations.find(a => a.id === id); }
function getClub(id) { return state.clubs.find(c => c.id === id); }
function getTeam(id) { return state.teams.find(t => t.id === id); }
function getSponsor(id) { return state.sponsors.find(s => s.id === id); }
function esc(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// RSSI : valide une URL externe — bloque javascript:, data:, vbscript:
function safeUrl(u) {
  if (!u) return '';
  const s = String(u).trim();
  if (/^https?:\/\//i.test(s)) return esc(s);          // http(s) explicite : OK
  if (/^(javascript|data|vbscript|file):/i.test(s)) return ''; // schémas dangereux : rejeté
  if (/^[\w.-]+\.[a-z]{2,}/i.test(s)) return esc('https://' + s); // domaine sans schéma : préfixe https
  return '';
}
function fmtDate(iso) {
  const d = new Date(iso);
  const m = ['jan','fév','mar','avr','mai','juin','juil','août','sept','oct','nov','déc'];
  return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDay(iso) {
  const d = new Date(iso);
  return ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][d.getDay()];
}
function fmtMoney(n) { return n === 0 ? 'Gratuit' : `${n} €`; }
function formatLabel(v) { const f = state.catalog.formats.find(x => x.v === v); return f ? f.l : v; }
function levelLabel(v) { const l = state.catalog.levels.find(x => x.v === v); return l ? l.l : v; }
function posLabel(v) { const p = state.catalog.positions.find(x => x.v === v); return p ? p.l : v; }
function matchSizeLabel(v) { const m = state.catalog.matchSizes?.find(x => x.v === v); return m ? m.l : v; }
function genderLabel(v) { const g = state.catalog.genders?.find(x => x.v === v); return g ? g.l : v; }
function surfaceLabel(v) { const s = state.catalog.surfaces?.find(x => x.v === v); return s ? s.l : v; }
function compFormatLabel(v) { const c = state.catalog.competitionFormats?.find(x => x.v === v); return c ? c.l : v; }
// Backward-compat helpers — old tournaments only have 'location' & 'format' (single)
function tournVenue(t) {
  if (t.venueName && t.venueAddress) return { name: t.venueName, address: t.venueAddress };
  if (t.venueName) return { name: t.venueName, address: '' };
  if (t.location) return { name: t.location, address: '' };
  return { name: '', address: '' };
}
function tournCategories(t) {
  if (Array.isArray(t.categories) && t.categories.length) return t.categories;
  if (t.format) return [t.format];
  return [];
}
function tournCategoriesLabel(t) {
  const cats = tournCategories(t);
  if (!cats.length) return '—';
  return cats.map(c => formatLabel(c)).join(' · ');
}
function tournDateRange(t) {
  if (t.dateEnd && t.dateEnd !== t.date) return `${fmtDate(t.date)} → ${fmtDate(t.dateEnd)}`;
  return fmtDate(t.date);
}
function tournTimeRange(t) {
  if (!t.timeStart) return '';
  if (t.timeEnd) return t.timeStart + ' → ' + t.timeEnd;
  return 'à partir de ' + t.timeStart;
}

// Mots simples pour code de récupération mémorisable
const RECOVERY_WORDS = [
  'soleil','ballon','terrain','coupe','victoire','arbitre','gardien','penalty',
  'tribune','vestiaire','corner','carton','sifflet','maillot','filet','tifo',
  'stade','finale','podium','buteur','capitaine','remise','equipe','match',
  'saison','ligue','district','regionale','amateur','passion'
];
function genRecoveryCode() {
  // RSSI : génération cryptographiquement sûre (au lieu de Math.random)
  const pick = () => {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return RECOVERY_WORDS[arr[0] % RECOVERY_WORDS.length];
  };
  return pick() + '-' + pick() + '-' + pick() + '-' + pick();
}

function signupAccount(type, d) {
  const coll = type === 'club' ? 'clubs' : type === 'team' ? 'teams' : 'sponsors';
  if (state[coll].find(a => a.email === d.email)) return { error: 'Email déjà utilisé.' };
  const recoveryCode = genRecoveryCode();
  const account = { id: uid(), type, ...d, recoveryCode };
  state[coll].push(account);
  state.currentType = type; state.currentId = account.id;
  saveState(); return { account, recoveryCode };
}
function loginAccount(type, email, pwd) {
  const coll = type === 'club' ? 'clubs' : type === 'team' ? 'teams' : 'sponsors';
  const account = state[coll].find(a => a.email === email && a.password === pwd);
  if (!account) return { error: 'Email ou mot de passe incorrect.' };
  state.currentType = type; state.currentId = account.id;
  saveState(); return { account };
}
function logout() { state.currentType = null; state.currentId = null; saveState(); navigate('#/'); toast('Déconnecté'); }

  if (r === '/dashboard') return requireAuth(renderDashboard);
  if (r === '/tournaments') return renderTournaments();
  if (r === '/recover') return renderRecover();
  if (r === '/legal') return renderLegal();
  if (r === '/privacy') return renderPrivacy();
  if (r === '/tournaments/new') return requireAuth(renderCreateTournament, ['club']);
  if (r.match(/^\/tournaments\/[^\/]+\/edit$/)) return requireAuth(() => renderEditTournament(r.split('/')[2]), ['club']);

  if (r === '/sponsors') return renderSponsorsList();
  if (r.startsWith('/sponsors/')) return renderSponsorProfile(r.split('/')[2]);
  document.getElementById('app').innerHTML = `<div class="page-head"><h1 class="page-title">404 — <em>introuvable</em></h1><div class="page-head-actions"><a href="#/" class="btn btn-primary">Retour</a></div></div>`;
}
function requireAuth(cb, allowed) {
  const a = getAccount();
  if (!a) { toast('Connecte-toi d\'abord', 'error'); navigate('#/login'); return; }
  if (allowed && !allowed.includes(a.type)) {
    toast('Action réservée à un autre type de compte', 'error');
    navigate('#/dashboard'); return;
  }
  cb();
}

// HOME
// ===== Calcul de la distance approximative entre deux villes (heuristique simple) =====
function cityMatchScore(city1, city2) {
  if (!city1 || !city2) return 0;
  const c1 = city1.toLowerCase().trim();
  const c2 = city2.toLowerCase().trim();
  if (c1 === c2) return 3;
  // Départements IDF
  const deps = {
    '75': ['paris'], '92': ['neuilly','levallois','boulogne','issy','courbevoie','nanterre','puteaux','colombes','asnières','clichy','gennevilliers','rueil','suresnes','montrouge','clamart'],
    '93': ['saint-denis','bobigny','montreuil','aubervilliers','aulnay','pantin','noisy','bondy','drancy','épinay','villepinte'],
    '94': ['créteil','vincennes','vitry','champigny','maisons-alfort','alfortville','ivry','choisy','thiais','rungis'],
    '91': ['évry','corbeil','massy','palaiseau','longjumeau','viry','savigny'],
    '95': ['cergy','pontoise','argenteuil','sarcelles','gonesse','garges'],
    '77': ['melun','meaux','chelles','torcy','combs'],
    '78': ['versailles','saint-germain','mantes','poissy','sartrouville']
  };
  for (const [dep, cities] of Object.entries(deps)) {
    const in1 = cities.some(c => c1.includes(c) || c.includes(c1.split('-')[0]));
    const in2 = cities.some(c => c2.includes(c) || c.includes(c2.split('-')[0]));
    if (in1 && in2) return 2; // même département
  }
  return 1; // même région IDF par défaut
}

// ===== Score de priorité d'un tournoi pour l'affichage home =====
function tournPriorityScore(t, userCity) {
  if (t.status !== 'open') return -1;
  const approved = t.registrations.filter(r => r.status === 'approved').length;
  const total = t.maxTeams || 1;
  const placesLeft = total - approved;
  const fillRate = approved / total; // 0→vide, 1→complet
  let score = 0;
  // Critère 1 : places disponibles mais pas vide (plus intéressant si ~50-80% rempli)
  if (placesLeft > 0) score += 30;
  if (fillRate >= 0.5 && fillRate < 1) score += 20; // presque complet = urgence
  if (fillRate >= 0.8) score += 15; // très peu de places = forte urgence
  // Critère 2 : date proche (favoriser les 30 prochains jours)
  const today = new Date(); today.setHours(0,0,0,0);
  const tDate = new Date(t.date);
  const daysUntil = Math.floor((tDate - today) / 86400000);
  if (daysUntil >= 0 && daysUntil <= 7)  score += 25;  // cette semaine
  else if (daysUntil > 7 && daysUntil <= 30) score += 15; // ce mois
  else if (daysUntil > 30 && daysUntil <= 60) score += 5; // dans 2 mois
  else if (daysUntil < 0) score -= 50; // passé
  // Critère 3 : géolocalisation (optionnelle)
  if (userCity && t.location) {
    score += cityMatchScore(userCity, t.location) * 10;
  }
  return score;
}

// ===== Étiquette contextuelle pour une carte =====
function tournUrgencyLabel(t) {
  const approved = t.registrations.filter(r => r.status === 'approved').length;
  const total = t.maxTeams || 1;
  const placesLeft = total - approved;
  const fillRate = approved / total;
  const today = new Date(); today.setHours(0,0,0,0);
  const daysUntil = Math.floor((new Date(t.date) - today) / 86400000);
  if (placesLeft <= 2 && placesLeft > 0) return { label: placesLeft + ' place' + (placesLeft > 1 ? 's' : '') + ' restante' + (placesLeft > 1 ? 's' : ''), cls: 'urgency-critical' };
  if (fillRate >= 0.75) return { label: 'Presque complet', cls: 'urgency-high' };
  if (daysUntil >= 0 && daysUntil <= 7) return { label: 'Cette semaine', cls: 'urgency-soon' };
  if (daysUntil > 7 && daysUntil <= 14) return { label: 'Dans ' + daysUntil + ' jours', cls: 'urgency-soon' };
  if (placesLeft > 0 && fillRate < 0.3) return { label: 'Nouvellement ouvert', cls: 'urgency-new' };
  return null;
}
