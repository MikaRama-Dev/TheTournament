function makeMark(name) {
  return name.split(' ').filter(w => w.length > 1).slice(0, 3).map(w => w[0]).join('').toUpperCase().slice(0, 3);
}

async function handleSignup(e, type) {
  e.preventDefault();
  const errEl = document.getElementById('signup-err');
  errEl.classList.remove('show');

  // ===== Anti-spam honeypot =====
  const hp = document.getElementById('f-hp-website');
  if (hp && hp.value.trim() !== '') {
    // Silently reject bots — pretend success without doing anything
    console.log('[Le Tournoi] honeypot triggered, blocking');
    return;
  }

  // ===== Password confirmation check =====
  const pwd = document.getElementById('f-pwd').value;
  const pwd2 = document.getElementById('f-pwd2') ? document.getElementById('f-pwd2').value : pwd;
  if (pwd !== pwd2) {
    errEl.textContent = 'Les deux mots de passe ne correspondent pas. Re-saisis-les à l\'identique.';
    errEl.classList.add('show');
    document.getElementById('f-pwd2').focus();
    return;
  }
  if (pwd.length < 6) {
    errEl.textContent = 'Le mot de passe doit faire au moins 6 caractères.';
    errEl.classList.add('show');
    document.getElementById('f-pwd').focus();
    return;
  }

  const name = document.getElementById('f-name').value.trim();
  let d;
  if (type === 'club') {
    d = { name, email: document.getElementById('f-email').value.trim().toLowerCase(),
      password: document.getElementById('f-pwd').value,
      president: document.getElementById('f-pres').value.trim(),
      city: document.getElementById('f-city').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      mark: makeMark(name),
      logoClass: ['alt-1','alt-2','alt-3','alt-4',''][state.clubs.length % 5] };
  } else if (type === 'team') {
    d = { name, email: document.getElementById('f-email').value.trim().toLowerCase(),
      password: document.getElementById('f-pwd').value,
      club: document.getElementById('f-club').value.trim(),
      category: document.getElementById('f-cat').value,
      level: document.getElementById('f-lvl').value,
      manager: document.getElementById('f-mgr').value.trim(),
      city: document.getElementById('f-city').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      mark: makeMark(name), bio: '', availability: ['sat', 'sun'], players: [] };
  } else {
    d = { name, email: document.getElementById('f-email').value.trim().toLowerCase(),
      password: document.getElementById('f-pwd').value,
      sector: document.getElementById('f-sect').value.trim(),
      city: document.getElementById('f-city').value.trim(),
      contact: document.getElementById('f-cont').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      budgetRange: document.getElementById('f-budget').value,
      mark: makeMark(name), description: '', preferredCategories: [] };
  }

  // ====== Inscription réelle (Supabase) ======
  if (signupMode === 'real') {
    // Détecter file:// ou Supabase absent → message explicite + arrêt
    if (window.location.protocol === 'file:') {
      errEl.textContent = 'Les inscriptions réelles ne fonctionnent pas depuis un fichier local. Ouvrez le site via Live Server (localhost) ou sur GitHub Pages pour tester.';
      errEl.classList.add('show'); return;
    }
    if (!supabaseClient) {
      errEl.textContent = 'Supabase non configuré. Vérifiez que config.js contient vos vraies clés, puis rechargez la page.';
      errEl.classList.add('show'); return;
    }
    const consentData = document.getElementById('consent-data');
      if (!consentData || !consentData.checked) {
        errEl.textContent = 'Cochez le consentement RGPD obligatoire pour continuer.';
        errEl.classList.add('show'); return;
      }
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Envoi…'; }
      const r = await submitRealSignup(type, d, {
        dataCollection: consentData.checked,
        marketing: false
      });
      if (submitBtn) { submitBtn.disabled = false; }
      if (r.error) {
        errEl.textContent = r.error; errEl.classList.add('show');
        if (submitBtn) submitBtn.innerHTML = type === 'club'
          ? 'Créer un compte organisateur <span class="btn-arrow"></span>'
          : type === 'team'
          ? 'Créer un compte équipe <span class="btn-arrow"></span>'
          : 'Créer un compte sponsor <span class="btn-arrow"></span>';
        return;
      }
    // Succès inscription réelle — écran de confirmation détaillé
    const typeLabel = type === 'club' ? 'organisateur' : type === 'team' ? 'équipe participante' : 'sponsor';
    document.getElementById('app').innerHTML = `
      <div class="auth-page" style="max-width: 640px;">
        <div class="auth-card real-signup-success">
          <div class="icon">✓</div>
          <div class="auth-eyebrow" style="text-align: center; margin-bottom: 0.5rem;">▶ Inscription confirmée</div>
          <h1 class="auth-title" style="text-align: center; margin-bottom: 1.25rem;">Merci <em>${escapeHtml(name)}</em>.</h1>
          <p class="detail-text" style="margin-bottom: 1.5rem;">Ta demande d'inscription en tant que <strong>${typeLabel}</strong> a bien été enregistrée sur Le Tournoi.</p>

          <div style="background: var(--paper-soft); border: 1px solid var(--line); padding: 1.25rem 1.4rem; margin-bottom: 1.5rem; border-radius: 2px;">
            <div style="font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--ink-mute); margin-bottom: 0.85rem;">Récapitulatif de ton inscription</div>
            <div style="font-family: var(--font-serif); font-size: 0.98rem; line-height: 1.7;">
              <strong>Nom :</strong> ${escapeHtml(name)}<br>
              <strong>Email :</strong> ${escapeHtml(d.email)}<br>
              <strong>Ville :</strong> ${escapeHtml(d.city)}
              ${d.phone ? `<br><strong>Téléphone :</strong> ${escapeHtml(d.phone)}` : ''}
            </div>
          </div>

          <div style="background: var(--ink); color: var(--paper); padding: 1.25rem 1.4rem; margin-bottom: 1.5rem; border-radius: 2px;">
            <div style="font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent-soft); margin-bottom: 0.85rem;">Prochaines étapes</div>
            <ol style="font-family: var(--font-serif); font-size: 0.98rem; line-height: 1.65; padding-left: 1.4rem; margin: 0;">
              <li style="margin-bottom: 0.5rem;">Notre équipe te recontacte <strong>sous 24h</strong> par email pour finaliser ton accès.</li>
              <li style="margin-bottom: 0.5rem;">Tu recevras tes <strong>identifiants de connexion</strong> et un guide de démarrage personnalisé.</li>
              <li>Il sera possible de créer un premier tournoi ou de rejoindre un tournoi existant.</li>
            </ol>
          </div>

          <p class="detail-text" style="margin-bottom: 1.75rem; text-align: center; font-size: 0.92rem;">Une question ? Écris-nous à <a href="mailto:contact@letournoi.foot" style="border-bottom: 1px solid var(--accent); color: var(--ink);">contact@letournoi.foot</a></p>

          <div style="display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap;">
            <a href="#/" class="btn btn-primary">Retour à l'accueil</a>
            <a href="#/tournaments" class="btn btn-outline">Voir les tournois</a>
          </div>
        </div>
      </div>`;
    window.scrollTo(0, 0);
    return;
  } // fin du if (signupMode === 'real')

  // ====== Mode démo (inchangé) ======
  const r = signupAccount(type, d);
  if (r.error) { errEl.textContent = r.error; errEl.classList.add('show'); return; }
  navigate('#/dashboard');
  // Afficher le code de récupération après redirection
  if (r.recoveryCode) {
    setTimeout(() => showRecoveryCodeModal(r.recoveryCode), 400);
  } else {
    toast('Bienvenue !', 'success');
  }
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  modal('Votre code de récupération',
    `<div style="background:var(--ink);color:var(--paper);padding:1.5rem;border-radius:2px;text-align:center;margin:1rem 0;">

       <div style="font-family:var(--font-serif);font-size:1.5rem;letter-spacing:0.05em;margin-top:0.75rem;word-break:break-all;">${esc(code)}</div>

     <p style="font-family:var(--font-serif);font-size:0.92rem;line-height:1.6;color:var(--ink-soft);">

     </p>`,

        <button class="btn btn-ghost" onclick="renderRecover(1)">← Recommencer</button>
        <button class="btn btn-primary btn-full" onclick="handleRecoverStep2()">Enregistrer le nouveau mot de passe</button>
      </div>
    </div>`;

  document.getElementById('app').innerHTML = `
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-eyebrow">▶ Récupération d'accès</div>
        <h1 class="auth-title">Réinitialiser <em>le mot de passe.</em></h1>

        ${step === 1 ? stepOneContent : stepTwoContent}

        <!-- Option B : contact humain — toujours visible -->
        <div style="background:var(--paper-soft);border:1px solid var(--line);padding:1.25rem 1.5rem;border-radius:2px;margin-bottom:1.5rem;">
          <div style="font-family:var(--font-mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.15em;color:var(--ink-mute);margin-bottom:0.75rem;">Code perdu — Contact Le Tournoi</div>
          <p style="font-family:var(--font-serif);font-size:0.88rem;line-height:1.6;color:var(--ink-mute);margin-bottom:0.85rem;">

function handleRecoverStep1() {
  const errEl = document.getElementById('rec-err');
  errEl.classList.remove('show');
  const email = document.getElementById('rec-email').value.trim().toLowerCase();
  const code  = document.getElementById('rec-code').value.trim().toLowerCase();

  if (!email || !code) {
    errEl.textContent = 'Renseignez votre email et votre code de récupération.';
    errEl.classList.add('show'); return;
  }

  // Recherche dans toutes les collections
  let found = null;
  ['clubs', 'teams', 'sponsors'].forEach(coll => {
    const acc = state[coll].find(a =>
      a.email && a.email.toLowerCase() === email &&
      a.recoveryCode && a.recoveryCode.toLowerCase() === code
    );
    if (acc) found = acc;
  });

  if (!found) {
    errEl.textContent = 'Email ou code de récupération incorrect. Vérifiez la saisie.';
    errEl.classList.add('show'); return;
  }

  // Mémoriser le compte vérifié et passer à l'étape 2
  _recoverAccount = found;
  renderRecover(2);
}

function handleRecoverStep2() {
  const errEl = document.getElementById('rec-err2');
  errEl.classList.remove('show');

  if (!_recoverAccount) {
    renderRecover(1); return;
  }

  const pwd  = document.getElementById('rec-pwd').value;
  const pwd2 = document.getElementById('rec-pwd2').value;

  if (!pwd || !pwd2) {
    errEl.textContent = 'Renseignez et confirmez le nouveau mot de passe.';
    errEl.classList.add('show'); return;
  }
  if (pwd.length < 6) {
    errEl.textContent = 'Le mot de passe doit faire au moins 6 caractères.';
    errEl.classList.add('show'); return;
  }
  if (pwd !== pwd2) {
    errEl.textContent = 'Les deux mots de passe ne correspondent pas.';
    errEl.classList.add('show');
    document.getElementById('rec-pwd2').focus(); return;
  }

  // Mise à jour
  _recoverAccount.password = pwd;
  _recoverAccount.recoveryCode = genRecoveryCode(); // Nouveau code (usage unique)
  const newCode = _recoverAccount.recoveryCode;
  _recoverAccount = null; // Nettoyage
  saveState();

  modal('Mot de passe mis à jour',
    `<p style="font-family:var(--font-serif);font-size:1rem;line-height:1.65;margin-bottom:1rem;">
       Votre mot de passe a été réinitialisé avec succès.
     </p>

       Un nouveau code de récupération a été généré automatiquement. Notez-le dès maintenant — il ne sera plus affiché.
     </p>

       <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;color:var(--accent-soft);margin-bottom:0.6rem;">NOUVEAU CODE DE RÉCUPÉRATION</div>

function updateSortButtons(activeBtn) {
  // Mettre à jour la classe active sur les boutons de tri sans re-rendre
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  if (activeBtn) activeBtn.classList.add('active');
}

function updateTournamentResults() {
  const el = document.getElementById('t-results');
  if (!el) return;

  // Mémoriser le focus et la position curseur AVANT de toucher au DOM
  const focused = document.activeElement;
  const focusId  = focused ? focused.id : null;
  const selStart = focused && focused.selectionStart !== undefined ? focused.selectionStart : null;
  const selEnd   = focused && focused.selectionEnd   !== undefined ? focused.selectionEnd   : null;
  // Mémoriser la position de scroll
  const scrollY  = window.scrollY;

  const filtered = filterTournaments(
    tournamentSearchQuery, tournamentSearchLocation,
    tournamentSearchCategory, tournamentSearchStatus
  );
  const hasActiveFilters = !!(tournamentSearchQuery || tournamentSearchLocation ||
    tournamentSearchCategory || tournamentSearchStatus || tournamentSearchLevel ||
    tournamentSearchSurface || tournamentSearchFormat || tournamentSearchMaxFee);

  // Mettre à jour le compteur sans toucher aux champs
  const countEl = document.querySelector('.search-count');
  if (countEl) countEl.textContent = filtered.length + ' résultat' + (filtered.length !== 1 ? 's' : '');

  // Mettre à jour uniquement la zone résultats
  el.innerHTML = filtered.length === 0
    ? '<div class="dash-empty"><div class="dash-empty-title">Aucun tournoi trouvé</div><p class="dash-empty-text">Modifiez les critères de recherche, ou publiez un nouveau tournoi.</p><button class="btn btn-ghost btn-sm" onclick="clearAllTournamentFilters()">Voir tous les tournois</button></div>'
    : '<div class="grid grid-3">' + filtered.map(tournCard).join('') + '</div>';

  // Restituer le focus et la position du curseur
  if (focusId) {
    const el2 = document.getElementById(focusId);
    if (el2) {
      el2.focus();
      if (selStart !== null && el2.setSelectionRange) {
        el2.setSelectionRange(selStart, selEnd);
      }
    }
  }
  // Restituer la position de scroll
  window.scrollTo(0, scrollY);
}

function clearAllTournamentFilters() {
  tournamentSearchQuery = ''; tournamentSearchLocation = '';
  tournamentSearchCategory = ''; tournamentSearchStatus = '';
  tournamentSearchLevel = ''; tournamentSearchSurface = '';
  tournamentSearchFormat = ''; tournamentSearchMaxFee = '';
  tournamentSortBy = 'date'; tournamentAdvancedOpen = false;
  renderTournaments();
}

function filterTournaments(query, location, category, status) {
  let results = state.tournaments.filter(t => {
    const club = getClub(t.clubId);
    const nameMatch = !query || t.name.toLowerCase().includes(query.toLowerCase()) || (t.edition||'').toLowerCase().includes(query.toLowerCase());
    const venue = tournVenue(t);
    const locationMatch = !location ||
      (venue.name||'').toLowerCase().includes(location.toLowerCase()) ||
      (venue.address||'').toLowerCase().includes(location.toLowerCase()) ||
      (club?.city||'').toLowerCase().includes(location.toLowerCase()) ||
      (t.location||'').toLowerCase().includes(location.toLowerCase());
    const cats = tournCategories(t);
    const categoryMatch = !category || cats.includes(category);
    const statusMatch = !status || t.status === status;
    // Filtres avancés
    const levelMatch = !tournamentSearchLevel || (t.level === tournamentSearchLevel);
    const surfaceMatch = !tournamentSearchSurface || t.surface === tournamentSearchSurface;
    const formatMatch = !tournamentSearchFormat || t.matchSize === tournamentSearchFormat;
    const feeMatch = !tournamentSearchMaxFee || (t.entryFee || 0) <= parseFloat(tournamentSearchMaxFee);
    return nameMatch && locationMatch && categoryMatch && statusMatch && levelMatch && surfaceMatch && formatMatch && feeMatch;
  });

  // Tri
  results = [...results].sort((a, b) => {
    if (tournamentSortBy === 'date') {
      return (a.date || '').localeCompare(b.date || '');
    } else if (tournamentSortBy === 'location') {
      const ca = getClub(a.clubId)?.city || a.location || '';
      const cb = getClub(b.clubId)?.city || b.location || '';
      return ca.localeCompare(cb);
    } else if (tournamentSortBy === 'fee') {
      return (a.entryFee || 0) - (b.entryFee || 0);
    }
    return 0;
  });

  return results;
}

function handleCreateT(e) {
  e.preventDefault();
  const club = getAccount();
  const errEl = document.getElementById('t-err');
  errEl.classList.remove('show');

  // Collect selected categories
  const categories = [...document.querySelectorAll('#t-categories .day-check.selected')].map(el => el.dataset.v);
  if (categories.length === 0) {
    errEl.textContent = 'Sélectionne au moins une catégorie d\'âge.';
    errEl.classList.add('show');
    return;
  }

  const matchSize = document.getElementById('t-matchsize').value;
  // Derive teamSize from matchSize (for backward compat with bracket generation)
  const teamSizeMap = { '5v5': 5, '7v7': 7, '11v11': 11, 'futsal': 5 };
  const teamSize = teamSizeMap[matchSize] || 11;

  const compFormat = document.getElementById('t-compformat').value;
  const compFormatOther = document.getElementById('t-compformat-other').value.trim();

  const venueName = document.getElementById('t-venue-name').value.trim();
  const venueAddress = document.getElementById('t-venue-address').value.trim();

  const dateStart = document.getElementById('t-date').value;
  const dateEnd = document.getElementById('t-date-end').value || dateStart; // Default to same day
  const timeStart = document.getElementById('t-time-start')?.value || '';
  const timeEnd   = document.getElementById('t-time-end')?.value   || '';

  // Block past dates
  const today = new Date().toISOString().split('T')[0];
  if (dateStart < today) {
    errEl.textContent = 'La date de début ne peut pas être dans le passé.';
    errEl.classList.add('show');
    return;
  }
  if (dateEnd && dateEnd < dateStart) {
    errEl.textContent = 'La date de fin doit être après la date de début.';
    errEl.classList.add('show');
    return;
  }

  const t = {
    id: uid(), clubId: club.id,
    name: document.getElementById('t-name').value.trim(),
    edition: document.getElementById('t-ed').value.trim() || '1ère édition',
    date: dateStart,
    dateEnd: dateEnd || dateStart,
    timeStart,
    timeEnd,
    // New venue fields
    venueName, venueAddress,
    // Keep legacy 'location' for backward compat (combined display)
    location: venueName + (venueAddress ? ' — ' + venueAddress : ''),
    // New categorization
    categories,
    matchSize,
    gender: document.getElementById('t-gender').value,
    surface: document.getElementById('t-surface').value,
    competitionFormat: compFormat,
    competitionFormatOther: compFormat === 'autres' ? compFormatOther : '',
    // Legacy 'format' field kept = first selected category (for backward compat)
    format: categories[0],
    teamSize,
    maxTeams: parseInt(document.getElementById('t-max').value),
    entryFee: parseInt(document.getElementById('t-fee').value),
    description: document.getElementById('t-desc').value.trim(),
    // Contact info
    contactName:         document.getElementById('t-contact-name').value.trim(),
    contactPhone:        document.getElementById('t-contact-phone').value.trim(),
    contactEmail:        document.getElementById('t-contact-email').value.trim(),
    contactVisible:      document.getElementById('t-contact-visible')?.checked !== false,
    contactShareEmail:   document.getElementById('t-contact-visible')?.checked !== false,
    contactSharePhone:   document.getElementById('t-contact-visible')?.checked !== false,
    // System
    status: 'open',
    registrations: [],
    sponsorProposals: [],
    animations: [],
    matches: [],
    sponsorTiers: [
      { name: 'or', price: 800, perks: ['Logo bannière entrée', 'Logo trophée', 'Annonces micro × 8', '20 invitations'], slots: 2 },
      { name: 'argent', price: 350, perks: ['Logo affiches', 'Annonces × 4', '10 invitations'], slots: 4 },
      { name: 'bronze', price: 150, perks: ['Logo affiches', '5 invitations'], slots: 8 }
    ]
  };
  state.tournaments.push(t);
  saveState();
  syncTournament(t);  // J1 : persistance Supabase en mode réel
  toast('Tournoi créé !', 'success');
  navigate(`#/tournaments/${t.id}`);
}

        ${t.surface ? `<div class="info-item">
          <p class="info-label">Surface</p>
          <p class="info-val">${esc(surfaceLabel(t.surface))}</p>
        </div>` : ''}
        ${t.competitionFormat ? `<div class="info-item">
          <p class="info-label">Format de compétition</p>
          <p class="info-val">${esc(t.competitionFormat === 'autres' && t.competitionFormatOther ? t.competitionFormatOther : compFormatLabel(t.competitionFormat))}</p>
        </div>` : ''}
        <div class="info-item">
          <p class="info-label">Nb max d'équipes</p>
          <p class="info-val">${t.maxTeams}</p>
        </div>
        <div class="info-item">
          <p class="info-label">Frais d'inscription</p>
          <p class="info-val">${fmtMoney(t.entryFee)}</p>
        </div>
        ${t.timeStart ? `<div class="info-item">
          <p class="info-label">Horaires</p>
          <p class="info-val">${esc(tournTimeRange(t))}</p>
        </div>` : ''}
      </div>
    </div>

    <div class="detail-section">
      <h3 class="detail-section-title">Lieu</h3>
      <div class="venue-box">
        <p class="venue-name">${esc(tournVenue(t).name || 'Lieu à confirmer')}</p>
        ${tournVenue(t).address ? `<p class="venue-address">${esc(tournVenue(t).address)}</p>
          <a class="venue-map-link" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(tournVenue(t).address)}">Voir sur Google Maps →</a>` : ''}
      </div>
    </div>

    ${renderContactBlock(t.contactName, t.contactPhone, t.contactEmail, t.contactVisible !== false, isOwner)}

    ${(() => {
      const confSp = t.sponsorProposals ? t.sponsorProposals.filter(sp => sp.status === 'confirme') : [];
      if (confSp.length === 0) return '';
      const tierIcon = tier => tier==='or'?'◆':tier==='_autre'?'★':tier==='argent'?'◇':'●';
      const tierColor = tier => tier==='or'?'var(--bronze)':tier==='_autre'?'var(--accent)':'var(--ink-mute)';
      return '<div class="detail-section">'
        + '<h3 class="detail-section-title">Soutenu par</h3>'
        + '<div class="sponsors-preview">'
        + confSp.slice(0,8).map(sp =>
            '<div class="sponsor-chip">'
            + '<span class="sponsor-chip-icon" style="color:' + tierColor(sp.tier) + ';">' + tierIcon(sp.tier) + '</span>'
            + '<span class="sponsor-chip-name">' + esc(sp.name) + '</span>'
            + '</div>'
          ).join('')
        + (confSp.length > 8 ? '<div class="sponsor-chip"><span class="sponsor-chip-name" style="color:var(--ink-mute);">+' + (confSp.length-8) + ' autres</span></div>' : '')
        + '</div></div>';
    })()}

    ${(() => {
      const selAnims = (state.catalog.animations||[]).filter(an => t.animations && t.animations.includes(an.id));
      const customA = t.customAnimations || [];
      const allAnims = [...selAnims.map(a => a.name), ...customA.map(a => a.name)];
      if (allAnims.length === 0) return '';
      return '<div class="detail-section">'
        + '<h3 class="detail-section-title">Au programme</h3>'
        + '<div class="activities-preview">'
        + allAnims.slice(0,8).map(name => '<span class="activity-chip">' + esc(name) + '</span>').join('')
        + (allAnims.length > 8 ? '<span class="activity-chip" style="color:var(--ink-mute);">+' + (allAnims.length-8) + ' autres</span>' : '')
        + '</div></div>';
    })()}`;
  }
  if (activeTab === 'calendar') return renderTabCalendar(t, isOwner);
  if (activeTab === 'teams') return renderTabTeams(t, isOwner, a);
  if (activeTab === 'sponsors') return renderTabSponsors(t, isOwner, a);
  if (activeTab === 'animations') return renderTabAnimations(t, isOwner);
  if (activeTab === 'finances') return renderTabFinances(t, isOwner);
}

// CALENDAR TAB
function renderTabCalendar(t, isOwner) {
  if (t.matches.length === 0 && !isOwner) {
    return `<div class="dash-empty"><div class="dash-empty-title">Calendrier pas encore publié</div><p class="dash-empty-text">Le club n'a pas encore programmé les matchs.</p></div>`;
  }
  const byStage = { poule: [], quart: [], demi: [], finale: [], autre: [] };
  t.matches.forEach(m => { (byStage[m.stage] || byStage.autre).push(m); });
  const labels = { poule: 'Phase de poules', quart: 'Quarts de finale', demi: 'Demi-finales', finale: 'Finale', autre: 'Autres matchs' };

  return `
    ${isOwner ? `
      <div style="background: var(--paper-deep); border-left: 3px solid var(--accent); padding: 0.9rem 1.1rem; margin-bottom: 1.5rem; font-family: var(--font-mono); font-size: 12px; line-height: 1.5;">
        <strong style="text-transform: uppercase; letter-spacing: 0.1em;">Mode organisateur</strong><br>
        Programme tes matchs avec terrains et horaires. Les équipes verront le calendrier en temps réel.
      </div>
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
        <button class="btn btn-orange btn-sm" onclick="addMatchModal('${t.id}')">+ Ajouter un match</button>
        <button class="btn btn-outline btn-sm" onclick="generateBracketModal('${t.id}')">⚙ Générer le bracket</button>
      </div>` : ''}
    ${t.matches.length === 0 ? `
      <div class="dash-empty">
        <div class="dash-empty-title">Aucun match programmé</div>
        <p class="dash-empty-text">Commence par ajouter ton premier match ou générer le bracket.</p>
      </div>` : Object.keys(byStage).map(stage => {
      const ms = byStage[stage];
      if (ms.length === 0) return '';
      return `
        <div class="cal-section">
          <div class="cal-header">
            <div class="cal-title">${labels[stage]}</div>
            <div style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.1em;">${ms.length} match${ms.length > 1 ? 's' : ''}</div>
          </div>
          <div class="match-list">
            ${ms.sort((a, b) => (a.time || '').localeCompare(b.time || '')).map(m => matchRow(m, t, isOwner)).join('')}
          </div>
        </div>`;
    }).join('')}`;
}
function matchRow(m, t, isOwner) {
  const hasScore = m.scoreA !== null && m.scoreB !== null;
  return `
    <div class="match-row">
      <div class="match-time">
        <div class="match-time-hr">${esc(m.time || '?')}</div>
        <div class="match-time-day">${m.date ? fmtDate(m.date).split(' ').slice(0, 2).join(' ') : ''}</div>
      </div>
      <div>
        ${m.stage !== 'autre' ? `<span class="match-stage ${m.stage}">${m.stage}${m.poule ? ' ' + m.poule : ''}</span>` : ''}
        <div class="match-teams">
          <span class="match-team">${esc(m.teamA || 'À déterminer')}</span>
          ${hasScore ? `<span class="match-score">${m.scoreA} - ${m.scoreB}</span>` : `<span class="match-vs">vs</span>`}
          <span class="match-team right">${esc(m.teamB || 'À déterminer')}</span>
        </div>
      </div>
      <div class="match-field">${esc(m.field || '—')}</div>
      ${isOwner ? `
        <div class="match-actions">
          <button class="btn btn-outline btn-sm" onclick="editMatchModal('${t.id}', '${m.id}')">Édit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteMatch('${t.id}', '${m.id}')">×</button>
        </div>` : `<div></div>`}
    </div>`;
}

// TEAMS TAB
function renderTabTeams(t, isOwner, a) {
  const approved  = t.registrations.filter(r => r.status === 'approved');
  const pending   = t.registrations.filter(r => r.status === 'pending');
  const rejected  = t.registrations.filter(r => r.status === 'rejected');
  const withdrawn = t.registrations.filter(r => r.status === 'withdrawn');
  const activeCount = approved.length;
  let html = '';
  if (isOwner && pending.length > 0) {
    html += `
      <div class="detail-section">
        <h3 class="detail-section-title">Demandes en attente (${pending.length})</h3>
        <div class="list">
          ${pending.map(r => `
            <div class="app-card">
              <div>
                <div class="app-card-title">${esc(r.teamName)}</div>
                <div class="app-card-meta">${esc(r.clubName)} · inscription ${fmtDate(r.registeredAt)}${r.teamId ? ' · <a href="#/teams/' + r.teamId + '" style="color: var(--accent); border-bottom: 1px solid;">Voir profil</a>' : ''}</div>
                ${r.message ? `<div class="app-card-msg">"${esc(r.message)}"</div>` : ''}
              </div>
              <div class="app-actions">
                <button class="btn btn-success btn-sm" onclick="approveTeam('${t.id}', '${r.id}')">✓ Approuver</button>
                <button class="btn btn-danger btn-sm" onclick="rejectTeam('${t.id}', '${r.id}')">× Refuser</button>
              </div>
            </div>`).join('')}
        </div>
      </div>`;
  }
  html += `
    <div class="detail-section">
      <h3 class="detail-section-title">Équipes confirmées (${activeCount}/${t.maxTeams}) — ${t.maxTeams - activeCount} place${t.maxTeams - activeCount > 1 ? 's' : ''} disponible${t.maxTeams - activeCount > 1 ? 's' : ''}</h3>
      ${activeCount === 0 ? `
        <div class="dash-empty">
          <div class="dash-empty-title">Pas encore d'équipe confirmée</div>
          <p class="dash-empty-text">${a?.type === 'team' ? 'Aucune équipe confirmée pour le moment.' : 'Les inscriptions vont arriver.'}</p>
          ${a?.type === 'team' && !t.registrations.some(r => r.teamId === a.id) ? `<button class="btn btn-orange btn-sm" onclick="applyTournamentModal('${t.id}')">Postuler</button>` : ''}
          ${isOwner ? `<button class="btn btn-outline btn-sm" onclick="quickRegisterModal('${t.id}')">Inscrire manuellement</button>` : ''}
        </div>` : `
        <div class="list">
          ${approved.map((r, i) => `
            <div class="list-row">
              <div class="list-num">${String(i + 1).padStart(2, '0')}</div>
              <div class="list-info">
                <div class="list-name">${esc(r.teamName)}</div>
                <div class="list-sub">${esc(r.clubName)}${r.teamId ? ' · <a href="#/teams/' + r.teamId + '" style="color: var(--accent); border-bottom: 1px solid;">Profil</a>' : ''} · inscrite le ${fmtDate(r.registeredAt)}</div>
              </div>
              <span class="list-status approved">✓ Confirmée</span>
              ${isOwner ? `<button class="btn btn-danger btn-sm" onclick="withdrawTeam('${t.id}', '${r.id}')" title="Retirer et libérer la place">Retirer</button>` : ''}
            </div>`).join('')}
        </div>
        ${isOwner ? `<div style="margin-top: 1rem;"><button class="btn btn-outline btn-sm" onclick="quickRegisterModal('${t.id}')">+ Inscrire manuellement</button></div>` : ''}`}
    </div>`;
  if (isOwner && (rejected.length > 0 || withdrawn.length > 0)) {
    html += `
      <div class="detail-section">
        <h3 class="detail-section-title" style="color: var(--ink-mute);">Historique (${rejected.length + withdrawn.length})</h3>
        <div class="list" style="opacity: 0.6;">
          ${[...rejected, ...withdrawn].map(r => `
            <div class="list-row">
              <div class="list-num">×</div>
              <div class="list-info">
                <div class="list-name">${esc(r.teamName)}</div>
                <div class="list-sub">${esc(r.clubName)} · ${r.status === 'withdrawn' ? 'Retirée' : 'Refusée'}</div>
              </div>
              <span class="list-status ${r.status === 'withdrawn' ? 'pending' : 'rejected'}">${r.status === 'withdrawn' ? 'Retirée' : 'Refusée'}</span>
            </div>`).join('')}
        </div>
      </div>`;
  }
  return html;
}

// SPONSORS TAB — owner only
function renderTabSponsors(t, isOwner, a) {
  const conf = t.sponsorProposals.filter(sp => sp.status === 'confirme');
  if (!isOwner) {
    // Vue publique — sponsors confirmés visibles par tous
    if (conf.length === 0) {
      return `<div class="dash-empty">
        <div class="dash-empty-title">Aucun partenaire annoncé</div>
        <p class="dash-empty-text">Les partenaires du tournoi seront annoncés prochainement.</p>
      </div>`;
    }
    // Regroup by tier for a nicer display
    const tierOrder = ['or', 'argent', 'bronze', '_autre'];
    const tierLabels = { or: 'Partenaire principal', argent: 'Partenaire', bronze: 'Soutien', _autre: 'Partenariat' };
    const tierColors = { or: 'var(--bronze)', argent: 'var(--ink-mute)', bronze: 'var(--accent-soft)', _autre: 'var(--accent)' };
    const tierIcons = { or: '◆', argent: '◇', bronze: '●', _autre: '★' };
    const grouped = tierOrder.map(tier => ({
      tier,
      label: tierLabels[tier],
      sponsors: conf.filter(sp => sp.tier === tier)
    })).filter(g => g.sponsors.length > 0);

    return `
      <div class="detail-section">
        <h3 class="detail-section-title">Sponsors & partenaires du tournoi</h3>
        <div style="display: flex; flex-direction: column; gap: 1.5rem;">
          ${grouped.map(g => `
            <div>
              <div class="section-eyebrow" style="margin-bottom: 0.75rem;">${esc(g.label)}</div>
              <div class="list">
                ${g.sponsors.map(sp => `
                  <div class="list-row">
                    <div class="list-num" style="color: ${tierColors[sp.tier]};">${tierIcons[sp.tier]}</div>
                    <div class="list-info">
                      <div class="list-name" style="font-size: 1.2rem;">${esc(sp.name)}</div>
                      ${sp.notes ? `<div class="list-sub">${esc(sp.notes)}</div>` : ''}
                    </div>
                  </div>`).join('')}
              </div>
            </div>`).join('')}
        </div>
      </div>`;
  }
  return `
    <div class="detail-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 0.5rem;">
        <h3 class="detail-section-title" style="border: none; padding: 0; margin: 0;">Sponsors (${conf.length})</h3>
        <button class="btn btn-orange btn-sm" onclick="addSponsorManualModal('${t.id}')">+ Ajouter un sponsor</button>
      </div>
      ${conf.length === 0 ? `
        <div class="dash-empty">
          <div class="dash-empty-title">Aucun sponsor pour le moment</div>
          <p class="dash-empty-text">Ajoute tes partenaires après les avoir démarchés.</p>
          <button class="btn btn-primary btn-sm" onclick="addSponsorManualModal('${t.id}')">+ Premier sponsor</button>
        </div>` : `
        <div class="list">
          ${conf.map(sp => {
            const col = sp.tier === 'or' ? 'var(--bronze)' : sp.tier === '_autre' ? 'var(--accent)' : 'var(--ink-mute)';
            const ico = sp.tier === 'or' ? '◆' : sp.tier === '_autre' ? '★' : sp.tier === 'argent' ? '◇' : '●';
            const tierDisplay = sp.tier === '_autre' ? (sp.tierLabel || 'Partenariat perso') : ('Palier ' + esc(sp.tier));
            const perksLine = sp.perks && sp.perks.length ? sp.perks.join(' · ') : '';
            return `
              <div class="list-row">
                <div class="list-num" style="color:${col};">${ico}</div>
                <div class="list-info">
                  <div class="list-name">${esc(sp.name)}</div>
                  <div class="list-sub">${tierDisplay}${sp.amount > 0 ? ' · ' + sp.amount + ' €' : ''}${sp.contactName ? ' · ' + esc(sp.contactName) : ''}${sp.contact ? ' · ' + esc(sp.contact) : ''}${sp.notes ? ' · ' + esc(sp.notes) : ''}</div>
                  ${perksLine ? `<div class="list-sub" style="margin-top:0.2rem;font-style:normal;color:var(--ink-soft);">${esc(perksLine)}</div>` : ''}
                </div>
                <span class="list-status confirme">Confirmé</span>
                <button class="btn btn-danger btn-sm" onclick="removeSponsor('${t.id}', '${sp.id}')">×</button>
              </div>`;
          }).join('')}
        </div>`}
    </div>
    <div class="detail-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 0.5rem;">
        <h3 class="detail-section-title" style="border: none; padding: 0; margin: 0;">Paliers de partenariat</h3>
        <button class="btn btn-outline btn-sm" onclick="editTiersModal('${t.id}')">Configurer</button>
      </div>
      <div class="sponsor-tiers">
        ${(t.sponsorTiers || []).map(tr => {
          const taken = conf.filter(c => c.tier === tr.name).length;
          return `
            <div class="sponsor-tier">
              <div class="sponsor-tier-head">
                <span class="sponsor-tier-name">${esc(tr.label || tr.name.toUpperCase())}</span>
                <span class="tier-slots" style="font-size:11px;">${taken}/${tr.slots} partenaire${tr.slots > 1 ? 's' : ''}</span>
              </div>
              <ul class="sponsor-tier-perks">${(tr.perks||[]).map(p => `<li>${esc(p)}</li>`).join('')}</ul>
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

  return `

      <div class="anim-grid">

          const sel = t.animations.includes(an.id);

          return `

        }).join('')}

          <div class="anim-card selected">
            <span class="anim-tag">✓ Au programme</span>

          </div>`).join('')}
      </div>
    </div>
    ${isOwner ? `
    <div class="detail-section">
      <h3 class="detail-section-title">Ajouter une animation personnalisée</h3>
      <div style="display: flex; gap: 0.65rem; flex-wrap: wrap; align-items: flex-end;">
        <div class="form-group" style="flex: 2; min-width: 180px; margin: 0;">
          <label class="form-label">Nom</label>
          <input class="input" id="custom-anim-name" placeholder="Village associatif, Tombola...">
        </div>
        <div class="form-group" style="flex: 3; min-width: 200px; margin: 0;">
          <label class="form-label">Description (optionnel)</label>
          <input class="input" id="custom-anim-desc" placeholder="Brève description">
        </div>
        <button class="btn btn-primary" style="height: 44px; flex-shrink: 0;" onclick="addCustomAnim('${t.id}')">+ Ajouter</button>
      </div>
    </div>` : ''}`;
}
function toggleAnim(tid, aid) {
  const t = getTournament(tid);
  if (t.animations.includes(aid)) { t.animations = t.animations.filter(a => a !== aid); toast('Retirée'); }
  else { t.animations.push(aid); toast('Ajoutée', 'success'); }
  saveState(); renderTournamentDetail(tid);
}
function addCustomAnim(tid) {
  const t = getTournament(tid);
  const name = document.getElementById('custom-anim-name').value.trim();
  if (!name) { toast('Saisis un nom', 'error'); return; }
  if (!t.customAnimations) t.customAnimations = [];
  t.customAnimations.push({ id: uid(), name, desc: document.getElementById('custom-anim-desc').value.trim() });
  saveState(); toast('Animation ajoutée', 'success');
  activeTab = 'animations'; renderTournamentDetail(tid);
}
function removeCustomAnim(tid, aid) {
  const t = getTournament(tid);
  if (!t.customAnimations) return;
  t.customAnimations = t.customAnimations.filter(a => a.id !== aid);
  saveState(); toast('Animation retirée');
  activeTab = 'animations'; renderTournamentDetail(tid);
}


// ASIDE
function renderAside(t, isOwner, a) {
  // Places: only 'approved' count against capacity; pending/withdrawn don't occupy a slot
  const conf = t.registrations.filter(r => r.status === 'approved').length;
  const spTotal = t.sponsorProposals.filter(sp => sp.status === 'confirme').reduce((s, sp) => s + sp.amount, 0);
  const animTot = t.animations.reduce((s, id) => s + (getAnim(id)?.price || 0), 0);
  const teamsRev = t.registrations.filter(r => r.status === 'approved').length * t.entryFee;
  const canApply = a?.type === 'team' && !t.registrations.some(r => r.teamId === a.id);
  const hasApplied = a?.type === 'team' && t.registrations.some(r => r.teamId === a.id);
  const myReg = hasApplied ? t.registrations.find(r => r.teamId === a.id) : null;
  const canPropose = a?.type === 'sponsor' && !t.sponsorProposals.some(sp => sp.sponsorId === a.id);
  const hasProposed = a?.type === 'sponsor' && t.sponsorProposals.some(sp => sp.sponsorId === a.id);
  const myProp = hasProposed ? t.sponsorProposals.find(sp => sp.sponsorId === a.id) : null;

  let html = `
    <div class="aside-card">
      <div class="aside-title">Inscription</div>
      <p class="aside-sub">${conf}/${t.maxTeams} équipes</p>
      <div class="aside-stats">
        <div class="aside-stat"><div class="aside-stat-label">Places</div><div class="aside-stat-val">${t.maxTeams - conf}</div></div>
        <div class="aside-stat"><div class="aside-stat-label">Tarif</div><div class="aside-stat-val">${fmtMoney(t.entryFee)}</div></div>
      </div>`;
  if (!a) {
    html += `<a href="#/login" class="btn btn-orange btn-full">Se connecter pour postuler</a>`;
  } else if (canApply && conf < t.maxTeams) {
    html += `<button class="btn btn-orange btn-full" onclick="applyTournamentModal('${t.id}')">Postuler avec mon équipe <span class="btn-arrow"></span></button>`;
  } else if (hasApplied) {

            ${esc(myProp.tier).toUpperCase()} · ${myProp.amount}€
          </div>` : ''}
      </div>`;
  }

  if (isOwner) {
    html += `
      <div class="aside-card">
        <div class="aside-title">Budget</div>

        </div>
      </div>`;
  }

  return html;
}

    const perks = [];
    Object.keys(PERK_MAP).forEach(k => {
      const cb = document.getElementById('tier-' + i + '-' + k);
      if (cb && cb.checked) perks.push(PERK_MAP[k]);
    });
    if (!t.sponsorTiers) t.sponsorTiers = [];
    t.sponsorTiers.push({
      name: 'tier-' + uid(),

      slots: parseInt(slt?.value)||2,

// ===== ROT13 encode/decode for contact info anti-scraper =====
function rot13(s) {
  return (s || '').replace(/[A-Za-z]/g, c => {
    const base = c <= 'Z' ? 65 : 97;
    return String.fromCharCode(((c.charCodeAt(0) - base + 13) % 26) + base);
  });
}

// ===== Badge helpers =====
const BADGES_CLUB = [
  { min: 5, label: 'Organisateur Or',    icon: '◆', css: 'badge-gold' },
  { min: 3, label: 'Organisateur Argent',icon: '◇', css: 'badge-silver' },
  { min: 1, label: 'Organisateur',       icon: '●', css: 'badge-bronze' },
];
const BADGES_TEAM = [
  { min: 5, label: 'Équipe habituée',    icon: '◆', css: 'badge-gold' },
  { min: 3, label: 'Équipe régulière',   icon: '◇', css: 'badge-silver' },
  { min: 1, label: 'Participante',       icon: '●', css: 'badge-bronze' },
];
function clubBadge(clubId) {
  const count = state.tournaments.filter(t => t.clubId === clubId).length;
  const b = BADGES_CLUB.find(x => count >= x.min);
  return b ? { ...b, count } : null;
}
function teamBadge(teamId) {
  let count = 0;
  state.tournaments.forEach(t => t.registrations.forEach(r => { if (r.teamId === teamId && r.status === 'approved') count++; }));
  const b = BADGES_TEAM.find(x => count >= x.min);
  return b ? { ...b, count } : null;
}
function renderBadge(b, extraStyle) {
  if (!b) return '';
  return `<span class="badge-pill ${b.css}" style="${extraStyle||''}" title="${esc(b.label)} — ${b.count} tournoi${b.count > 1 ? 's' : ''}">${b.icon} ${esc(b.label)}</span>`;
}

// ===== Render secure contact block =====
// ===== Fragmente une valeur en 3 parties pour stockage anti-scraper =====
function splitContact(v) {
  if (!v) return ['', '', ''];
  // Pour email : sépare local @ domaine
  const at = v.indexOf('@');
  if (at > 0) {
    return [rot13(v.slice(0, at)), rot13('@'), rot13(v.slice(at + 1))];
  }
  // Pour téléphone : découpe en 3 blocs
  const clean = v.replace(/\s/g, '');
  const l = Math.ceil(clean.length / 3);
  return [rot13(clean.slice(0, l)), rot13(clean.slice(l, l * 2)), rot13(clean.slice(l * 2))];
}

// ===== Assemble les fragments en mémoire JS (jamais dans le DOM) =====
function assembleContact(el) {
  const p1 = rot13(el.getAttribute('data-p1') || '');
  const p2 = rot13(el.getAttribute('data-p2') || '');
  const p3 = rot13(el.getAttribute('data-p3') || '');
  return p1 + p2 + p3;
}

    h += '<div class="contact-reveal-wrap">'

      + ' data-p1="' + parts[0] + '" data-p2="' + parts[1] + '" data-p3="' + parts[2] + '"'

  if (contactEmail) {
    const parts = splitContact(contactEmail);
    // Email fragmenté en 3 attributs ROT13 : local | @ | domaine
    h += '<div class="contact-reveal-wrap">'
      + '<button class="btn btn-outline btn-sm contact-reveal-btn"'
      + ' data-p1="' + parts[0] + '" data-p2="' + parts[1] + '" data-p3="' + parts[2] + '"'
      + ' data-k="email"'
      + ' onclick="revealContact(this)"'
      + ' title="Voir email" data-ready="0">✉ Voir email</button>'
      + '</div>';
  }

  h += '</div></div></div>';
  return h;
}

// Révélation anti-bot :
// 1. Délai de 300ms (les bots cliquent instantanément)
// 2. L'email est assemblé en mémoire JS uniquement
// 3. Affiché via CSS data-attribute — jamais en clair dans innerHTML
// 4. Le lien d'action (mailto/tel) est déclenché par JS, jamais écrit dans le DOM
function revealContact(btn) {
  if (btn.getAttribute('data-ready') === '1') {
    // Déjà révélé — déclencher l'action directement
    const v = btn.getAttribute('data-revealed');
    const k = btn.getAttribute('data-k');
    if (k === 'email') window.location.href = 'mailto:' + v;
    else window.location.href = 'tel:' + v.replace(/\s/g, '');
    return;
  }
  // Désactiver pendant le délai anti-bot
  btn.disabled = true;
  btn.textContent = '···';
  // Délai 300ms minimum — trop court pour l'humain, bloquant pour les bots rapides
  setTimeout(function() {
    const v = assembleContact(btn);
    const k = btn.getAttribute('data-k');
    btn.disabled = false;
    btn.setAttribute('data-ready', '1');
    // Stocker assemblé (toujours non-indexable car pas de href)
    btn.setAttribute('data-revealed', v);
    // Afficher via CSS uniquement — le texte est dans un pseudo-élément,
    // pas dans le contenu texte du nœud DOM
    const wrap = btn.parentNode;
    const reveal = document.createElement('span');
    reveal.className = 'contact-css-reveal';
    // Fragmentation CSS : les deux moitiés dans deux attributs séparés
    // Un robot doit exécuter CSS + JS pour reconstituer — barrière haute
    const half = Math.ceil(v.length / 2);
    reveal.setAttribute('data-a', v.slice(0, half));
    reveal.setAttribute('data-b', v.slice(half));
    reveal.setAttribute('data-k', k);
    reveal.setAttribute('title', k === 'email' ? 'Cliquer pour envoyer un email' : 'Cliquer pour appeler');
    reveal.setAttribute('role', 'button');
    reveal.setAttribute('tabindex', '0');
    reveal.onclick = function() {
      if (k === 'email') window.location.href = 'mailto:' + v;
      else window.location.href = 'tel:' + v.replace(/\s/g, '');
    };
    reveal.onkeydown = function(e) {
      if (e.key === 'Enter' || e.key === ' ') reveal.onclick();
    };
    wrap.replaceChild(reveal, btn);
  }, 300);
}

function exportBilanExcel(tid) {
  // Vérifier que SheetJS est chargé
  if (typeof XLSX === 'undefined') {
    toast('Chargement en cours, veuillez réessayer dans quelques secondes', 'error');
    return;
  }

  const t = getTournament(tid);
  const club = getClub(t.clubId);
  const equipes = t.registrations.filter(r => r.status === 'approved').length;
  const recInscriptions = equipes * (t.entryFee || 0);
  const recSponsors = (t.sponsorProposals || [])
    .filter(sp => sp.status === 'confirme')
    .reduce((s, sp) => s + (sp.amount || 0), 0);
  const recExtra = (t.recettesExtra || []).reduce((s, r) => s + (r.montant || 0), 0);
  const totalRecettes = recInscriptions + recSponsors + recExtra;
  const depenses = t.finances || [];
  const totalDepenses = depenses.reduce((s, d) => s + (d.montant || 0), 0);
  const solde = totalRecettes - totalDepenses;
  const nbSp = (t.sponsorProposals || []).filter(sp => sp.status === 'confirme').length;

  // Construction du workbook SheetJS
  const wb = XLSX.utils.book_new();

  // Données structurées en tableau de tableaux
  const data = [
    ['BILAN FINANCIER', t.name],
    [t.edition || '', ''],
    ['Organisateur', club?.name || ''],
    ['Date', fmtDate(t.date) + (t.dateEnd && t.dateEnd !== t.date ? ' - ' + fmtDate(t.dateEnd) : '')],
    ['Lieu', (t.venueName || t.location || '')],
    ['', ''],
    ['', ''],
    // En-têtes
    ['LIBELLÉ', 'DÉTAIL', 'MONTANT (€)'],
    // Recettes
    ['RECETTES', '', ''],
    ['Inscriptions équipes', equipes + ' équipe' + (equipes > 1 ? 's' : '') + ' x ' + (t.entryFee || 0) + ' EUR', recInscriptions],
  ];

  if (recSponsors > 0) {
    data.push(['Sponsors confirmés', nbSp + ' partenaire' + (nbSp > 1 ? 's' : ''), recSponsors]);
  }
  (t.recettesExtra || []).forEach(r => {
    data.push([r.label, r.detail || '', r.montant || 0]);
  });
  data.push(['TOTAL RECETTES', '', totalRecettes]);
  data.push(['', '', '']);

  // Dépenses
  data.push(['DÉPENSES', '', '']);
  if (depenses.length === 0) {
    data.push(['Aucune dépense saisie', '', 0]);
  } else {
    depenses.forEach(d => data.push([d.label, d.detail || d.note || '', d.montant || 0]));
  }
  data.push(['TOTAL DÉPENSES', '', totalDepenses]);
  data.push(['', '', '']);

  // Résultat
  data.push([solde >= 0 ? 'BÉNÉFICE' : 'DÉFICIT', 'Recettes - Dépenses', solde]);

  // Créer la feuille depuis le tableau
  const ws = XLSX.utils.aoa_to_sheet(data);

  // Largeurs des colonnes
  ws['!cols'] = [{ wch: 36 }, { wch: 30 }, { wch: 16 }];

  // Ajouter la feuille au workbook
  XLSX.utils.book_append_sheet(wb, ws, 'Bilan');

  // Téléchargement .xlsx (UTF-8 natif, accents corrects)
  const safeName = t.name.replace(/[^a-zA-Z0-9_àâäéèêëîïôùûüç-]/gi, '_');
  XLSX.writeFile(wb, 'Bilan_' + safeName + '_' + t.date + '.xlsx');
  toast('Export Excel téléchargé', 'success');
}

function addFinLine(tid, type) {
  const t = getTournament(tid);
  const labelId  = type === 'recette' ? 'fin-rec-label'   : 'fin-dep-label';
  const detailId = type === 'recette' ? 'fin-rec-detail'  : 'fin-dep-detail';
  const montantId= type === 'recette' ? 'fin-rec-montant' : 'fin-dep-montant';
  const label  = document.getElementById(labelId)?.value.trim();
  const detail = document.getElementById(detailId)?.value.trim() || '';
  const montant= parseFloat(document.getElementById(montantId)?.value) || 0;
  if (!label)    { toast('Saisissez un libellé', 'error'); return; }
  if (montant <= 0) { toast('Saisissez un montant supérieur à 0', 'error'); return; }
  if (type === 'recette') {
    if (!t.recettesExtra) t.recettesExtra = [];
    t.recettesExtra.push({ label, detail, montant });
  } else {
    if (!t.finances) t.finances = [];
    t.finances.push({ label, detail, montant });
  }
  saveState();
  activeTab = 'finances';
  renderTournamentDetail(tid);
}

function removeFinLine(tid, type, idx) {
  const t = getTournament(tid);
  if (type === 'recette') {
    if (t.recettesExtra) t.recettesExtra.splice(idx, 1);
  } else {
    if (t.finances) t.finances.splice(idx, 1);
  }
  saveState();
  activeTab = 'finances';
  renderTournamentDetail(tid);
}

function confirmEditMatch(tid, mid) {
  const t = getTournament(tid);
  const m = t.matches.find(x => x.id === mid);
  m.date = document.getElementById('e-date').value;
  m.time = document.getElementById('e-time').value;
  m.teamA = document.getElementById('e-tA').value.trim();
  m.teamB = document.getElementById('e-tB').value.trim();
  m.field = document.getElementById('e-field').value.trim();
  const sA = document.getElementById('e-sA').value;
  const sB = document.getElementById('e-sB').value;
  m.scoreA = sA !== '' ? parseInt(sA) : null;
  m.scoreB = sB !== '' ? parseInt(sB) : null;
  saveState(); closeModal(); toast('Mis à jour', 'success'); renderTournamentDetail(tid);
}
function deleteMatch(tid, mid) {
  if (!confirm('Supprimer ce match ?')) return;
  const t = getTournament(tid);
  t.matches = t.matches.filter(m => m.id !== mid);
  saveState(); toast('Match supprimé'); renderTournamentDetail(tid);
}
function generateBracketModal(tid) {
  const t = getTournament(tid);
  const conf = t.registrations.filter(r => r.status === 'approved');
  if (conf.length < 4) { toast('Au moins 4 équipes confirmées requises', 'error'); return; }
  modal('Générer le bracket',
    `<p>Cette action va créer automatiquement les matchs à partir des ${conf.length} équipes confirmées.</p>
     <p style="margin-top: 0.5rem;">Les matchs existants seront remplacés.</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
     <button class="btn btn-orange" onclick="confirmGenerate('${tid}')">Générer</button>`);
}
function confirmGenerate(tid) {
  const t = getTournament(tid);
  const conf = t.registrations.filter(r => r.status === 'approved');
  t.matches = [];
  const shuf = [...conf].sort(() => Math.random() - 0.5);
  let stage = shuf.length <= 4 ? 'demi' : 'quart';
  if (shuf.length === 2) stage = 'finale';
  let hr = 14, field = 1;
  for (let i = 0; i < shuf.length; i += 2) {
    if (shuf[i + 1]) {
      t.matches.push({
        id: uid(), stage, date: t.date,
        time: `${String(hr).padStart(2, '0')}:00`,
        field: `Terrain ${field}`,
        teamA: shuf[i].teamName, teamB: shuf[i + 1].teamName,
        scoreA: null, scoreB: null
      });
      field = field === 1 ? 2 : 1;
      if (field === 1) hr += 1;
    }
  }
  saveState(); closeModal(); toast(`Bracket généré : ${t.matches.length} matchs`, 'success');
  activeTab = 'calendar'; renderTournamentDetail(tid);
}

// ===== Autocomplétion ville via geo.api.gouv.fr (API officielle, gratuite) =====
const _cityCache = {};     // cache des résultats pour éviter les appels répétés
let   _cityDebounce = null; // timer debounce
let   _cityFocusIdx = -1;   // index de navigation clavier dans le dropdown

function cityAutocomplete(inputEl) {
  const val = inputEl.value.trim();
  const wrap = inputEl.closest('.city-wrap') || inputEl.parentNode;
  _closeCityDropdown(wrap);
  if (val.length < 2) return;

  // Debounce 250ms pour ne pas appeler l'API à chaque frappe
  clearTimeout(_cityDebounce);
  _cityDebounce = setTimeout(async () => {
    if (_cityCache[val]) {
      _renderCityDropdown(inputEl, wrap, _cityCache[val]);
      return;
    }
    try {
      const url = 'https://geo.api.gouv.fr/communes?nom=' +
        encodeURIComponent(val) +
        '&fields=nom,codesPostaux,departement&boost=population&limit=8';
      const res  = await fetch(url);
      const data = await res.json();
      _cityCache[val] = data;
      _renderCityDropdown(inputEl, wrap, data);
    } catch(e) {
      // Silencieux — l'API est optionnelle, la saisie libre reste possible
    }
  }, 250);
}

function _renderCityDropdown(inputEl, wrap, items) {
  _closeCityDropdown(wrap);
  if (!items || items.length === 0) return;
  _cityFocusIdx = -1;

  const dd = document.createElement('div');
  dd.className = 'city-dropdown';
  dd.setAttribute('role', 'listbox');

  items.forEach((item, i) => {
    const cp = item.codesPostaux ? item.codesPostaux[0] : '';
    const dept = item.departement ? item.departement.nom : '';
    const div = document.createElement('div');
    div.className = 'city-item';
    div.setAttribute('role', 'option');
    div.innerHTML =
      '<span>' + item.nom + (dept ? ' <span style="color:var(--ink-mute);font-size:12px;">(' + dept + ')</span>' : '') + '</span>' +
      (cp ? '<span class="city-cp">' + cp + '</span>' : '');
    div.addEventListener('mousedown', function(e) {
      e.preventDefault(); // empêche le blur du champ
      inputEl.value = item.nom;
      inputEl.dispatchEvent(new Event('input', { bubbles: true }));
      _closeCityDropdown(wrap);
    });
    dd.appendChild(div);
  });

  // Assurer que wrap est en position relative pour le dropdown absolu
  if (!wrap.classList.contains('city-wrap')) {
    wrap.style.position = 'relative';
  }
  wrap.appendChild(dd);
}

function _closeCityDropdown(wrap) {
  const existing = wrap ? wrap.querySelector('.city-dropdown') : null;
  if (existing) existing.remove();
}

function _cityKeyNav(e, inputEl) {
  const wrap = inputEl.closest('.city-wrap') || inputEl.parentNode;
  const dd = wrap.querySelector('.city-dropdown');
  if (!dd) return;
  const items = dd.querySelectorAll('.city-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _cityFocusIdx = Math.min(_cityFocusIdx + 1, items.length - 1);
    items.forEach((it, i) => it.classList.toggle('focused', i === _cityFocusIdx));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _cityFocusIdx = Math.max(_cityFocusIdx - 1, 0);
    items.forEach((it, i) => it.classList.toggle('focused', i === _cityFocusIdx));
  } else if (e.key === 'Enter' && _cityFocusIdx >= 0) {
    e.preventDefault();
    items[_cityFocusIdx].dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
  } else if (e.key === 'Escape') {
    _closeCityDropdown(wrap);
  }
}
