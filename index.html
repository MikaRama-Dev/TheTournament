// Convertit un tournoi local (camelCase) vers une ligne Supabase (snake_case)
function tournamentToRow(t, ownerEmail) {
  const row = {
    id: t.id,
    owner_email: ownerEmail || t.ownerEmail || '',
    club_id: t.clubId || null,
    name: t.name || '',
    edition: t.edition || '',
    date: t.date || null,
    date_end: t.dateEnd || null,
    time_start: t.timeStart || null,
    time_end: t.timeEnd || null,
    department: t.department || null,
    city: t.city || null,
    location: t.location || '',
    format: t.format || '',
    team_size: t.teamSize || null,
    max_teams: t.maxTeams || null,
    entry_fee: t.entryFee || 0,
    surface: t.surface || '',
    registration_deadline: t.registrationDeadline || null,
    description: t.description || '',
    status: t.status || 'open',
    // SÉCURITÉ (RSSI) : registrations et sponsor_proposals contiennent des données de contact (PII).
    // Ils ne doivent JAMAIS aller dans `tournaments`, qui est en lecture publique.
    // Voir syncRegistration() / syncSponsorProposal() pour leur écriture dédiée.
    sponsor_tiers: t.sponsorTiers || [],
    animations: t.animations || [],
    matches: t.matches || []
  };
  // organizer_name — dénormalisé sur le tournoi pour affichage public sans exposer owner_email
  // Conditionnel : n'est inclus que si la colonne existe en base (DBA Note-Dev-OrganizerName §Étape 1)
  if (t.organizerName !== undefined) {
    row.organizer_name = t.organizerName || '';
  }
  return row;
}

// Convertit une ligne Supabase vers un tournoi local
function rowToTournament(row) {
  const safeJsonArray = (value) => {
    if (Array.isArray(value)) return value;
    if (typeof value === 'string' && value.trim()) {
      try {
        const parsed = JSON.parse(value);
        return Array.isArray(parsed) ? parsed : [];
      } catch(e) {
        return [];
      }
    }
    return [];
  };

  const rawLocation = row.location || '';
  const separatorIndex = rawLocation.indexOf(' — ');
  const venueName = separatorIndex >= 0 ? rawLocation.slice(0, separatorIndex) : rawLocation;
  const venueAddress = separatorIndex >= 0 ? rawLocation.slice(separatorIndex + 3) : '';

  const numericTeamSize = Number(row.team_size || 0);
  const derivedMatchSize =
    row.match_size ||
    (numericTeamSize === 5  ? '5v5'  :
     numericTeamSize === 7  ? '7v7'  :
     numericTeamSize === 8  ? '8v8'  :
     numericTeamSize === 11 ? '11v11' : '');

  return {
    id: row.id,
    ownerEmail: row.owner_email || '',
    clubId: row.club_id,
    name: row.name || '',
    edition: row.edition || '',
    date: row.date || null,
    dateEnd: row.date_end || null,
    timeStart: row.time_start || null,
    timeEnd: row.time_end || null,
    location: rawLocation,
    venueName,
    venueAddress,
    department: row.department || '',
    city: row.city || '',
    format: row.format || '',
    categories: row.format ? [row.format] : [],
    teamSize: numericTeamSize || row.team_size || null,
    matchSize: derivedMatchSize,
    maxTeams: row.max_teams,
    entryFee: row.entry_fee,
    surface: row.surface || '',
    registrationDeadline: row.registration_deadline || '',
    description: row.description || '',
    status: row.status || 'open',
    sponsorTiers: safeJsonArray(row.sponsor_tiers),
    animations: safeJsonArray(row.animations),
    matches: safeJsonArray(row.matches),
    registrations: [],      // rempli ensuite par loadRegistrationsFromSupabase()
    sponsorProposals: [],   // rempli ensuite par loadSponsorProposalsFromSupabase()
    organizerName: row.organizer_name || '', // dénormalisé sur le tournoi (Note-Dev-OrganizerName §Étape 3)
    _remote: true
  };
}

// Enregistre un tournoi dans Supabase (Option B — note dev v3) :
//   Création  → INSERT direct (pas de SECURITY DEFINER nécessaire)
//   Modification → RPC update_tournament (SECURITY DEFINER, vérifie owner_email + recovery_code)
//   Suppression → RPC delete_tournament (via deleteTournamentRemote)
async function syncTournament(t, isNew) {
  if (!supabaseClient) return true; // Supabase non connecté — mode démo
  try {
    const a = getAccount();
    const ownerEmail = (a && a.email) ? a.email : (t.ownerEmail || '');
    const recoveryCode = a?.recoveryCode || '';
    const row = tournamentToRow(t, ownerEmail);
    t.ownerEmail = ownerEmail;

    if (isNew) {
      // CRÉATION — INSERT direct (nouveau tournoi, pas encore en base)
      const { error: errIns } = await supabaseClient.from('tournaments').insert([row]);
      if (errIns) {
        console.error('[Le Tournoi] syncTournament INSERT:', errIns);
        toast('Tournoi enregistré localement (sync base échouée)', 'error');
        return false;
      }
    } else {
      // MODIFICATION — RPC SECURITY DEFINER (vérifie propriété via owner_email + recovery_code)
      // Patch : tous les champs modifiables (pas id ni owner_email)
      const { id: _id, owner_email: _oe, ...patch } = row;
      const { error: errRpc } = await supabaseClient.rpc('update_tournament', {
        p_id:            t.id,
        p_owner_email:   ownerEmail,
        p_recovery_code: recoveryCode,
        p_patch:         patch
      });
      if (errRpc) {
        console.error('[Le Tournoi] update_tournament RPC:', errRpc);
        // Message générique — pas de détail technique exposé à l'UI
        toast('Modification enregistrée localement (vérification autorisation échouée)', 'error');
        return false;
      }
    }
    return true;
  } catch (e) {
    console.error('[Le Tournoi] syncTournament exception:', e);
    toast('Modification enregistrée sur cet appareil uniquement (erreur réseau)', 'error');
    return false;
  }
}

// Enregistre une candidature d'équipe (table dédiée, hors JSONB public) — RSSI
// ===========================================
// Rattachement des candidatures visiteur (sans compte) à un compte équipe
// ===========================================
// Appelé après la création (ou la connexion) d'un compte équipe. Deux étapes :
// 1. Rattachement local immédiat (même session) — toujours exécuté.
// 2. Rattachement + relecture distante via fonctions Postgres sécurisées
//    (SECURITY DEFINER) — couvre le cas multi-appareil. Non bloquant :
//    si le DBA n'a pas encore déployé ces fonctions, échoue silencieusement.
async function linkPastRegistrations(email, teamId) {
  if (!email || !teamId) return;
  const emailLc = email.trim().toLowerCase();
  let linkedCount = 0;

  // 1) Local — couvre "candidature puis création de compte dans la même session"
  state.tournaments.forEach(t => {
    let touched = false;
    t.registrations.forEach(r => {
      if (!r.teamId && r.captainEmail && r.captainEmail.toLowerCase() === emailLc) {
        r.teamId = teamId;
        linkedCount++;
        touched = true;
      }
    });
    if (touched) syncTournament(t, false); // propage le lien (pas de PII dans ce JSONB)
  });
  if (linkedCount > 0) saveState();

  // 2) Distant — rattache en base + tente de récupérer le reste pour affichage
  if (supabaseClient) {
    try {
      const { data, error } = await supabaseClient.rpc('link_registrations_by_email', {
        p_email: emailLc, p_team_id: teamId
      });
      if (!error && typeof data === 'number') linkedCount += data;
    } catch(e) { /* fonction pas encore déployée côté DBA — non bloquant */ }
    await mergeRegistrationsByEmail(emailLc, teamId);
  }

  if (linkedCount > 0) {
    toast(linkedCount + ' candidature' + (linkedCount > 1 ? 's' : '') + ' précédente' + (linkedCount > 1 ? 's' : '') + ' retrouvée' + (linkedCount > 1 ? 's' : '') + ' et liée' + (linkedCount > 1 ? 's' : '') + ' à votre compte !', 'success');
  }
}

// Relit les candidatures liées à un email (même non rattachées) et les fusionne
// dans state.tournaments[].registrations pour qu'elles apparaissent dans
// "Mes candidatures" — y compris depuis un appareil qui ne les a jamais vues.
// ─────────────────────────────────────────────────────────────────────────────
// get_my_participant_view — RPC RSSI validée (LeTournoi-RSSI-ParticipantView-Dev)
// Retourne en un seul appel les tournois + statuts d'inscription du participant.
// Remplace le tandem mergeRegistrationsByEmail + loadTournamentsFromSupabase
// pour les participants avec recoveryCode disponible.
// ─────────────────────────────────────────────────────────────────────────────
async function loadParticipantView(email, recoveryCode, accountType) {
  if (!supabaseClient || !email || !recoveryCode) return false;
  try {
    const { data, error } = await supabaseClient.rpc('get_my_participant_view', {
      p_email:         email,
      p_recovery_code: recoveryCode,
      p_account_type:  accountType || 'team'
    });

    if (error) {
      if (error.code === '28000') {
        console.warn('[Le Tournoi] get_my_participant_view unauthorized — fallback merge');
      } else {
        console.warn('[Le Tournoi] get_my_participant_view:', error.message);
      }
      return false; // fallback vers mergeRegistrationsByEmail
    }

    // Construire myApps directement depuis la RPC — pas de dépendance à state.tournaments
    // Les tournois de la vue sont injectés dans state s'ils n'y sont pas déjà
    const a = getAccount();
    if (!a) return false;
    a._participantView = (data || []).map(row => ({
      registrationId:     row.registration_id,
      registrationStatus: row.registration_status,
      registeredAt:       row.registered_at,
      tournamentId:       row.tournament_id,
      tournamentName:     row.tournament_name,
      tournamentDate:     row.tournament_date,
      tournamentCity:     row.tournament_city,
      tournamentLocation: row.tournament_location,
      tournamentStatus:   row.tournament_status,
    }));

    saveState();
    console.log('[Le Tournoi] get_my_participant_view : ' + (data || []).length + ' inscription(s) chargée(s)');
    return true;
  } catch(e) {
    console.warn('[Le Tournoi] get_my_participant_view exception:', e.message);
    return false;
  }
}

async function mergeRegistrationsByEmail(email, teamId) {
  if (!supabaseClient || !email) return;
  try {
    const { data, error } = await supabaseClient.rpc('get_my_registrations_by_email', { p_email: email });
    if (error || !data) return;
    let added = false;
    let pendingRows = []; // T-06 : tournois pas encore chargés au moment du merge

    data.forEach(row => {
      const t = state.tournaments.find(t => t.id === row.tournament_id);
      if (!t) { pendingRows.push(row); return; }
      const exists = t.registrations.some(r => r.id === row.id);
      if (!exists) {
        t.registrations.push({
          id: row.id, teamId: teamId, teamName: row.team_name, clubName: '',
          captainEmail: email, status: row.status, message: '', registeredAt: row.registered_at
        });
        added = true;
      }
    });

    if (added) { saveState(); render(); }

    // T-06 : si des registrations pointent vers des tournois non encore chargés,
    // relancer le merge une fois la synchronisation Supabase terminée
    if (pendingRows.length > 0) {
      const retryMerge = async () => {
        let tries = 0;
        // Attendre jusqu'à 10s que tous les tournois soient chargés
        while (!_tournamentsSyncDone && tries < 33) {
          await new Promise(res => setTimeout(res, 300));
          tries++;
        }
        let addedRetry = false;
        pendingRows.forEach(row => {
          const t = state.tournaments.find(t => t.id === row.tournament_id);
          if (!t) return;
          const exists = t.registrations.some(r => r.id === row.id);
          if (!exists) {
            t.registrations.push({
              id: row.id, teamId: teamId, teamName: row.team_name, clubName: '',
              captainEmail: email, status: row.status, message: '', registeredAt: row.registered_at
            });
            addedRetry = true;
          }
        });
        if (addedRetry) {
          saveState();
          // Re-render forcé — ce retry est le premier chargement complet, pas de guard ici
          if (typeof getRoute === 'function' && getRoute() === '/dashboard') render();
        }
      };
      retryMerge();
    }
  } catch(e) { /* non bloquant */ }
}

async function syncRegistration(tournamentId, registration) {
  if (!supabaseClient) return true;
  try {
    const row = {
      id: registration.id,
      tournament_id: tournamentId,
      team_id: registration.teamId || null,
      team_name: registration.teamName || '',
      club_name: registration.clubName || '',
      // Lot 2 (Brief BA Formulaires IDF) — inscription visiteur sans compte
      captain_name:  registration.captainName  || null,
      captain_email: registration.captainEmail || null,
      captain_phone: registration.captainPhone || null,
      department:    registration.department   || null,
      city:          registration.city         || null,
      // RSSI P1-5a : status non envoyé — imposé par DEFAULT 'pending' côté serveur.
      // Les changements de statut (approveTeam) restent locaux jusqu'à Supabase Auth.
      message: registration.message || '',
      registered_at: registration.registeredAt || new Date().toISOString()
    };
    // Pas de .select() : table INSERT-only pour anon (cf. recommandations DBA).
    const { error } = await supabaseClient.from('registrations').insert([row]);
    if (error) {
      console.error('[Le Tournoi] syncRegistration:', error);
      toast('Candidature enregistrée sur cet appareil uniquement (sync base échouée)', 'error');
      return false;
    }
    return true;
  } catch (e) {
    console.error('[Le Tournoi] syncRegistration exception:', e);
    toast('Candidature enregistrée sur cet appareil uniquement (sync base échouée)', 'error');
    return false;
  }
}

// Enregistre une proposition de sponsoring (table dédiée, hors JSONB public) — RSSI
async function syncSponsorProposal(tournamentId, proposal) {
  if (!supabaseClient) return true;
  try {
    const row = {
      id: proposal.id,
      tournament_id: tournamentId,

      name: proposal.name || '',
      tier: proposal.tier || '',
      tier_label: proposal.tierLabel || '',
      amount: proposal.amount || 0,
      // status non envoyé — DEFAULT 'pending' côté serveur (cohérence avec syncRegistration, RSSI)
      contact_name: proposal.contactName || '',
      contact: proposal.contact || '',
      notes: proposal.notes || '',
      message: proposal.message || ''
    };
    const { error } = await supabaseClient.from('sponsor_proposals').insert([row]);
    if (error) {
      console.error('[Le Tournoi] syncSponsorProposal:', error);

    toast('Proposition enregistrée sur cet appareil uniquement (sync base échouée)', 'error');
    return false;
  }
}

// Supprime un tournoi de Supabase
async function deleteTournamentRemote(id) {
  if (!supabaseClient) return;
  try {
    const a = getAccount();
    const ownerEmail  = (a && a.email)        ? a.email        : '';
    const recoveryCode = a?.recoveryCode || '';
    // SUPPRESSION — RPC SECURITY DEFINER (Option B, note dev v3)
    // Vérifie owner_email + recovery_code côté serveur avant de supprimer
    const { error } = await supabaseClient.rpc('delete_tournament', {
      p_id:            id,
      p_owner_email:   ownerEmail,
      p_recovery_code: recoveryCode
    });
    if (error) {
      console.error('[Le Tournoi] delete_tournament RPC:', error);
      if (error.code === '23000') {
        toast("Impossible d'annuler : des équipes ont déjà été approuvées pour ce tournoi.", 'warning');
      } else if (error.code === '28000') {
        toast("Vérification d'autorisation échouée — impossible d'annuler ce tournoi.", 'error');
      } else {
        toast("Erreur lors de l'annulation — réessayez ou contactez l'administrateur.", 'error');
      }
    }
  } catch (e) {
    console.error('[Le Tournoi] deleteTournamentRemote exception:', e);
    toast('Tournoi supprimé localement (erreur réseau)', 'error');
  }
}

// Indique si la synchronisation initiale des tournois distants est terminée
var _tournamentsSyncDone = false;

// Charge tous les tournois depuis Supabase au démarrage (mode réel)
async function loadTournamentsFromSupabase() {
  if (!supabaseClient) { _tournamentsSyncDone = true; return; }
  try {
    // SÉCURITÉ (RSSI/DBA) : owner_email n'est plus lisible publiquement (PII organisateur).
    // Cette liste doit rester synchronisée avec le GRANT SELECT côté Supabase.
    const { data, error } = await supabaseClient
      .from('tournaments')
      .select('id, club_id, name, edition, date, date_end, time_start, time_end, department, city, location, format, team_size, max_teams, entry_fee, surface, registration_deadline, description, status, sponsor_tiers, animations, matches, created_at')
      .order('date', { ascending: true });
    if (error) {
      _tournamentsSyncDone = true;
      console.error('[Le Tournoi] loadTournaments:', error);
      render();
      return;
    }
    if (data && data.length > 0) {
      const remote = data.map(rowToTournament);
      // Fusion : les tournois distants remplacent/complètent les tournois de démo
      const remoteIds = new Set(remote.map(t => t.id));
      const localOnly = state.tournaments.filter(t => !remoteIds.has(t.id) && !t._remote);
      state.tournaments = [...remote, ...localOnly];
      console.log('[Le Tournoi] ' + remote.length + ' tournoi(s) chargé(s) depuis Supabase');
    } else {
      console.log('[Le Tournoi] Aucun tournoi distant trouvé (table vide ou non accessible)');
    }
    _tournamentsSyncDone = true;
    render();
    initTicker(); // mise à jour ticker après chargement Supabase
  } catch (e) {
    _tournamentsSyncDone = true;
    console.error('[Le Tournoi] loadTournaments exception:', e);
  }
}

// Charge les candidatures depuis leur table dédiée (RSSI) — vide si INSERT-only pour anon
async function loadRegistrationsFromSupabase() {
  if (!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient
      .from('registrations')
      // RSSI P1-5b : liste explicite — sans captain_email, captain_phone (PII, non accordées à anon),
      // sans message (potentiellement sensible). Filtre côté requête sur status='approved' :
      // seules les équipes confirmées sont visibles publiquement.
      .select('tournament_id, team_name, club_name, status, registered_at, id, team_id')
      .eq('status', 'approved');
    if (error) { console.error('[Le Tournoi] loadRegistrations:', error); return; }
    (data || []).forEach(row => {
      const t = state.tournaments.find(t => t.id === row.tournament_id);
      if (t && !t.registrations.some(r => r.id === row.id)) {
        t.registrations.push({
          id: row.id, teamId: row.team_id, teamName: row.team_name, clubName: row.club_name,
          // captain_name/email/phone : non accordés à anon (décision RSSI Option B)
          status: row.status, registeredAt: row.registered_at
        });
      }
    });
    if (data && data.length) render();
  } catch (e) { console.error('[Le Tournoi] loadRegistrations exception:', e); }
}

// Charge les propositions de sponsoring depuis leur table dédiée (RSSI)
async function loadSponsorProposalsFromSupabase() {
  if (!supabaseClient) return;
  try {
    // RSSI A0-3 : select explicite — contact, contact_name (PII) exclus pour anon.
    // Si sponsor_proposals est INSERT-only pour anon → retourne [] silencieusement (comportement attendu).
    const { data, error } = await supabaseClient
      .from('sponsor_proposals')
      .select('id, tournament_id, name, tier, tier_label, amount, status');
    if (error) { console.error('[Le Tournoi] loadSponsorProposals:', error); return; }
    (data || []).forEach(row => {
      const t = state.tournaments.find(t => t.id === row.tournament_id);
      if (t && !t.sponsorProposals.some(s => s.id === row.id)) {
        t.sponsorProposals.push({
          id: row.id, name: row.name, tier: row.tier,
          tierLabel: row.tier_label, amount: row.amount, status: row.status,
          // contactName/contact/notes/message : PII non accordée à anon — undefined attendu
        });
      }
    });
    if (data && data.length) render();
  } catch (e) { console.error('[Le Tournoi] loadSponsorProposals exception:', e); }
}

// Initialise les données distantes uniquement APRÈS la création du client Supabase.
// Avant correction, les appels en bas du fichier partaient trop tôt avec supabaseClient === null.
var _remoteDataInitStarted = false;
async function initRemoteData() {
  if (_remoteDataInitStarted || !supabaseClient) return;
  _remoteDataInitStarted = true;
  _tournamentsSyncDone = false;

  // Si l'utilisateur est déjà sur la page des tournois, afficher l'état de synchronisation.
  if (typeof getRoute === 'function' && getRoute() === '/tournaments') {
    render();
  }

  await loadTournamentsFromSupabase();
  await loadRegistrationsFromSupabase();
  await loadSponsorProposalsFromSupabase();

  // Charger les tournois de l'organisateur connecté (owner_email non exposé en SELECT public)
  const a = getAccount();
  if (a && a.type === 'club' && a.email && a.recoveryCode) {
    await loadMyTournaments(a.email, a.recoveryCode);
  }
  // Charger la vue participant si compte connecté avec recoveryCode (RPC RSSI validée)
  // Fallback vers mergeRegistrationsByEmail si pas de recoveryCode (visiteur, cross-device sans code)
  if (a && (a.type === 'team' || a.type === 'sponsor') && a.email) {
    let ok = false;
    if (a.recoveryCode) {
      ok = await loadParticipantView(a.email, a.recoveryCode, a.type);
    }
    if (!ok) await mergeRegistrationsByEmail(a.email, a.id);
    if (_isSafeToPollingRender()) render();
    startRegistrationsPolling();
  }
}

// ────────────────────────────────────────────────────────────
// RPC get_my_tournaments — enrichit state.tournaments avec ownerEmail
// pour l'organisateur connecté, sans exposer owner_email au catalogue public
// ────────────────────────────────────────────────────────────
async function loadMyTournaments(ownerEmail, recoveryCode) {
  if (!supabaseClient || !ownerEmail || !recoveryCode) return;
  try {
    const { data, error } = await supabaseClient.rpc('get_my_tournaments', {
      p_owner_email:   ownerEmail,
      p_recovery_code: recoveryCode
    });
    if (error) { console.warn('[Le Tournoi] get_my_tournaments:', error.message); return; }

    const existingIds = new Set(state.tournaments.map(t => t.id));
    (data || []).forEach(row => {
      const t = rowToTournament(row);
      t.ownerEmail = ownerEmail;
      if (!existingIds.has(t.id)) {
        state.tournaments.push(t);
        existingIds.add(t.id);
      } else {
        const existing = state.tournaments.find(x => x.id === t.id);
        if (existing) existing.ownerEmail = ownerEmail;
      }
    });

    console.log('[Le Tournoi] get_my_tournaments : ' + (data || []).length + ' tournoi(s) organisateur chargé(s)');

    // Étape 5 B2 : charger les inscriptions de chaque tournoi organisateur
    const myTournamentIds = (data || []).map(row => row.id);
    if (myTournamentIds.length > 0) {
      await loadMyRegistrations(myTournamentIds, ownerEmail, recoveryCode);
    }

    // Re-render après chargement complet (tournois + registrations)
    if (typeof getRoute === 'function' && getRoute() === '/dashboard') render();

  } catch(e) {
    console.warn('[Le Tournoi] get_my_tournaments exception:', e.message);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Étape 5 B2 — Chargement des inscriptions des tournois organisateur
// RPC get_my_registrations (text, text, text) — captain_email/phone dans scope RSSI strict
// ─────────────────────────────────────────────────────────────────────────────
async function loadMyRegistrations(tournamentIds, ownerEmail, recoveryCode) {
  if (!supabaseClient || !ownerEmail || !recoveryCode) return;
  let loaded = 0;
  for (const tid of tournamentIds) {
    try {
      const { data, error } = await supabaseClient.rpc('get_my_registrations', {
        p_tournament_id: tid,       // text (pas uuid — cf. note DBA)
        p_owner_email:   ownerEmail,
        p_recovery_code: recoveryCode
      });
      if (error) {
        if (error.code === '28000') {
          console.warn('[Le Tournoi] get_my_registrations unauthorized sur ' + tid);
        } else {
          console.warn('[Le Tournoi] get_my_registrations (' + tid + '):', error.message);
        }
        continue;
      }
      const t = state.tournaments.find(x => x.id === tid);
      if (!t) continue;
      // Fusionner sans écraser les modifications locales non encore persistées
      const existingIds = new Set(t.registrations.map(r => r.id));
      (data || []).forEach(row => {
        const reg = {
          id:           row.id,
          teamId:       row.team_id   || null,
          teamName:     row.team_name || '',
          clubName:     row.club_name || '',
          captainName:  row.captain_name  || '',
          captainEmail: row.captain_email || '', // PII — scope RSSI strict (tournois de l'organisateur uniquement)
          captainPhone: row.captain_phone || '',
          department:   row.department    || '',
          city:         row.city          || '',
          status:       row.status        || 'pending',
          message:      row.message       || '',
          registeredAt: row.registered_at || ''
        };
        if (!existingIds.has(reg.id)) {
          t.registrations.push(reg);
          existingIds.add(reg.id);
        } else {
          // Mettre à jour le statut depuis la base (source de vérité)
          const existing = t.registrations.find(r => r.id === reg.id);
          if (existing) Object.assign(existing, reg);
        }
      });
      loaded++;
    } catch(e) {
      console.warn('[Le Tournoi] get_my_registrations exception (' + tid + '):', e.message);
    }
  }
  console.log('[Le Tournoi] get_my_registrations : ' + loaded + '/' + tournamentIds.length + ' tournoi(s) chargé(s)');
  saveState();
}

const KEY = 'tournoo_v2';
let state = loadState();
let activeTab = 'overview';
let signupType = 'club';
let loginType = 'club';

function loadState() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const loaded = JSON.parse(s);
      // Migration v1.A — injecte les nouveaux catalogues si absents du localStorage existant
      if (!loaded.catalog) loaded.catalog = {};
      const fresh = seed();
      if (!loaded.catalog.matchSizes)        loaded.catalog.matchSizes        = fresh.catalog.matchSizes;
      if (!loaded.catalog.genders)           loaded.catalog.genders           = fresh.catalog.genders;
      if (!loaded.catalog.surfaces)          loaded.catalog.surfaces          = fresh.catalog.surfaces;
      if (!loaded.catalog.competitionFormats)loaded.catalog.competitionFormats= fresh.catalog.competitionFormats;
      // Always refresh formats catalog to get latest labels and new categories
      loaded.catalog.formats = fresh.catalog.formats;
      if (!loaded.catalog.positions)         loaded.catalog.positions         = fresh.catalog.positions;
      if (!loaded.catalog.days)              loaded.catalog.days              = fresh.catalog.days;
      // Migration — add contact privacy fields to existing accounts
      ['clubs','teams','sponsors'].forEach(coll => {
        if (!loaded[coll]) return;
        loaded[coll].forEach(acc => {
          if (acc.shareEmail === undefined) acc.shareEmail = true;
          if (acc.sharePhone === undefined) acc.sharePhone = true;
          if (!acc.website) acc.website = '';
          // Encode existing plain-text contacts if not yet encoded
          if (acc.email && !acc._contactsEncoded) {
            acc.emailEncoded = encodeContact(acc.email);
            acc.phoneEncoded = encodeContact(acc.phone || '');
            acc._contactsEncoded = true;
          }
        });
      });
      // Migration v1.B — add new animation IDs if missing from existing catalog
      if (loaded.catalog.animations) {
        const existingIds = new Set(loaded.catalog.animations.map(a => a.id));
        fresh.catalog.animations.forEach(fa => {
          if (!existingIds.has(fa.id)) loaded.catalog.animations.push(fa);
        });
      } else {
        loaded.catalog.animations = fresh.catalog.animations;
      }
      return loaded;
    }
  } catch(e) {}
  return seed();
}
function saveState() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function resetState() {
  if (confirm('Réinitialiser toutes les données ?')) {
    localStorage.removeItem(KEY); state = seed(); saveState();
    navigate('#/'); toast('Données réinitialisées', 'success');
  }
}

function uid() { return 'id-' + Math.random().toString(36).slice(2, 10); }
function getAccount() {

  return state[c].find(a => a.id === state.currentId);
}
function getTournament(id) { return state.tournaments.find(t => t.id === id); }
function getAnim(id) { return state.catalog.animations.find(a => a.id === id); }
function getClub(id, tournament) {
  const found = state.clubs.find(c => c.id === id);
  if (found) return found;

  // Les tournois venant de Supabase peuvent référencer un club_id qui
  // n'existe pas dans le localStorage du navigateur courant.
  // Sans ce fallback, la fiche tournoi plantait sur club.name / club.city :
  // les tournois "en dur" étaient cliquables, ceux de la BDD non.
  // organizerName : dénormalisé sur le tournoi (Note-Dev-OrganizerName) — priorité sur "Organisateur"
  const displayName = tournament?.organizerName || 'Organisateur';
  return {
    id: id || 'remote-club',
    type: 'club',
    name: displayName,
    city: tournament?.city || '',
    president: '',
    phone: '',
    website: '',
    mark: makeMark(displayName),

  };
}
function clubLine(club) {
  return [club?.name, club?.city].filter(Boolean).join(' · ') || 'Organisateur';
}
function getTeam(id) { return state.teams.find(t => t.id === id); }
function getSponsor(id) { return state.sponsors.find(s => s.id === id); }
function esc(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// RSSI : valide une URL externe — bloque javascript:, data:, vbscript:
function safeUrl(u) {
  if (!u) return '';
  const s = String(u).trim();
  if (/^https?:\/\//i.test(s)) return esc(s);          // http(s) explicite : OK
  if (/^(javascript|data|vbscript|file):/i.test(s)) return ''; // schémas dangereux : rejeté
  if (/^[\w.-]+\.[a-z]{2,}/i.test(s)) return esc('https://' + s); // domaine sans schéma : préfixe https
  return '';
}
function fmtDate(iso) {
  const d = new Date(iso);
  const m = ['jan','fév','mar','avr','mai','juin','juil','août','sept','oct','nov','déc'];
  return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDay(iso) {
  const d = new Date(iso);
  return ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][d.getDay()];
}
function fmtMoney(n) { return n === 0 ? 'Gratuit' : `${n} €`; }
function formatLabel(v) { const f = state.catalog.formats.find(x => x.v === v); return f ? f.l : v; }
function posLabel(v) { const p = state.catalog.positions.find(x => x.v === v); return p ? p.l : v; }
function matchSizeLabel(v) { const m = state.catalog.matchSizes?.find(x => x.v === v); return m ? m.l : v; }
function genderLabel(v) { const g = state.catalog.genders?.find(x => x.v === v); return g ? g.l : v; }
function surfaceLabel(v) { const s = state.catalog.surfaces?.find(x => x.v === v); return s ? s.l : v; }
function compFormatLabel(v) { const c = state.catalog.competitionFormats?.find(x => x.v === v); return c ? c.l : v; }
// Backward-compat helpers — old tournaments only have 'location' & 'format' (single)
function tournVenue(t) {
  if (t.venueName && t.venueAddress) return { name: t.venueName, address: t.venueAddress };
  if (t.venueName) return { name: t.venueName, address: '' };
  if (t.location) return { name: t.location, address: '' };
  return { name: '', address: '' };
}
function tournCategories(t) {
  if (Array.isArray(t.categories) && t.categories.length) return t.categories;
  if (t.format) return [t.format];
  return [];
}
function tournCategoriesLabel(t) {
  const cats = tournCategories(t);
  if (!cats.length) return '—';
  return cats.map(c => formatLabel(c)).join(' · ');
}
function tournDateRange(t) {
  if (t.dateEnd && t.dateEnd !== t.date) return `${fmtDate(t.date)} → ${fmtDate(t.dateEnd)}`;
  return fmtDate(t.date);
}
function tournTimeRange(t) {
  if (!t.timeStart) return '';
  if (t.timeEnd) return t.timeStart + ' → ' + t.timeEnd;
  return 'à partir de ' + t.timeStart;
}

// URL publique de partage.
// Important : on évite les liens en #/tournaments/... dans les messages sociaux,
// car certains réseaux/applications coupent ou ignorent la partie après #.
// On partage donc ?tournoi=ID, puis l'app redirige automatiquement vers le hash-route.
// Domaine public canonique à utiliser pour les liens partagés.
// Important : quand le fichier est ouvert depuis l'aperçu ChatGPT / sandbox,
// window.location.origin vaut web-sandbox.oaiusercontent.com. On force donc
// l'URL publique GitHub Pages du site.
const PUBLIC_SITE_BASE_URL = 'https://mikarama-dev.github.io/TheTournament/';

function getPublicSiteBaseUrl() {
  const canonical = PUBLIC_SITE_BASE_URL.replace(/\/?$/, '/');

  // En local, en file:// ou dans la sandbox ChatGPT, on ne doit jamais partager
  // l'origine courante, car elle produit des liens faux/non publics.
  const host = window.location.hostname || '';
  if (
    window.location.protocol === 'file:' ||
    host === 'localhost' ||
    host === '127.0.0.1' ||
    host.includes('oaiusercontent.com') ||
    host.includes('web-sandbox')
  ) {
    return canonical;
  }

  // Sur GitHub Pages / production, on peut reconstruire l'URL depuis l'emplacement courant.
  const path = window.location.pathname.replace(/\/index\.html$/, '/');
  return (window.location.origin + path).replace(/\/?$/, '/');
}

function getTournamentShareUrl(tid) {
  return getPublicSiteBaseUrl() + '?tournoi=' + encodeURIComponent(tid);
}

// Convertit https://site/app/?tournoi=ID en https://site/app/#/tournaments/ID
// avant le rendu de la SPA.
function normalizeSharedTournamentUrl() {
  try {
    const url = new URL(window.location.href);
    const tid = url.searchParams.get('tournoi') || url.searchParams.get('tournament') || url.searchParams.get('t');
    if (!tid) return false;

    const cleanPath = url.pathname.replace(/\/index\.html$/, '/');
    const target = url.origin + cleanPath + '#/tournaments/' + encodeURIComponent(tid);

    // Plus fiable que history.replaceState ici : on force le navigateur à recharger
    // l'application avec le hash-route déjà présent. Ainsi la SPA ne rend jamais
    // la page d'accueil par défaut.
    if (window.location.href !== target) {
      window.location.replace(target);
      return true;
    }

    return false;
  } catch(e) {
    return false;
  }
}

// AUTH
// Mots simples pour code de récupération mémorisable
const RECOVERY_WORDS = [
  'soleil','ballon','terrain','coupe','victoire','arbitre','gardien','penalty',
  'tribune','vestiaire','corner','carton','sifflet','maillot','filet','tifo',
  'stade','finale','podium','buteur','capitaine','remise','equipe','match',
  'saison','ligue','district','regionale','amateur','passion'
];
function genActivationCode() {
  // Code d'activation 6 chiffres — visible dans Supabase Table Editor par l'admin
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return String(arr[0] % 900000 + 100000); // 100000–999999
}

function genRecoveryCode() {
  // RSSI : génération cryptographiquement sûre (au lieu de Math.random)
  const pick = () => {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return RECOVERY_WORDS[arr[0] % RECOVERY_WORDS.length];
  };
  return pick() + '-' + pick() + '-' + pick() + '-' + pick();
}

function signupAccount(type, d) {
  const coll = type === 'club' ? 'clubs' : type === 'team' ? 'teams' : 'sponsors';
  if (state[coll].find(a => a.email === d.email)) return { error: 'Email déjà utilisé.' };
  const recoveryCode = genRecoveryCode();
  const account = { id: uid(), type, ...d, recoveryCode };
  state[coll].push(account);
  state.currentType = type; state.currentId = account.id;
  saveState(); return { account, recoveryCode };
}
function loginAccount(type, email, pwd) {
  const coll = type === 'club' ? 'clubs' : type === 'team' ? 'teams' : 'sponsors';
  const account = state[coll].find(a => a.email === email && a.password === pwd);
  if (!account) return { error: 'Email ou mot de passe incorrect.', trySupabase: true };
  state.currentType = type; state.currentId = account.id;
  saveState();
  // Si compte en attente d'activation → rediriger vers l'écran dédié
  if (account.status === 'pending') return { account, pending: true };
  return { account };
}

// Fallback Supabase : si le compte n'est pas dans le localStorage (cache vidé, autre appareil)
async function loginAccountFromSupabase(type, email, pwd, recoveryCodeInput = '') {
  // RSSI audit (note dev v2, P0-2) :
  // Cette fonction fait un SELECT sur clubs/teams/sponsors — tables qui disposent
  // d'un GRANT SELECT restreint aux colonnes de credentials uniquement
  // (email, status, activation_code, password) — recovery_code exclu (haché bcrypt, non lisible).
  // Ces tables NE SONT PAS INSERT-only : elles ont une policy SELECT dédiée
  // ajoutée pour le fallback cross-device. Aucun SELECT n'est effectué sur
  // les tables réellement INSERT-only (registrations, consents).
  // Conformité RSSI : OK pour la phase de validation MVP (Auth déférée à J2).
  if (!supabaseClient) return { error: 'Supabase non connecté.' };
  try {
    const table = type === 'club' ? 'clubs' : type === 'team' ? 'teams' : 'sponsors';
    // SELECT enrichi selon le type pour peupler le rebuilt avec les données réelles (name, category, etc.)
    const extraCols = type === 'team'
      ? ', name, category, club, manager, phone, bio, city, department, level'
      : type === 'club'
      ? ', name, president, phone, city, department, website'
      : ', name, sector, contact, city, department';
    const { data, error } = await supabaseClient
      .from(table)
      .select('id, email, status, activation_code, password' + extraCols)
      .eq('email', email)
      .single();
    if (error) {
      // 406 = aucune ligne trouvée (.single() sur 0 résultat) — pas une erreur réseau
      if (error.code === 'PGRST116' || error.status === 406) {
        return { error: 'Identifiants incorrects.' };
      }
      return { error: 'Erreur de connexion. Réessayez.' };
    }
    if (!data) return { error: 'Identifiants incorrects.' };

    // Fix login (Note-Dev-Login-Equipe-Recover) :
    // Le mot de passe est hashé bcrypt en base depuis la correction du payload d'inscription.
    // La comparaison === échoue toujours sur un hash. On utilise bcrypt.compare().
    // Fallback === conservé pour les comptes démo (password = 'demo', non hashé en base).
    let passwordOk = false;
    try {
      if (window.bcrypt && data.password && data.password.startsWith('$2')) {
        // Mot de passe hashé bcrypt en base
        passwordOk = await bcrypt.compare(pwd, data.password);
      } else {
        // Compte démo ou mot de passe en clair (migration progressive)
        passwordOk = data.password === pwd;
      }
    } catch(e) {
      console.error('[Le Tournoi] bcrypt.compare error:', e);
      passwordOk = data.password === pwd; // fallback sûr
    }
    if (!passwordOk) return { error: 'Identifiants incorrects.' };
    // Reconstruire le compte local depuis les données Supabase (données minimales)
    const coll = type === 'club' ? 'clubs' : type === 'team' ? 'teams' : 'sponsors';
    const existing = state[coll].find(a => a.email === email);
    if (!existing) {
      const rebuilt = {
        id: data.id || uid(),
        type,
        // Utiliser le vrai nom depuis Supabase si disponible (évite email comme fallback)
        name:     data.name     || data.email,
        email:    data.email,
        city:     data.city     || '',
        phone:    data.phone    || '',
        password: pwd,
        status:   data.status   || 'pending',
        activationCode: data.activation_code,
        recoveryCode:   recoveryCodeInput || '',
        mark:     makeMark(data.name || data.email),
        logoClass: '',
        // Champs spécifiques team
        category:   type === 'team' ? (data.category || '') : undefined,
        club:       type === 'team' ? (data.club     || '') : undefined,
        manager:    type === 'team' ? (data.manager  || '') : undefined,
        bio:        type === 'team' ? (data.bio      || '') : undefined,
        level:      type === 'team' ? (data.level    || '') : undefined,
        // Champs spécifiques club
        president:  type === 'club' ? (data.president || '') : undefined,
        department: data.department || '',
        website:    type === 'club' ? (data.website  || '') : (type === 'sponsor' ? (data.website || '') : undefined),
        // Champs spécifiques sponsor
        sector:     type === 'sponsor' ? (data.sector  || '') : undefined,
        contact:    type === 'sponsor' ? (data.contact || '') : undefined,
        // Tableaux requis par les dashboards
        registrations:    [],
        sponsorProposals: [],
        tournaments:      [],
        players:      type === 'team'    ? [] : undefined,
        availability: type === 'team'    ? [] : undefined,
        members:      type === 'club'    ? [] : undefined,
        proposals:    type === 'sponsor' ? [] : undefined,
      };
      state[coll].push(rebuilt);
      state.currentType = type;
      state.currentId = rebuilt.id;
      saveState();
      if (rebuilt.status === 'pending') return { account: rebuilt, pending: true };
      return { account: rebuilt };
    }
    // Synchroniser l'ID Supabase sur le compte existant (local peut avoir id-xxx, Supabase retourne 13)
    // C'est la correction clé : sans ça, myApps filtre sur id-xxx mais les registrations ont teamId=null
    if (data.id && existing.id !== data.id) {
      existing.id = data.id;
    }
    // Enrichir les données depuis Supabase si manquantes (name, category, etc.)
    if (!existing.name || existing.name === existing.email) existing.name = data.name || existing.email;
    if (data.category && !existing.category) existing.category = data.category;
    if (data.club     && !existing.club)     existing.club     = data.club;
    if (data.manager  && !existing.manager)  existing.manager  = data.manager;
    if (data.president && !existing.president) existing.president = data.president;
    if (data.city     && !existing.city)     existing.city     = data.city;
    if (data.department && !existing.department) existing.department = data.department;

    state.currentType = type;
    state.currentId = existing.id;

    if (type === 'club' && recoveryCodeInput) {
      existing.recoveryCode = recoveryCodeInput;
    }
    if (type === 'team' && recoveryCodeInput) {
      existing.recoveryCode = recoveryCodeInput;
    }

    saveState();

    if (existing.status === 'pending') return { account: existing, pending: true };
    return { account: existing };
  } catch(e) {
    return { error: 'Erreur réseau : ' + e.message };
  }
}

// POLLING registrations équipe (Option A — J0)
// Toutes les 30s, si un compte équipe est connecté en mode réel,
// rafraîchir les inscriptions depuis Supabase et re-render le dashboard.
// Remplacé à J2 par Supabase Realtime (Option B).
// ─────────────────────────────────────────────────────────────────────────────
var _registrationsPolling = null;

function _isSafeToPollingRender() {
  // Ne pas interrompre si une modal est ouverte
  const modal = document.getElementById('modal-container');
  if (modal && modal.innerHTML.trim()) return false;
  // Ne pas interrompre si un champ de saisie a le focus (formulaire en cours)
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) return false;
  // Ne pas interrompre si on n'est pas sur le dashboard
  if (typeof getRoute === 'function' && getRoute() !== '/dashboard') return false;
  return true;
}

function startRegistrationsPolling() {
  if (_registrationsPolling) return; // déjà actif
  _registrationsPolling = setInterval(async () => {
    const a = getAccount();
    if (!a || !a.email || !supabaseClient || signupMode !== 'real') return;
    if (a.type !== 'team' && a.type !== 'sponsor') return;
    let ok = false;
    if (a.recoveryCode) {
      ok = await loadParticipantView(a.email, a.recoveryCode, a.type);
    }
    if (!ok) await mergeRegistrationsByEmail(a.email, a.id);
    if (_isSafeToPollingRender()) render();
  }, 30000); // 30 secondes
}

function stopRegistrationsPolling() {
  if (_registrationsPolling) {
    clearInterval(_registrationsPolling);
    _registrationsPolling = null;
  }
}

function logout() {
  stopRegistrationsPolling();
  state.currentType = null; state.currentId = null; saveState(); navigate('#/'); toast('Déconnecté');
}

function render() {
  renderNav(); renderFooter();

  if (signupMode === 'demo') showDemoBanner();
  // Ticker : mise à jour dynamique à chaque rendu (mode réel et démo)
  initTicker();
  const r = getRoute();

  // PostHog §3.4 : $pageview natif — déclenché manuellement à chaque changement de section SPA
  // (capture_pageview: false dans le snippet évite le double-fire au chargement initial)
  // L'event natif $pageview active les funnels, paths et KPI d'activation PostHog sans config supplémentaire
  const sectionMap = {
    '/': 'accueil', '/tournaments': 'catalogue', '/signup': 'inscription',
    '/login': 'connexion', '/dashboard': 'dashboard', '/profile': 'profil',
    '/join': 'rejoindre', '/legal': 'mentions_legales', '/privacy': 'confidentialite',
    '/recover': 'recuperation', '/pending': 'activation_en_attente',
    '/teams': 'equipes', '/sponsors': 'sponsors',
    '/tournaments/new': 'creation_tournoi',
  };
  const sectionName = sectionMap[r]
    || (r.startsWith('/tournaments/') && r.endsWith('/edit') ? 'edition_tournoi'
    : r.startsWith('/tournaments/') ? 'fiche_tournoi'
    : r.startsWith('/teams/') ? 'profil_equipe'
    : r.startsWith('/sponsors/') ? 'profil_sponsor'
    : 'autre');
  try {
    if (window.posthog && typeof posthog.capture === 'function') {
      posthog.capture('$pageview', { section_name: sectionName, mode: getCurrentMode() });
    }
  } catch(e) { /* silencieux */ }

  if (r === '/') return renderHome();
  if (r === '/admin') return renderAdmin();
  if (r === '/signup') return renderSignup();
  if (r === '/login') return renderLogin();
  if (r === '/dashboard') return requireAuth(renderDashboard);
  if (r === '/profile') return requireAuth(renderProfileEdit);
  if (r === '/tournaments') return renderTournaments();
  if (r === '/recover') return renderRecover();
  if (r === '/pending') return renderPendingActivation();
  if (r === '/join') return renderJoinRequest();
  if (r === '/legal') return renderLegal();
  if (r === '/privacy') return renderPrivacy();
  if (r === '/tournaments/new') return requireAuth(renderCreateTournament, ['club']);
  if (r.match(/^\/tournaments\/[^\/]+\/edit$/)) return requireAuth(() => renderEditTournament(routeId(r.split('/')[2])), ['club']);
  if (r.startsWith('/tournaments/')) return renderTournamentDetail(routeId(r.split('/')[2]));
  if (r === '/teams') return renderTeamsList();
  if (r.startsWith('/teams/')) return renderTeamProfile(r.split('/')[2]);
  if (r === '/sponsors') return renderSponsorsList();
  if (r.startsWith('/sponsors/')) return renderSponsorProfile(r.split('/')[2]);
  document.getElementById('app').innerHTML = `<div class="page-head"><h1 class="page-title">404 : <em>introuvable</em></h1><div class="page-head-actions"><a href="#/" class="btn btn-primary">Retour</a></div></div>`;
}
function requireAuth(cb, allowed) {
  const a = getAccount();
  if (!a) { toast('Connecte-toi d\'abord', 'error'); navigate('#/login'); return; }
  if (allowed && !allowed.includes(a.type)) {
    toast('Action réservée à un autre type de compte', 'error');
    navigate('#/dashboard'); return;
  }
  cb();
}

async function submitJoinRequest() {
  const errEl = document.getElementById('jr-err');
  errEl.classList.remove('show');

  // Honeypot
  const hp = document.getElementById('jr-hp');
  if (hp && hp.value.trim() !== '') { console.log('[Le Tournoi] honeypot triggered (join request)'); return; }

  // Lecture des champs
  const clubName    = (document.getElementById('jr-club').value    || '').trim();
  const contactName = (document.getElementById('jr-contact').value || '').trim();
  const email       = (document.getElementById('jr-email').value   || '').trim().toLowerCase();
  const phone       = (document.getElementById('jr-phone').value   || '').trim() || null;
  const department  = document.getElementById('jr-dept').value;
  const city        = (document.getElementById('jr-city').value    || '').trim() || null;
  const message     = (document.getElementById('jr-message').value || '').trim() || null;
  const consent     = document.getElementById('jr-consent');

  // Validation
  if (!clubName)    { errEl.textContent = 'Le nom du club est obligatoire.';    errEl.classList.add('show'); return; }
  if (!contactName) { errEl.textContent = 'Le nom du contact est obligatoire.'; errEl.classList.add('show'); return; }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = 'Email invalide.'; errEl.classList.add('show'); return; }
  if (!department)  { errEl.textContent = 'Sélectionne un département.';        errEl.classList.add('show'); return; }
  if (!consent || !consent.checked) { errEl.textContent = 'Le consentement RGPD est obligatoire.'; errEl.classList.add('show'); return; }

  const btn = document.querySelector('#app .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Envoi…'; }

  if (supabaseClient) {
    // Mode réel — INSERT en base, sans .select() (table INSERT-only pour anon)
    const { error } = await supabaseClient
      .from('club_registration_requests')
      .insert([{
        club_name:    clubName,
        contact_name: contactName,
        email:        email,
        phone:        phone,
        department:   department,
        city:         city,
        message:      message
        // status et created_at : valeurs par défaut serveur ('pending' / now())
      }]);
    if (error) {
      console.error('[Le Tournoi] club_registration_requests INSERT:', error);
      // PostHog §4.3 : club_request_error
      ph('club_request_error', { error_type: error.code || 'unknown' });
      errEl.textContent = 'Erreur lors de l\'envoi. Réessayez ou contactez contact@letournoi.foot.';
      errEl.classList.add('show');
      if (btn) { btn.disabled = false; btn.textContent = 'Envoyer ma demande →'; }
      return;
    }
    // Consentement RGPD (non bloquant)
    try {
      await supabaseClient.from('consents').insert([{
        email, account_type: 'club_request',
        consent_data_collection: true, consent_marketing: false
      }]);
    } catch(e) { /* non bloquant */ }
  } else {
    // Mode démo — localStorage uniquement
    if (!state.joinRequests) state.joinRequests = [];
    state.joinRequests.push({ clubName, contactName, email, phone, department, city, message, status: 'pending', createdAt: new Date().toISOString() });
    saveState();
  }

  // PostHog §4.3 : club_request_submitted — pas de PII
  ph('club_request_submitted', { departement: department || null, mode: getCurrentMode() });

  // Confirmation UI — pas de redirection automatique
  document.getElementById('app').innerHTML = `
    <div class="auth-page" style="max-width:520px;">
      <div class="auth-card" style="text-align:center;">
        <div style="font-size:2.5rem;color:var(--accent);margin-bottom:0.75rem;">✓</div>
        <h1 class="auth-title" style="margin-bottom:0.75rem;">Demande reçue !</h1>
        <p class="detail-text">Votre demande d'activation pour <strong>${esc(clubName)}</strong> a bien été reçue.</p>
        <p class="detail-text" style="margin-top:0.5rem;">Vous serez contacté(e) à l'adresse <strong>${esc(email)}</strong> sous 48h.</p>
        <div style="margin-top:1.5rem;display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;">
          <a href="#/" class="btn btn-primary">Retour à l'accueil</a>
          <a href="#/tournaments" class="btn btn-outline">Voir les tournois</a>
        </div>
      </div>
    </div>`;
  window.scrollTo(0, 0);
}

// Champs obligatoires pour l'indicateur de complétude (§4 spec)
const ADMIN_REQUIRED_FIELDS = ['name','department','city','date','format','max_teams','entry_fee','surface'];
function isTournamentComplete(t) {
  return ADMIN_REQUIRED_FIELDS.every(f => t[f] != null && String(t[f]).trim() !== '');

// ═══ POSTHOG HELPERS ═══════════════════════════════════════════════════════════
// ph(event, props) : wrapper sécurisé — silencieux si posthog non chargé
// §5 : jamais d'email, tel, nom, hash, UUID Supabase dans les props
function ph(event, props) {
  try {
    if (window.posthog && typeof posthog.capture === 'function') {
      posthog.capture(event, props || {});
    }
  } catch(e) { /* silencieux — ne jamais bloquer l'UX pour le tracking */ }
}

// Mode courant : 'real' | 'demo'
function getCurrentMode() { return signupMode || 'real'; }

// Enregistrement des propriétés globales (appelé au chargement + à chaque bascule de mode)
function phRegisterGlobals() {
  try {
    if (window.posthog && typeof posthog.register === 'function') {
      // is_internal : true pour les sessions DEV/QA, false pour les vrais visiteurs
      // Conditions : localhost, ?qa=1 dans l'URL, ou localStorage.qa_test_mode = 'true'
      const host = window.location.hostname;
      const isInternalUser =
        host === 'localhost' ||
        host === '127.0.0.1' ||
        new URLSearchParams(window.location.search).get('qa') === '1' ||
        localStorage.getItem('qa_test_mode') === 'true';

      posthog.register({
        app_mode:    getCurrentMode(),
        app_version: '1.0.0',
        viewport:    window.innerWidth < 768 ? 'mobile' : 'desktop',
        is_internal: isInternalUser   // filtrer les sessions DEV/QA dans PostHog Activity
      });
      // Propager is_internal comme person property (requis pour les cohorts PostHog)
      // posthog.register() attache aux events uniquement — setPersonProperties() attache à la fiche Person
      posthog.setPersonProperties({ is_internal: isInternalUser });
    }
  } catch(e) {}
}

}

async function handleAdminLogin() {
  const pwd = (document.getElementById('admin-pwd')?.value || '').trim();
  const errEl = document.getElementById('admin-login-err');
  if (!pwd) { errEl.textContent = 'Mot de passe requis.'; errEl.style.display = 'block'; return; }
  const btn = document.querySelector('.admin-login-card .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Vérification…'; }
  try {
    const ok = await bcrypt.compare(pwd, ADMIN_HASH);
    if (ok) {
      sessionStorage.setItem('lt_admin', '1');
      // PostHog §4.7 : admin_login_success — aucune PII, aucun hash, aucun détail d'action
      ph('admin_login_success');
      renderAdminDashboard();
    } else {
      errEl.textContent = 'Mot de passe incorrect.'; errEl.style.display = 'block';
      if (btn) { btn.disabled = false; btn.textContent = 'Accéder'; }
    }
  } catch(e) {
    errEl.textContent = 'Erreur de vérification. Vérifiez que ADMIN_HASH est un hash bcrypt valide.';
    errEl.style.display = 'block';
    if (btn) { btn.disabled = false; btn.textContent = 'Accéder'; }
  }
}

async function adminDeleteTournament(id, name) {
  if (!confirm('Annuler le tournoi "' + name + '" ?\n\nLe tournoi sera masqué du catalogue public mais les données resteront en base (soft-delete). Cette action peut être corrigée par le DBA si nécessaire.')) return;
  if (!confirm('Confirmation finale : annuler "' + name + '" et le masquer du catalogue ?')) return;
  const { error } = await supabaseClient.rpc('admin_update_tournament', {
    p_admin_secret: getAdminSecret(), p_id: id, p_patch: { status: 'cancelled' }
  });
  if (error) { toast('Erreur : ' + error.message, 'error'); }
  else { toast('Tournoi annulé', 'success'); renderAdminTournaments(); }
}

async function handleAdminConcierge() {
  const ownerEmail = document.getElementById('cc-owner')?.value.trim();
  const name       = document.getElementById('cc-name')?.value.trim();
  const department = document.getElementById('cc-dept')?.value.trim();
  const errEl      = document.getElementById('cc-err');

  if (!ownerEmail || !name || !department) {
    errEl.textContent = 'Email organisateur, nom du tournoi et département sont obligatoires.';
    return;
  }

  // AD-2 fix : générer un recovery_code aléatoire à haute entropie, le hasher bcrypt,
  // et l'inclure dans l'INSERT — cohérent avec la politique bcrypt du projet (RSSI).
  const rawBytes = new Uint8Array(32);
  crypto.getRandomValues(rawBytes);
  const recoveryPlain = Array.from(rawBytes).map(b => b.toString(16).padStart(2,'0')).join('');
  let recoveryHashed;
  try {
    recoveryHashed = await bcrypt.hash(recoveryPlain, 10);
  } catch(e) {
    errEl.textContent = 'Erreur génération code de récupération : ' + e.message;
    return;
  }

  const id = uid();
  const { error } = await supabaseClient.from('tournaments').insert([{
    id,
    owner_email:   ownerEmail,
    name,
    department,
    city:          document.getElementById('cc-city')?.value.trim() || null,
    date:          document.getElementById('cc-date')?.value || null,
    format:        document.getElementById('cc-format')?.value.trim() || null,
    max_teams:     parseInt(document.getElementById('cc-max')?.value) || null,
    entry_fee:     parseFloat(document.getElementById('cc-fee')?.value) || 0,
    surface:       document.getElementById('cc-surface')?.value.trim() || null,
    description:   document.getElementById('cc-desc')?.value.trim() || null,
    status:        'draft',
    recovery_code: recoveryHashed   // haché bcrypt — cohérent avec la politique RSSI
    // Ne pas chaîner .select() — INSERT-only côté client
  }]);
  if (error) {
    errEl.textContent = 'Erreur INSERT : ' + error.message;
  } else {

// ===== Calcul de la distance approximative entre deux villes (heuristique simple) =====
function cityMatchScore(city1, city2) {
  if (!city1 || !city2) return 0;
  const c1 = city1.toLowerCase().trim();
  const c2 = city2.toLowerCase().trim();
  if (c1 === c2) return 3;
  // Départements IDF
  const deps = {
    '75': ['paris'], '92': ['neuilly','levallois','boulogne','issy','courbevoie','nanterre','puteaux','colombes','asnières','clichy','gennevilliers','rueil','suresnes','montrouge','clamart'],
    '93': ['saint-denis','bobigny','montreuil','aubervilliers','aulnay','pantin','noisy','bondy','drancy','épinay','villepinte'],
    '94': ['créteil','vincennes','vitry','champigny','maisons-alfort','alfortville','ivry','choisy','thiais','rungis'],
    '91': ['évry','corbeil','massy','palaiseau','longjumeau','viry','savigny'],
    '95': ['cergy','pontoise','argenteuil','sarcelles','gonesse','garges'],
    '77': ['melun','meaux','chelles','torcy','combs'],
    '78': ['versailles','saint-germain','mantes','poissy','sartrouville']
  };
  for (const [dep, cities] of Object.entries(deps)) {
    const in1 = cities.some(c => c1.includes(c) || c.includes(c1.split('-')[0]));
    const in2 = cities.some(c => c2.includes(c) || c.includes(c2.split('-')[0]));
    if (in1 && in2) return 2; // même département
  }
  return 1; // même région IDF par défaut
}

// ===== Score de priorité d'un tournoi pour l'affichage home =====
function tournPriorityScore(t, userCity) {
  if (t.status !== 'open') return -1;
  const approved = t.registrations.filter(r => r.status === 'approved').length;
  const total = t.maxTeams || 1;
  const placesLeft = total - approved;
  const fillRate = approved / total; // 0→vide, 1→complet
  let score = 0;
  // Critère 1 : places disponibles mais pas vide (plus intéressant si ~50-80% rempli)
  if (placesLeft > 0) score += 30;
  if (fillRate >= 0.5 && fillRate < 1) score += 20; // presque complet = urgence
  if (fillRate >= 0.8) score += 15; // très peu de places = forte urgence
  // Critère 2 : date proche (favoriser les 30 prochains jours)
  const today = new Date(); today.setHours(0,0,0,0);
  const tDate = new Date(t.date);
  const daysUntil = Math.floor((tDate - today) / 86400000);
  if (daysUntil >= 0 && daysUntil <= 7)  score += 25;  // cette semaine
  else if (daysUntil > 7 && daysUntil <= 30) score += 15; // ce mois
  else if (daysUntil > 30 && daysUntil <= 60) score += 5; // dans 2 mois
  else if (daysUntil < 0) score -= 50; // passé
  // Critère 3 : géolocalisation (optionnelle)
  if (userCity && t.location) {
    score += cityMatchScore(userCity, t.location) * 10;
  }
  return score;
}

// ===== Étiquette contextuelle pour une carte =====
function tournUrgencyLabel(t) {
  const approved = t.registrations.filter(r => r.status === 'approved').length;
  const total = t.maxTeams || 1;
  const placesLeft = total - approved;
  const fillRate = approved / total;
  const today = new Date(); today.setHours(0,0,0,0);
  const daysUntil = Math.floor((new Date(t.date) - today) / 86400000);
  if (placesLeft <= 2 && placesLeft > 0) return { label: placesLeft + ' place' + (placesLeft > 1 ? 's' : '') + ' restante' + (placesLeft > 1 ? 's' : ''), cls: 'urgency-critical' };
  if (fillRate >= 0.75) return { label: 'Presque complet', cls: 'urgency-high' };
  if (daysUntil >= 0 && daysUntil <= 7) return { label: 'Cette semaine', cls: 'urgency-soon' };
  if (daysUntil > 7 && daysUntil <= 14) return { label: 'Dans ' + daysUntil + ' jours', cls: 'urgency-soon' };
  if (placesLeft > 0 && fillRate < 0.3) return { label: 'Nouvellement ouvert', cls: 'urgency-new' };
  return null;
}

// Carte enrichie pour la page d'accueil (avec badge urgence/contexte)
function tournCardHome(t) {
  const urgency = tournUrgencyLabel(t);
  const club = getClub(t.clubId, t);
  const approved = t.registrations.filter(r => r.status === 'approved').length;
  const placesLeft = (t.maxTeams || 0) - approved;
  const isUrgent = placesLeft > 0 && placesLeft < 3 && t.status === 'open';
  const catLabel = tournCategoriesLabel(t);
  const formatLabel = t.teamSize ? t.teamSize : '';
  const locLabel = [t.city ? esc(t.city) : '', t.department ? `(${esc(t.department)})` : ''].filter(Boolean).join(' ');
  return `
    <a class="t-card" href="${tournamentRoute(t.id)}">
      <div class="t-card-img ${club?.logoClass || ''}">
        <svg class="t-card-pattern" aria-hidden="true"><use href="#terrain"/></svg>
        <span class="t-card-mark">${esc(club?.mark || '')}</span>
        <div class="t-card-num">#${String(approved).padStart(2,'0')}</div>
      </div>
      <div class="t-card-body">
        <div class="t-card-club">${esc(clubLine(club))}</div>
        <h3 class="t-card-title">${esc(t.name)}</h3>
        ${catLabel !== '—' || formatLabel ? `<div class="t-card-category">${esc(catLabel)}${formatLabel ? ' · ' + esc(formatLabel) : ''}</div>` : ''}
        <p class="t-card-meta">${locLabel ? locLabel + ' · ' : ''}${esc(tournDateRange(t))}</p>
        ${urgency ? `<div class="t-card-urgency ${urgency.cls}">${urgency.label}</div>` : ''}
        <div class="t-card-foot">
          <span class="t-card-status ${isUrgent ? 'urgent' : t.status}">${isUrgent ? 'Dernières places' : t.status === 'open' ? 'Ouvert' : t.status === 'draft' ? 'Brouillon' : 'En cours'}</span>
          <span class="t-card-count">${approved} / ${t.maxTeams || '?'} éq.</span>
        </div>
      </div>
    </a>`;
}

function tournCard(t) {
  const club = getClub(t.clubId, t);
  const approved = t.registrations.filter(r => r.status !== 'rejected').length;
  const catLabel = tournCategoriesLabel(t);
  const formatLabel = t.teamSize ? t.teamSize : '';
  const locLabel = [t.city ? esc(t.city) : '', t.department ? `(${esc(t.department)})` : ''].filter(Boolean).join(' ');
  return `
    <a class="t-card" href="${tournamentRoute(t.id)}">
      <div class="t-card-img ${club?.logoClass || ''}">
        <svg class="t-card-pattern" aria-hidden="true"><use href="#terrain"/></svg>
        <span class="t-card-mark">${esc(club?.mark || '')}</span>
        <div class="t-card-num">#${String(approved).padStart(2,'0')}</div>
      </div>
      <div class="t-card-body">
        <div class="t-card-club">${esc(clubLine(club))}</div>
        <h3 class="t-card-title">${esc(t.name)}</h3>
        ${catLabel !== '—' || formatLabel ? `<div class="t-card-category">${esc(catLabel)}${formatLabel ? ' · ' + esc(formatLabel) : ''}</div>` : ''}
        <p class="t-card-meta">${locLabel ? locLabel + ' · ' : ''}${esc(tournDateRange(t))}</p>
        <div class="t-card-foot">
          <span class="t-card-status ${t.status}">${t.status === 'open' ? 'Ouvert' : t.status === 'draft' ? 'Brouillon' : 'En cours'}</span>

}

function makeMark(name) {
  return name.split(' ').filter(w => w.length > 1).slice(0, 3).map(w => w[0]).join('').toUpperCase().slice(0, 3);
}

async function handleSignup(e, type) {
  e.preventDefault();
  const errEl = document.getElementById('signup-err');
  errEl.classList.remove('show');

  // ===== Anti-spam honeypot =====
  const hp = document.getElementById('f-hp-website');
  if (hp && hp.value.trim() !== '') {
    // Silently reject bots — pretend success without doing anything
    console.log('[Le Tournoi] honeypot triggered, blocking');
    return;
  }

  // ===== Password confirmation check =====
  const pwd = document.getElementById('f-pwd').value;
  const pwd2 = document.getElementById('f-pwd2') ? document.getElementById('f-pwd2').value : pwd;
  if (pwd !== pwd2) {
    errEl.textContent = 'Les deux mots de passe ne correspondent pas. Re-saisis-les à l\'identique.';
    errEl.classList.add('show');
    document.getElementById('f-pwd2').focus();
    return;
  }
  if (pwd.length < 6) {
    errEl.textContent = 'Le mot de passe doit faire au moins 6 caractères.';
    errEl.classList.add('show');
    document.getElementById('f-pwd').focus();
    return;
  }

  const name = document.getElementById('f-name').value.trim();
  // PostHog §4.3 : account_creation_started — pas de PII, account_type explicite
  ph('account_creation_started', { mode: getCurrentMode(), account_type: type });
  let d;
  if (type === 'club') {
    d = { name, email: document.getElementById('f-email').value.trim().toLowerCase(),
      password: document.getElementById('f-pwd').value,
      president: document.getElementById('f-pres').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      department: document.getElementById('f-dept')?.value || '',
      city: document.getElementById('f-city')?.value.trim() || '',
      mark: makeMark(name),
      logoClass: ['alt-1','alt-2','alt-3','alt-4',''][state.clubs.length % 5] };
  } else if (type === 'team') {
    d = { name, email: document.getElementById('f-email').value.trim().toLowerCase(),
      password: document.getElementById('f-pwd').value,
      manager: document.getElementById('f-mgr').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      mark: makeMark(name), club: '', category: '', department: '', city: '', website: '',
      bio: '', availability: ['sat', 'sun'], players: [] };
  } else {
    d = { name, email: document.getElementById('f-email').value.trim().toLowerCase(),
      password: document.getElementById('f-pwd').value,
      sector: document.getElementById('f-sect').value.trim(),
      contact: document.getElementById('f-cont').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      budgetRange: document.getElementById('f-budget').value,
      mark: makeMark(name), description: '', preferredCategories: [] };
  }

  // ====== Inscription réelle (Supabase) ======
  if (signupMode === 'real') {
    // Détecter file:// ou Supabase absent → message explicite + arrêt
    if (window.location.protocol === 'file:') {
      errEl.textContent = 'Les inscriptions réelles ne fonctionnent pas depuis un fichier local. Ouvrez le site via Live Server (localhost) ou sur GitHub Pages pour tester.';
      errEl.classList.add('show'); return;
    }
    if (!supabaseClient) {
      errEl.textContent = 'Supabase non configuré. Vérifiez que config.js contient vos vraies clés, puis rechargez la page.';
      errEl.classList.add('show'); return;
    }
    const consentData = document.getElementById('consent-data');
      if (!consentData || !consentData.checked) {
        errEl.textContent = 'Cochez le consentement RGPD obligatoire pour continuer.';
        errEl.classList.add('show'); return;
      }
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Envoi…'; }
      // Générer le code d'activation et de récupération AVANT l'envoi Supabase
      const activationCode = genActivationCode();
      const recoveryCodeForSupabase = genRecoveryCode();
      d._activationCode = activationCode;         // transmis au payload Supabase
      d._recoveryCode   = recoveryCodeForSupabase; // stocké en base pour récupération cross-device

      const r = await submitRealSignup(type, d, {
        dataCollection: consentData.checked,
        marketing: false
      });
      if (submitBtn) { submitBtn.disabled = false; }
      if (r.error) {
        errEl.textContent = r.error; errEl.classList.add('show');
        if (submitBtn) submitBtn.innerHTML = type === 'club'
          ? 'Créer un compte organisateur <span class="btn-arrow"></span>'
          : type === 'team'
          ? 'Créer un compte équipe <span class="btn-arrow"></span>'
          : 'Créer un compte sponsor <span class="btn-arrow"></span>';
        return;
      }

      // Créer le compte local en status 'pending' pour permettre la connexion
      const recoveryCode = recoveryCodeForSupabase; // même code qu'en base Supabase
      const localAccount = {
        id: uid(), type, ...d,
        status: 'pending',
        activationCode,
        recoveryCode
      };
      delete localAccount._activationCode;
      delete localAccount.password; // ne pas stocker en clair... ah si, MVP — ok
      localAccount.password = d.password; // cohérence avec loginAccount
      const coll = type === 'club' ? 'clubs' : type === 'team' ? 'teams' : 'sponsors';
      state[coll].push(localAccount);
      state.currentType = type;
      state.currentId = localAccount.id;
      saveState();

      // Rattacher d'éventuelles candidatures faites sans compte (même email)
      if (type === 'team') linkPastRegistrations(localAccount.email, localAccount.id);

      // PostHog §4.3 : account_creation_completed (mode réel)
      ph('account_creation_completed', { mode: 'real', account_type: type, departement: d.department || null });

      // Afficher le code de récupération puis rediriger vers l'écran d'attente
      navigate('#/pending');
      setTimeout(() => showRecoveryCodeModal(recoveryCode), 400);
      return;
  } // fin du if (signupMode === 'real')

  // ====== Mode démo ======
  const r = signupAccount(type, d);
  if (r.error) { errEl.textContent = r.error; errEl.classList.add('show'); return; }
  if (r.pending) { navigate('#/pending'); return; }
  if (type === 'team') linkPastRegistrations(r.account.email, r.account.id);
  // PostHog §4.3 : account_creation_completed (mode démo)
  ph('account_creation_completed', { mode: 'demo', account_type: type });
  navigate('#/dashboard');
  // D06 fix : avertir explicitement que le compte est local uniquement
  showDemoBanner();
  if (r.recoveryCode) {
    setTimeout(() => showRecoveryCodeModal(r.recoveryCode), 400);
  } else {
    toast('Compte créé en mode démo. Données locales uniquement, non enregistrées en base.', 'warning');
  }
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function handleRecoverStep1() {
  const errEl = document.getElementById('rec-err');
  errEl.classList.remove('show');
  const email = document.getElementById('rec-email').value.trim().toLowerCase();
  const code  = document.getElementById('rec-code').value.trim().toLowerCase();

  if (!email || !code) {
    errEl.textContent = 'Renseignez votre email et votre code de récupération.';
    errEl.classList.add('show'); return;
  }

  // Recherche dans toutes les collections
  let found = null;
  ['clubs', 'teams', 'sponsors'].forEach(coll => {
    const acc = state[coll].find(a =>
      a.email && a.email.toLowerCase() === email &&
      a.recoveryCode && a.recoveryCode.toLowerCase() === code
    );
    if (acc) found = acc;
  });

  if (!found) {
    errEl.textContent = 'Email ou code de récupération incorrect. Vérifiez la saisie.';
    errEl.classList.add('show'); return;
  }

  // Mémoriser le compte vérifié et passer à l'étape 2
  _recoverAccount = found;
  renderRecover(2);
}

async function handleLogin(e) {
e.preventDefault();

  const email = document.getElementById('l-email').value.trim().toLowerCase();
  const pwd   = document.getElementById('l-pwd').value;
  const recoveryCodeInput = (document.getElementById('l-recovery')?.value || '').trim();

  const errEl = document.getElementById('login-err');
  errEl.classList.remove('show');

  if (signupMode === 'real' && loginType === 'club' && !recoveryCodeInput) {
    errEl.textContent = 'Saisissez le code de récupération organisateur pour charger vos tournois.';
    errEl.classList.add('show');
    return;
  }
  // PostHog §4.4 : login_attempted — pas de PII (pas d'email)
  ph('login_attempted', { mode: getCurrentMode() });

  // Tentative 1 : localStorage
  let r = loginAccount(loginType, email, pwd);

  // Tentative 2 : fallback Supabase si absent du localStorage (autre appareil, cache vidé)
  if (r.trySupabase && supabaseClient) {
    const submitBtn = e.target.querySelector('button[type="submit"]');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Vérification…'; }
    r = await loginAccountFromSupabase(loginType, email, pwd, recoveryCodeInput);
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Se connecter →'; }
  }

  if (r.error) {
  // PostHog §4.4 : login_failed — reason générique sans détail PII
  const reason = r.error.toLowerCase().includes('mot de passe') ? 'wrong_password' : 'not_found';
  ph('login_failed', { reason, mode: getCurrentMode() });
  errEl.textContent = r.error;
  errEl.classList.add('show');
  return;
}

if (r.pending) { navigate('#/pending'); return; }

// Option A : rattacher le code de récupération saisi au compte club local
// pour permettre le chargement privé des tournois organisateur.
if (loginType === 'club' && recoveryCodeInput && r.account) {
  r.account.recoveryCode = recoveryCodeInput;

  const localClub = state.clubs.find(x =>
    x.id === r.account.id ||
    (x.email && r.account.email && x.email.toLowerCase() === r.account.email.toLowerCase())
  );

  if (localClub) {
    localClub.recoveryCode = recoveryCodeInput;
  }

  saveState();
}

// Charger les tournois de l'organisateur AVANT le rendu final du dashboard.
// La RPC est déjà validée côté Supabase : elle retourne tes 4 tournois.
if (loginType === 'club' && r.account.email && r.account.recoveryCode) {
  await loadMyTournaments(r.account.email, r.account.recoveryCode);
}

// PostHog §4.4 : login_success
ph('login_success', { account_type: loginType });

toast('Bienvenue !', 'success');
navigate('#/dashboard');

// Charger la vue participant — RPC directe si recoveryCode disponible, fallback sinon
if (loginType === 'team' || loginType === 'sponsor') {
  const doLoad = async () => {
    let ok = false;
    if (r.account.recoveryCode) {
      ok = await loadParticipantView(email, r.account.recoveryCode, loginType);
    }
    if (!ok) {
      // Fallback : attendre _tournamentsSyncDone puis merge
      let tries = 0;
      while (!_tournamentsSyncDone && tries < 20) {
        await new Promise(res => setTimeout(res, 300));
        tries++;
      }
      await mergeRegistrationsByEmail(email, r.account.id);
    }
    if (typeof getRoute === 'function' && getRoute() === '/dashboard') render();
  };
  doLoad();
  startRegistrationsPolling();
}
}

// DASHBOARD - branches by account type
function renderDashboard() {
  const a = getAccount();
  if (a.type === 'club') return renderClubDashboard(a);
  if (a.type === 'team') return renderTeamDashboard(a);
  return renderSponsorDashboard(a);
}
let _clubTournamentLoadInProgress = false;
let _clubTournamentLoadAttemptedFor = '';

function renderClubDashboard(c) {
  // En mode réel, owner_email n'est pas chargé publiquement.
  // Le dashboard doit donc déclencher lui-même la RPC privée get_my_tournaments
  // si les tournois de l'organisateur ne sont pas encore présents dans state.
  if (signupMode === 'real' && supabaseClient && c && c.email) {
    const emailKey = c.email.toLowerCase();

    const hasLinkedTournaments = state.tournaments.some(t =>
      t.ownerEmail &&
      t.ownerEmail.toLowerCase() === emailKey
    );

    if (!hasLinkedTournaments) {
      if (!c.recoveryCode) {
        document.getElementById('app').innerHTML = `
          <div class="container" style="padding-top: 2.5rem; padding-bottom: 3rem;">

      const loadKey = emailKey + ':' + c.recoveryCode;

        _clubTournamentLoadInProgress = true;
        _clubTournamentLoadAttemptedFor = loadKey;

        document.getElementById('app').innerHTML = `

        loadMyTournaments(c.email, c.recoveryCode)

            _clubTournamentLoadInProgress = false;
            if (getRoute() === '/dashboard') render();

        return;

  // En mode réel : les tournois peuvent être liés par clubId (local) OU par ownerEmail (Supabase)
  const myTs = state.tournaments.filter(t =>

  const totTeams = myTs.reduce((s, t) => s + t.registrations.filter(r => r.status === 'approved').length, 0);
  const totSp = myTs.reduce((s, t) => s + t.sponsorProposals.reduce((sum, sp) => sum + (sp.status === 'confirme' ? sp.amount : 0), 0), 0);
  const pendT = myTs.reduce((s, t) => s + t.registrations.filter(r => r.status === 'pending').length, 0);
