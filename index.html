      <h1 class="dash-greeting"><em>${esc(c.name)}</em></h1>
      <p class="dash-sub" style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
        Tableau de bord organisateur.
        ${renderBadge(cb)}
      </p>
      <div class="dash-stats">
        <div class="dash-stat"><div class="dash-stat-label">Tournois actifs</div><div class="dash-stat-val">${myTs.filter(t => t.status === 'open').length}</div></div>
        <div class="dash-stat"><div class="dash-stat-label">Équipes inscrites</div><div class="dash-stat-val">${totTeams}</div></div>
        <div class="dash-stat"><div class="dash-stat-label">Sponsors</div><div class="dash-stat-val"><em>${totSp}€</em></div></div>
        <div class="dash-stat"><div class="dash-stat-label">À traiter</div><div class="dash-stat-val">${pendT + pendS}</div></div>
      </div>
      ${(pendT + pendS) > 0 ? `
        <div class="dash-section">
          <div class="dash-section-h"><div class="dash-section-title">⚠ À traiter</div></div>
          <div class="aside-card" style="margin-bottom: 0;">
            <div style="font-family: var(--font-serif); font-style: italic; font-size: 1rem; margin-bottom: 1rem;">
              ${pendT > 0 ? `<strong>${pendT}</strong> demande${pendT > 1 ? 's' : ''} d'inscription équipe` : ''}${pendT > 0 && pendS > 0 ? ' et ' : ''}${pendS > 0 ? `<strong>${pendS}</strong> proposition${pendS > 1 ? 's' : ''} de sponsoring` : ''} en attente.

            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">

async function saveProfile() {
  const a = getAccount();
  if (!a) return;
  const errEl = document.getElementById('profile-err');
  const name = document.getElementById('p-name')?.value.trim();
  if (!name) { errEl.textContent = 'Le nom est obligatoire.'; errEl.classList.add('show'); return; }

  // Champs communs
  a.name       = name;
  a.department = document.getElementById('p-dept')?.value || a.department;
  a.city       = document.getElementById('p-city')?.value.trim() || a.city;
  a.phone      = document.getElementById('p-phone')?.value.trim() || a.phone;
  a.mark       = makeMark(name);

  // Champs spécifiques par type
  const patch = {
    city:       a.city       || null,
    department: a.department || null
  };
  if (a.type === 'club') {
    a.president  = document.getElementById('p-pres')?.value.trim() || a.president;
    a.website    = document.getElementById('p-web')?.value.trim()  || a.website;
    patch.website    = a.website    || null;
    patch.shareEmail = a.shareEmail ?? false;
    patch.sharePhone = a.sharePhone ?? false;
  } else if (a.type === 'team') {
    a.club      = document.getElementById('p-club')?.value.trim()  || a.club;
    a.category  = document.getElementById('p-category')?.value     || a.category;
    a.level     = document.getElementById('p-level')?.value        || a.level;
    a.manager   = document.getElementById('p-mgr')?.value.trim()   || a.manager;
    a.bio       = document.getElementById('p-bio')?.value.trim()   || a.bio;
    patch.bio          = a.bio        || null;
    patch.club         = a.club       || null;
    patch.category     = a.category   || null;
    patch.availability = a.availability  || [];
    patch.preferences  = a.preferences  || {};
    patch.shareEmail   = a.shareEmail ?? false;
    patch.sharePhone   = a.sharePhone ?? false;
  } else {
    a.sector      = document.getElementById('p-sector')?.value.trim()  || a.sector;
    a.contact     = document.getElementById('p-contact')?.value.trim() || a.contact;
    a.budgetRange = document.getElementById('p-budget')?.value         || a.budgetRange;
    a.description = document.getElementById('p-bio')?.value.trim()     || a.description;
    patch.description          = a.description || null;
    patch.preferredCategories  = a.preferredCategories || [];
    patch.shareEmail           = a.shareEmail ?? false;
    patch.sharePhone           = a.sharePhone ?? false;
  }

  // Persistance locale immédiate
  saveState();

  // B1 — persistance en base via RPC update_profile (Note DEV-B1-B2)
  if (signupMode === 'real' && supabaseClient && a.email && a.recoveryCode) {
    try {
      const { data, error } = await supabaseClient.rpc('update_profile', {
        p_account_type: a.type,
        p_email:        a.email,
        p_recovery_code: a.recoveryCode,
        p_patch:        patch
      });
      if (error) {
        console.warn('[Le Tournoi] update_profile RPC:', error.message);
        toast('Profil mis à jour localement (sync base échouée)', 'warning');
      } else if (data?.ok === false) {
        if (data.error === 'unauthorized') {
          toast('Vérification d\'autorisation échouée. Reconnectez-vous avec votre code de récupération.', 'error');
        } else {
          toast('Profil mis à jour localement (' + data.error + ')', 'warning');
        }
      } else {
        toast('Profil mis à jour', 'success');
      }
    } catch(e) {
      console.warn('[Le Tournoi] update_profile exception:', e.message);
      toast('Profil mis à jour localement (erreur réseau)', 'warning');
    }
  } else {
    toast('Profil mis à jour', 'success');
  }

  // PostHog §4.6
  ph('profile_edit_saved', { account_type: a.type });
  navigate('#/dashboard');
}

function toggleDeptMultiselect(e) {
  e.stopPropagation();
  const panel = document.getElementById('dept-multiselect-panel');
  if (!panel) return;
  const willOpen = panel.style.display === 'none';
  panel.style.display = willOpen ? 'block' : 'none';
  if (willOpen) {
    setTimeout(() => document.addEventListener('click', function closeOnce(ev) {
      if (!panel.contains(ev.target)) { panel.style.display = 'none'; document.removeEventListener('click', closeOnce); }
    }), 10);
  }
}
function toggleSearchDept(code) {
  const i = tournamentSearchDepts.indexOf(code);
  if (i === -1) tournamentSearchDepts.push(code); else tournamentSearchDepts.splice(i, 1);
  renderTournaments();
}

function updateSortButtons(activeBtn) {
  // Mettre à jour la classe active sur les boutons de tri sans re-rendre
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));

}

function updateTournamentResults() {
  const el = document.getElementById('t-results');
  if (!el) return;

  // Mémoriser le focus et la position curseur AVANT de toucher au DOM
  const focused = document.activeElement;
  const focusId  = focused ? focused.id : null;
  const selStart = focused && focused.selectionStart !== undefined ? focused.selectionStart : null;
  const selEnd   = focused && focused.selectionEnd   !== undefined ? focused.selectionEnd   : null;
  // Mémoriser la position de scroll
  const scrollY  = window.scrollY;

  const filtered = filterTournaments(
    tournamentSearchQuery, tournamentSearchCategory, tournamentSearchStatus
  );
  const hasActiveFilters = !!(tournamentSearchQuery || tournamentSearchDepts.length ||
    tournamentSearchCategory || tournamentSearchStatus ||
    tournamentSearchSurface || tournamentSearchFormat || tournamentSearchMaxFee);

  // Mettre à jour le compteur sans toucher aux champs
  const countEl = document.querySelector('.search-count');
  if (countEl) countEl.textContent = (supabaseClient && !_tournamentsSyncDone) ? 'Synchronisation…' : (filtered.length + ' résultat' + (filtered.length !== 1 ? 's' : ''));

  // Mettre à jour uniquement la zone résultats
  el.innerHTML = filtered.length === 0
    ? '<div class="dash-empty"><div class="dash-empty-title">Aucun tournoi trouvé</div><p class="dash-empty-text">Modifiez les critères de recherche, ou publiez un nouveau tournoi.</p><button class="btn btn-ghost btn-sm" onclick="clearAllTournamentFilters()">Voir tous les tournois</button></div>'
    : '<div class="grid grid-3">' + filtered.map(tournCard).join('') + '</div>';

  // Restituer le focus et la position du curseur
  if (focusId) {
    const el2 = document.getElementById(focusId);
    if (el2) {
      el2.focus();
      if (selStart !== null && el2.setSelectionRange) {
        el2.setSelectionRange(selStart, selEnd);
      }
    }
  }
  // Restituer la position de scroll
  window.scrollTo(0, scrollY);
}

function filterTournaments(query, category, status) {
  const q = (query || '').toLowerCase().trim();

  let results = (state.tournaments || []).filter(t => {
    const nameMatch = !q ||
      (t.name || '').toLowerCase().includes(q) ||
      (t.edition || '').toLowerCase().includes(q) ||
      (t.description || '').toLowerCase().includes(q);
    // Filtre département IDF (multi-sélection) — remplace l'ancienne recherche libre de lieu
    const deptMatch = tournamentSearchDepts.length === 0 || tournamentSearchDepts.includes(t.department);
    const cats = tournCategories(t);
    const categoryMatch = !category || cats.includes(category);
    const statusMatch = !status || t.status === status;
    // Filtres avancés

    const surfaceMatch = !tournamentSearchSurface || t.surface === tournamentSearchSurface;
    const sizeAsMatch = t.teamSize ? (String(t.teamSize) + 'v' + String(t.teamSize)) : '';
    const formatMatch = !tournamentSearchFormat ||
      t.matchSize === tournamentSearchFormat ||
      sizeAsMatch === tournamentSearchFormat;
    const feeMatch = !tournamentSearchMaxFee || (t.entryFee || 0) <= parseFloat(tournamentSearchMaxFee);
    return nameMatch && deptMatch && categoryMatch && statusMatch && surfaceMatch && formatMatch && feeMatch;
  });

  // Tri
  results = [...results].sort((a, b) => {
    if (tournamentSortBy === 'date') {
      return (a.date || '').localeCompare(b.date || '');
    } else if (tournamentSortBy === 'location') {
      const ca = a.city || getClub(a.clubId)?.city || a.location || '';
      const cb = b.city || getClub(b.clubId)?.city || b.location || '';
      return ca.localeCompare(cb);
    } else if (tournamentSortBy === 'fee') {
      return (a.entryFee || 0) - (b.entryFee || 0);
    }
    return 0;
  });

  return results;
}

function handleCreateT(e) {
  e.preventDefault();
  const club = getAccount();
  const errEl = document.getElementById('t-err');
  errEl.classList.remove('show');

  // Collect selected categories
  const categories = [...document.querySelectorAll('#t-categories .day-check.selected')].map(el => el.dataset.v);
  if (categories.length === 0) {
    errEl.textContent = 'Sélectionne au moins une catégorie d\'âge.';
    errEl.classList.add('show');
    return;
  }

  const matchSize = document.getElementById('t-matchsize').value;
  // Derive teamSize from matchSize (for backward compat with bracket generation)
  const teamSizeMap = { '5v5': 5, '7v7': 7, '8v8': 8, '11v11': 11, 'futsal': 5 };
  const teamSize = teamSizeMap[matchSize] || 11;

  const compFormat = document.getElementById('t-compformat').value;
  const compFormatOther = document.getElementById('t-compformat-other').value.trim();

  const department = document.getElementById('t-dept').value;
  const city = document.getElementById('t-city').value.trim();
  if (!department) {
    errEl.textContent = 'Sélectionne un département (Île-de-France uniquement).';
    errEl.classList.add('show');
    return;
  }
  if (!city) {
    errEl.textContent = 'Choisis une adresse dans la liste de suggestions pour renseigner la ville.';
    errEl.classList.add('show');
    return;
  }

  const venueName = document.getElementById('t-venue-name').value.trim();
  const venueAddress = document.getElementById('t-venue-addr').value.trim();
  const registrationDeadline = document.getElementById('t-deadline')?.value || '';

  const dateStart = document.getElementById('t-date').value;
  const dateEnd = document.getElementById('t-date-end').value || dateStart; // Default to same day
  const timeStart = document.getElementById('t-time-start')?.value || '';
  const timeEnd   = document.getElementById('t-time-end')?.value   || '';

  // Block past dates
  const today = new Date().toISOString().split('T')[0];
  if (dateStart < today) {
    errEl.textContent = 'La date de début ne peut pas être dans le passé.';
    errEl.classList.add('show');
    return;
  }
  if (dateEnd && dateEnd < dateStart) {
    errEl.textContent = 'La date de fin doit être après la date de début.';
    errEl.classList.add('show');
    return;
  }

  const t = {
    id: uid(), clubId: club.id,
    name: document.getElementById('t-name').value.trim(),
    edition: '',
    date: dateStart,
    dateEnd: dateEnd || dateStart,
    timeStart,
    timeEnd,
    registrationDeadline,
    department, city,
    // New venue fields
    venueName, venueAddress,
    // Keep legacy 'location' for backward compat (combined display)
    location: venueName + (venueAddress ? ' · ' + venueAddress : ''),
    // New categorization
    categories,
    matchSize,
    gender: document.getElementById('t-gender').value,
    surface: document.getElementById('t-surface').value,
    competitionFormat: compFormat,
    competitionFormatOther: compFormat === 'autres' ? compFormatOther : '',
    // Legacy 'format' field kept = first selected category (for backward compat)
    format: categories[0],
    teamSize,
    maxTeams: parseInt(document.getElementById('t-max').value),
    entryFee: parseInt(document.getElementById('t-fee').value),
    description: document.getElementById('t-desc').value.trim(),
    // Contact info
    contactName:         document.getElementById('t-contact-name').value.trim(),
    contactPhone:        document.getElementById('t-contact-phone').value.trim(),
    contactEmail:        document.getElementById('t-contact-email').value.trim(),
    contactVisible:      document.getElementById('t-contact-visible')?.checked !== false,
    contactShareEmail:   document.getElementById('t-contact-visible')?.checked !== false,
    contactSharePhone:   document.getElementById('t-contact-visible')?.checked !== false,
    // System
    status: 'open',
    organizerName: club.name || '',  // dénormalisé pour affichage public (Note-Dev-OrganizerName)
    registrations: [],
    sponsorProposals: [],
    animations: [],
    matches: [],
    sponsorTiers: [
      { name: 'or', price: 800, perks: ['Logo bannière entrée', 'Logo trophée', 'Annonces micro × 8', '20 invitations'], slots: 2 },
      { name: 'argent', price: 350, perks: ['Logo affiches', 'Annonces × 4', '10 invitations'], slots: 4 },
      { name: 'bronze', price: 150, perks: ['Logo affiches', '5 invitations'], slots: 8 }
    ]
  };
  state.tournaments.push(t);
  saveState();
  syncTournament(t, true);  // CRÉATION — INSERT direct (Option B, note dev v3)
  toast('Tournoi créé !', 'success');
  navigate(`#/tournaments/${t.id}`);
}

// ────────────────────────────────────────────────────────────────────────────
// ANNULATION DE TOURNOI (Note-Dev-Annulation-Tournoi-J1-v2)
// Soft-delete : status → 'cancelled'. Jamais de DELETE physique côté organisateur.
// La suppression physique reste réservée à l'admin (RPC admin_delete_tournament).
// ────────────────────────────────────────────────────────────────────────────
async function handleCancelTournament(tid) {
  const t = getTournament(tid);
  if (!t) return;
  const a = getAccount();
  if (!a || a.type !== 'club') return;

  if (!confirm(`Annuler le tournoi "${t.name}" ?\n\nLe tournoi sera masqué du catalogue public. Les équipes déjà inscrites recevront un message d'annulation. Cette action peut être corrigée par l'administrateur si nécessaire.`)) return;
  if (!confirm(`Confirmation finale : annuler "${t.name}" ?`)) return;

  const recoveryCode = a.recoveryCode || '';

  if (signupMode === 'real' && supabaseClient && recoveryCode) {
    // RPC delete_tournament — seule RPC qui vérifie les inscriptions approuvées (ERRCODE 23514)
    // update_tournament ne fait pas ce contrôle — DBA confirmé le 2026-07-13
    const { error } = await supabaseClient.rpc('delete_tournament', {
      p_id:            tid,
      p_owner_email:   a.email,
      p_recovery_code: recoveryCode
    });
    if (error) {
      if (error.code === '23514' || error.code === '23000') {
        toast("Impossible d'annuler : des équipes ont déjà été approuvées. Retirez-les avant d'annuler.", 'warning');
      } else if (error.code === '28000') {
        toast("Vérification d'autorisation échouée. Utilisez votre code de récupération.", 'error');
      } else {
        toast("Erreur lors de l'annulation : " + error.message, 'error');
      }
      return;
    }
  }

  // Mise à jour locale
  t.status = 'cancelled';
  saveState();
  toast('Tournoi annulé. Il ne sera plus visible dans le catalogue.', 'success');
  render();
}

function handleEditT(e, tid) {
  e.preventDefault();
  const t = getTournament(tid);
  if (!t) return;
  const errEl = document.getElementById('t-err');
  errEl.classList.remove('show');

  const categories = [...document.querySelectorAll('#t-categories .day-check.selected')].map(el => el.dataset.v);
  if (categories.length === 0) {
    errEl.textContent = 'Sélectionne au moins une catégorie.';
    errEl.classList.add('show'); return;
  }

  const dateStart = document.getElementById('t-date').value;
  const dateEnd = document.getElementById('t-date-end').value || dateStart;
  const timeStart = document.getElementById('t-time-start')?.value || '';
  const timeEnd   = document.getElementById('t-time-end')?.value   || '';

  if (dateEnd && dateEnd < dateStart) {
    errEl.textContent = 'La date de fin doit être après la date de début.';
    errEl.classList.add('show'); return;
  }

  const matchSize = document.getElementById('t-matchsize').value;
  const teamSizeMap = { '5v5': 5, '7v7': 7, '8v8': 8, '11v11': 11, 'futsal': 5 };
  const venueName = document.getElementById('t-venue-name').value.trim();
  const venueAddress = document.getElementById('t-venue-addr').value.trim();
  const compFormat = document.getElementById('t-compformat').value;
  const department = document.getElementById('t-dept').value;
  const city = document.getElementById('t-city').value.trim();
  const registrationDeadline = document.getElementById('t-deadline')?.value || '';
  if (!department) {
    errEl.textContent = 'Sélectionne un département (Île-de-France uniquement).';
    errEl.classList.add('show'); return;
  }
  if (!city) {
    errEl.textContent = 'Choisis une adresse dans la liste de suggestions pour renseigner la ville.';
    errEl.classList.add('show'); return;
  }

  // Update in place
  Object.assign(t, {
    name:              document.getElementById('t-name').value.trim(),
    date:              dateStart,
    dateEnd:           dateEnd,
    timeStart,
    timeEnd,
    registrationDeadline,
    department, city,
    venueName,
    venueAddress,
    location:          venueName + (venueAddress ? ' · ' + venueAddress : ''),
    categories,
    format:            categories[0],
    matchSize,
    teamSize:          teamSizeMap[matchSize] || 11,
    gender:            document.getElementById('t-gender').value,
    surface:           document.getElementById('t-surface').value,
    competitionFormat: compFormat,
    competitionFormatOther: compFormat === 'autres' ? document.getElementById('t-compformat-other').value.trim() : '',
    maxTeams:          parseInt(document.getElementById('t-max').value),
    entryFee:          parseInt(document.getElementById('t-fee').value),
    description:       document.getElementById('t-desc').value.trim(),
    contactName:         document.getElementById('t-contact-name').value.trim(),
    contactPhone:        document.getElementById('t-contact-phone').value.trim(),
    contactEmail:        document.getElementById('t-contact-email').value.trim(),
    contactShareEmail:   document.getElementById('t-share-email')?.checked !== false,
    contactSharePhone:   document.getElementById('t-share-phone')?.checked !== false,
    contactEmailEncoded: encodeContact(document.getElementById('t-contact-email').value.trim()),
    contactPhoneEncoded: encodeContact(document.getElementById('t-contact-phone').value.trim()),
  });

  saveState();
  syncTournament(t, false);  // MODIFICATION — RPC update_tournament (Option B)
  toast('Tournoi mis à jour !', 'success');
  navigate('#/tournaments/' + tid);
}

// TOURNAMENT DETAIL with tabs
// Charge un tournoi précis depuis Supabase s'il n'est pas encore en mémoire locale.
// Corrige le cas des liens partagés (WhatsApp/Facebook) ouverts par un visiteur
// dont le state.tournaments local ne contient pas encore ce tournoi.
async function ensureTournamentLoaded(id) {
  const local = getTournament(id);
  if (local) return local;
  if (!supabaseClient) return null;
  try {
    const { data, error } = await supabaseClient
      .from('tournaments')
      .select('id, club_id, name, edition, date, date_end, time_start, time_end, department, city, location, format, team_size, max_teams, entry_fee, surface, registration_deadline, description, status, sponsor_tiers, animations, matches, created_at')
      .eq('id', id)
      .maybeSingle();
    if (error || !data) {
      console.warn('[Le Tournoi] ensureTournamentLoaded: introuvable en base', id, error);
      return null;
    }
    const t = rowToTournament(data);
    // Charger ses candidatures/propositions dédiées (mêmes tables que le chargement global)
    try {
      // RSSI A0-4 : select explicite sans PII, cohérent avec les fonctions de chargement global.
      // registrations : colonnes non-PII + filtre approved (même politique que loadRegistrationsFromSupabase)
      // sponsor_proposals : colonnes non-PII (contact/notes exclus)
      const [regs, props] = await Promise.all([
        supabaseClient.from('registrations')
          .select('tournament_id, team_name, club_name, status, registered_at, id, team_id')
          .eq('tournament_id', id)
          .eq('status', 'approved'),
        supabaseClient.from('sponsor_proposals')
          .select('id, tournament_id, name, tier, tier_label, amount, status')
          .eq('tournament_id', id)
      ]);
      if (regs?.data) t.registrations = regs.data.map(row => ({
        id: row.id, teamId: row.team_id, teamName: row.team_name, clubName: row.club_name,
        status: row.status, registeredAt: row.registered_at
      }));
      if (props?.data) t.sponsorProposals = props.data.map(row => ({
        id: row.id, name: row.name, tier: row.tier,
        tierLabel: row.tier_label, amount: row.amount, status: row.status
      }));
    } catch(e) { /* non bloquant — le tournoi s'affiche quand même */ }
    // Ajouter au state local pour que les rendus suivants le trouvent immédiatement
    if (!state.tournaments.some(x => x.id === t.id)) state.tournaments.push(t);
    return t;
  } catch(e) {
    console.error('[Le Tournoi] ensureTournamentLoaded exception:', e);
    return null;
  }
}

  // ouverts par un visiteur dont la liste complète n'a pas encore fini de se synchroniser).
  if (!t) {

            ${t.status !== 'cancelled' ? `<button class="btn btn-outline btn-sm" style="border-color:rgba(200,80,80,0.5);color:rgba(245,180,180,0.9);" onclick="handleCancelTournament('${t.id}')">Annuler ce tournoi</button>` : `<span style="font-family:var(--font-mono);font-size:11px;color:rgba(245,239,228,0.4);letter-spacing:0.06em;">TOURNOI ANNULÉ</span>`}
            ${t.viewCount > 0 ? `<span class="view-count" style="color:rgba(245,239,228,0.55);">👁 ${t.viewCount} consultation${t.viewCount > 1 ? 's' : ''}</span>` : ''}

        </div>` : ''}
        ${t.competitionFormat ? `<div class="info-item">
          <p class="info-label">Format de compétition</p>
          <p class="info-val">${esc(t.competitionFormat === 'autres' && t.competitionFormatOther ? t.competitionFormatOther : compFormatLabel(t.competitionFormat))}</p>
        </div>` : ''}
        <div class="info-item">
          <p class="info-label">Nb max d'équipes</p>
          <p class="info-val">${t.maxTeams}</p>
        </div>
        <div class="info-item">
          <p class="info-label">Frais d'inscription</p>
          <p class="info-val">${fmtMoney(t.entryFee)}</p>
        </div>
        ${t.timeStart ? `<div class="info-item">
          <p class="info-label">Horaires</p>
          <p class="info-val">${esc(tournTimeRange(t))}</p>
        </div>` : ''}
      </div>
    </div>

    <div class="detail-section">
      <h3 class="detail-section-title">Lieu</h3>
      <div class="venue-box">
        <p class="venue-name">${esc(tournVenue(t).name || 'Lieu à confirmer')}</p>
        ${tournVenue(t).address ? `<p class="venue-address">${esc(tournVenue(t).address)}</p>
          <a class="venue-map-link" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(tournVenue(t).address)}">Voir sur Google Maps →</a>` : ''}
      </div>
    </div>

    ${renderContactBlock(t.contactName, t.contactPhone, t.contactEmail, t.contactVisible !== false, isOwner)}

    ${(() => {
      const confSp = t.sponsorProposals ? t.sponsorProposals.filter(sp => sp.status === 'confirme') : [];
      if (confSp.length === 0) return '';
      const tierIcon = tier => tier==='or'?'◆':tier==='_autre'?'★':tier==='argent'?'◇':'●';
      const tierColor = tier => tier==='or'?'var(--bronze)':tier==='_autre'?'var(--accent)':'var(--ink-mute)';
      return '<div class="detail-section">'
        + '<h3 class="detail-section-title">Soutenu par</h3>'
        + '<div class="sponsors-preview">'
        + confSp.slice(0,8).map(sp =>
            '<div class="sponsor-chip">'
            + '<span class="sponsor-chip-icon" style="color:' + tierColor(sp.tier) + ';">' + tierIcon(sp.tier) + '</span>'
            + '<span class="sponsor-chip-name">' + esc(sp.name) + '</span>'
            + '</div>'
          ).join('')
        + (confSp.length > 8 ? '<div class="sponsor-chip"><span class="sponsor-chip-name" style="color:var(--ink-mute);">+' + (confSp.length-8) + ' autres</span></div>' : '')
        + '</div></div>';
    })()}

    ${(() => {
      const selAnims = (state.catalog.animations||[]).filter(an => t.animations && t.animations.includes(an.id));
      const customA = t.customAnimations || [];
      const allAnims = [...selAnims.map(a => a.name), ...customA.map(a => a.name)];
      if (allAnims.length === 0) return '';
      return '<div class="detail-section">'
        + '<h3 class="detail-section-title">Au programme</h3>'
        + '<div class="activities-preview">'
        + allAnims.slice(0,8).map(name => '<span class="activity-chip">' + esc(name) + '</span>').join('')
        + (allAnims.length > 8 ? '<span class="activity-chip" style="color:var(--ink-mute);">+' + (allAnims.length-8) + ' autres</span>' : '')
        + '</div></div>';
    })()}`;
  }
  if (activeTab === 'calendar') return renderTabCalendar(t, isOwner);
  if (activeTab === 'teams') return renderTabTeams(t, isOwner, a);
  if (activeTab === 'sponsors') return renderTabSponsors(t, isOwner, a);
  if (activeTab === 'animations') return renderTabAnimations(t, isOwner);
  if (activeTab === 'finances') return renderTabFinances(t, isOwner);
}

// CALENDAR TAB
function renderTabCalendar(t, isOwner) {
  if (t.matches.length === 0 && !isOwner) {
    return `<div class="dash-empty"><div class="dash-empty-title">Calendrier pas encore publié</div><p class="dash-empty-text">Le club n'a pas encore programmé les matchs.</p></div>`;
  }
  const byStage = { poule: [], quart: [], demi: [], finale: [], autre: [] };
  t.matches.forEach(m => { (byStage[m.stage] || byStage.autre).push(m); });
  const labels = { poule: 'Phase de poules', quart: 'Quarts de finale', demi: 'Demi-finales', finale: 'Finale', autre: 'Autres matchs' };

  return `
    ${isOwner ? `
      <div style="background: var(--paper-deep); border-left: 3px solid var(--accent); padding: 0.9rem 1.1rem; margin-bottom: 1.5rem; font-family: var(--font-mono); font-size: 12px; line-height: 1.5;">
        <strong style="text-transform: uppercase; letter-spacing: 0.1em;">Mode organisateur</strong><br>
        Programme tes matchs avec terrains et horaires. Les équipes verront le calendrier en temps réel.
      </div>
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
        <button class="btn btn-orange btn-sm" onclick="addMatchModal('${t.id}')">+ Ajouter un match</button>
        <button class="btn btn-outline btn-sm" onclick="generateBracketModal('${t.id}')">⚙ Générer le bracket</button>
      </div>` : ''}
    ${t.matches.length === 0 ? `
      <div class="dash-empty">
        <div class="dash-empty-title">Aucun match programmé</div>
        <p class="dash-empty-text">Commence par ajouter ton premier match ou générer le bracket.</p>
      </div>` : Object.keys(byStage).map(stage => {
      const ms = byStage[stage];
      if (ms.length === 0) return '';
      return `
        <div class="cal-section">
          <div class="cal-header">
            <div class="cal-title">${labels[stage]}</div>
            <div style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.1em;">${ms.length} match${ms.length > 1 ? 's' : ''}</div>
          </div>
          <div class="match-list">
            ${ms.sort((a, b) => (a.time || '').localeCompare(b.time || '')).map(m => matchRow(m, t, isOwner)).join('')}
          </div>
        </div>`;
    }).join('')}`;
}
function matchRow(m, t, isOwner) {
  const hasScore = m.scoreA !== null && m.scoreB !== null;
  return `
    <div class="match-row">
      <div class="match-time">
        <div class="match-time-hr">${esc(m.time || '?')}</div>
        <div class="match-time-day">${m.date ? fmtDate(m.date).split(' ').slice(0, 2).join(' ') : ''}</div>
      </div>
      <div>
        ${m.stage !== 'autre' ? `<span class="match-stage ${m.stage}">${m.stage}${m.poule ? ' ' + m.poule : ''}</span>` : ''}
        <div class="match-teams">
          <span class="match-team">${esc(m.teamA || 'À déterminer')}</span>
          ${hasScore ? `<span class="match-score">${m.scoreA} - ${m.scoreB}</span>` : `<span class="match-vs">vs</span>`}
          <span class="match-team right">${esc(m.teamB || 'À déterminer')}</span>
        </div>
      </div>
      <div class="match-field">${esc(m.field || '—')}</div>
      ${isOwner ? `
        <div class="match-actions">
          <button class="btn btn-outline btn-sm" onclick="editMatchModal('${t.id}', '${m.id}')">Édit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteMatch('${t.id}', '${m.id}')">×</button>
        </div>` : `<div></div>`}
    </div>`;
}

// TEAMS TAB
function renderTabTeams(t, isOwner, a) {
  const approved  = t.registrations.filter(r => r.status === 'approved');
  const pending   = t.registrations.filter(r => r.status === 'pending');
  const rejected  = t.registrations.filter(r => r.status === 'rejected');
  const withdrawn = t.registrations.filter(r => r.status === 'withdrawn');
  const activeCount = approved.length;
  let html = '';
  if (isOwner && pending.length > 0) {
    html += `
      <div class="detail-section">
        <h3 class="detail-section-title">Demandes en attente (${pending.length})</h3>
        <div class="list">
          ${pending.map(r => `
            <div class="app-card">
              <div>
                <div class="app-card-title">${esc(r.teamName)}</div>
                <div class="app-card-meta">${esc(r.clubName)} · inscription ${fmtDate(r.registeredAt)}${r.teamId && state.teams.find(t => t.id === r.teamId && t.status === 'active') ? ' · <a href="#/teams/' + r.teamId + '" style="color: var(--accent); border-bottom: 1px solid;">Voir profil</a>' : ''}</div>
                ${!r.teamId && r.captainEmail ? `<div class="app-card-meta" style="margin-top:0.25rem;">Contact : <strong>${esc(r.captainEmail)}</strong>${r.captainPhone ? ' · ' + esc(r.captainPhone) : ''}</div>` : ''}
                ${r.message ? `<div class="app-card-msg">"${esc(r.message)}"</div>` : ''}
              </div>
              <div class="app-actions">
                <button class="btn btn-success btn-sm" onclick="approveTeam('${t.id}', '${r.id}')">✓ Approuver</button>
                <button class="btn btn-danger btn-sm" onclick="rejectTeam('${t.id}', '${r.id}')">× Refuser</button>
              </div>
            </div>`).join('')}
        <p style="font-size:11px;color:var(--ink-mute);margin-top:0.5rem;">
          Les décisions d'approbation sont enregistrées sur cet appareil uniquement jusqu'à la mise en place de l'authentification avancée (J2).
        </p>
        </div>
      </div>`;
  }
  html += `
    <div class="detail-section">
      <h3 class="detail-section-title">Équipes confirmées (${activeCount}/${t.maxTeams}) · ${t.maxTeams - activeCount} place${t.maxTeams - activeCount > 1 ? 's' : ''} disponible${t.maxTeams - activeCount > 1 ? 's' : ''}</h3>
      ${activeCount === 0 ? `
        <div class="dash-empty">
          <div class="dash-empty-title">Pas encore d'équipe confirmée</div>
          <p class="dash-empty-text">${a?.type === 'team' ? 'Aucune équipe confirmée pour le moment.' : 'Les inscriptions vont arriver.'}</p>
          ${a?.type === 'team' && !t.registrations.some(r => (r.teamId && r.teamId === a.id) || (a.email && r.captainEmail && r.captainEmail.toLowerCase() === a.email.toLowerCase())) ? `<button class="btn btn-orange btn-sm" onclick="applyTournamentModal('${t.id}')">Postuler</button>` : ''}
          ${isOwner ? `<button class="btn btn-outline btn-sm" onclick="quickRegisterModal('${t.id}')">Inscrire manuellement</button>` : ''}
        </div>` : `
        <div class="list">
          ${approved.map((r, i) => `
            <div class="list-row">
              <div class="list-num">${String(i + 1).padStart(2, '0')}</div>
              <div class="list-info">
                <div class="list-name">${esc(r.teamName)}</div>
                <div class="list-sub">${esc(r.clubName)}${r.teamId && state.teams.find(t => t.id === r.teamId && t.status === 'active') ? ' · <a href="#/teams/' + r.teamId + '" style="color: var(--accent); border-bottom: 1px solid;">Profil</a>' : ''} · inscrite le ${fmtDate(r.registeredAt)}</div>
              </div>
              <span class="list-status approved">✓ Confirmée</span>
              ${isOwner ? `<button class="btn btn-danger btn-sm" onclick="withdrawTeam('${t.id}', '${r.id}')" title="Retirer et libérer la place">Retirer</button>` : ''}
            </div>`).join('')}
        </div>
        ${isOwner ? `<div style="margin-top: 1rem;"><button class="btn btn-outline btn-sm" onclick="quickRegisterModal('${t.id}')">+ Inscrire manuellement</button></div>` : ''}`}
    </div>`;
  if (isOwner && (rejected.length > 0 || withdrawn.length > 0)) {
    html += `
      <div class="detail-section">
        <h3 class="detail-section-title" style="color: var(--ink-mute);">Historique (${rejected.length + withdrawn.length})</h3>
        <div class="list" style="opacity: 0.6;">
          ${[...rejected, ...withdrawn].map(r => `
            <div class="list-row">
              <div class="list-num">×</div>
              <div class="list-info">
                <div class="list-name">${esc(r.teamName)}</div>
                <div class="list-sub">${esc(r.clubName)} · ${r.status === 'withdrawn' ? 'Retirée' : 'Refusée'}</div>
              </div>
              <span class="list-status ${r.status === 'withdrawn' ? 'pending' : 'rejected'}">${r.status === 'withdrawn' ? 'Retirée' : 'Refusée'}</span>
            </div>`).join('')}
        </div>
      </div>`;
  }
  return html;
}

// SPONSORS TAB — owner only
function renderTabSponsors(t, isOwner, a) {
  const conf = t.sponsorProposals.filter(sp => sp.status === 'confirme');

    // Vue publique — sponsors confirmés visibles par tous
    if (conf.length === 0) {
      return `<div class="dash-empty">
        <div class="dash-empty-title">Aucun partenaire annoncé</div>
        <p class="dash-empty-text">Les partenaires du tournoi seront annoncés prochainement.</p>
      </div>`;
    }
    // Regroup by tier for a nicer display
    const tierOrder = ['or', 'argent', 'bronze', '_autre'];
    const tierLabels = { or: 'Partenaire principal', argent: 'Partenaire', bronze: 'Soutien', _autre: 'Partenariat' };
    const tierColors = { or: 'var(--bronze)', argent: 'var(--ink-mute)', bronze: 'var(--accent-soft)', _autre: 'var(--accent)' };
    const tierIcons = { or: '◆', argent: '◇', bronze: '●', _autre: '★' };
    const grouped = tierOrder.map(tier => ({
      tier,
      label: tierLabels[tier],
      sponsors: conf.filter(sp => sp.tier === tier)
    })).filter(g => g.sponsors.length > 0);

    return `
      <div class="detail-section">
        <h3 class="detail-section-title">Sponsors & partenaires du tournoi</h3>
        <div style="display: flex; flex-direction: column; gap: 1.5rem;">
          ${grouped.map(g => `
            <div>
              <div class="section-eyebrow" style="margin-bottom: 0.75rem;">${esc(g.label)}</div>
              <div class="list">
                ${g.sponsors.map(sp => `
                  <div class="list-row">
                    <div class="list-num" style="color: ${tierColors[sp.tier]};">${tierIcons[sp.tier]}</div>
                    <div class="list-info">
                      <div class="list-name" style="font-size: 1.2rem;">${esc(sp.name)}</div>
                      ${sp.notes ? `<div class="list-sub">${esc(sp.notes)}</div>` : ''}
                    </div>
                  </div>`).join('')}
              </div>
            </div>`).join('')}
        </div>
      </div>`;
  }
  return `
    <div class="detail-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 0.5rem;">
        <h3 class="detail-section-title" style="border: none; padding: 0; margin: 0;">Sponsors (${conf.length})</h3>
        <button class="btn btn-orange btn-sm" onclick="addSponsorManualModal('${t.id}')">+ Ajouter un sponsor</button>
      </div>
      ${conf.length === 0 ? `
        <div class="dash-empty">
          <div class="dash-empty-title">Aucun sponsor pour le moment</div>
          <p class="dash-empty-text">Ajoute tes partenaires après les avoir démarchés.</p>
          <button class="btn btn-primary btn-sm" onclick="addSponsorManualModal('${t.id}')">+ Premier sponsor</button>
        </div>` : `
        <div class="list">
          ${conf.map(sp => {
            const col = sp.tier === 'or' ? 'var(--bronze)' : sp.tier === '_autre' ? 'var(--accent)' : 'var(--ink-mute)';
            const ico = sp.tier === 'or' ? '◆' : sp.tier === '_autre' ? '★' : sp.tier === 'argent' ? '◇' : '●';
            const tierDisplay = sp.tier === '_autre' ? (sp.tierLabel || 'Partenariat perso') : ('Palier ' + esc(sp.tier));
            const perksLine = sp.perks && sp.perks.length ? sp.perks.join(' · ') : '';
            return `
              <div class="list-row">
                <div class="list-num" style="color:${col};">${ico}</div>
                <div class="list-info">
                  <div class="list-name">${esc(sp.name)}</div>
                  <div class="list-sub">${tierDisplay}${sp.amount > 0 ? ' · ' + sp.amount + ' €' : ''}${sp.contactName ? ' · ' + esc(sp.contactName) : ''}${sp.contact ? ' · ' + esc(sp.contact) : ''}${sp.notes ? ' · ' + esc(sp.notes) : ''}</div>
                  ${perksLine ? `<div class="list-sub" style="margin-top:0.2rem;font-style:normal;color:var(--ink-soft);">${esc(perksLine)}</div>` : ''}
                </div>
                <span class="list-status confirme">Confirmé</span>
                <button class="btn btn-danger btn-sm" onclick="removeSponsor('${t.id}', '${sp.id}')">×</button>

          }).join('')}
        </div>`}
    </div>
    <div class="detail-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 0.5rem;">

        ${(t.sponsorTiers || []).map(tr => {
          const taken = conf.filter(c => c.tier === tr.name).length;
          return `
            <div class="sponsor-tier">
              <div class="sponsor-tier-head">
                <span class="sponsor-tier-name">${esc(tr.label || tr.name.toUpperCase())}</span>
                <span class="tier-slots" style="font-size:11px;">${taken}/${tr.slots} partenaire${tr.slots > 1 ? 's' : ''}</span>
              </div>
              <ul class="sponsor-tier-perks">${(tr.perks||[]).map(p => `<li>${esc(p)}</li>`).join('')}</ul>

        }).join('')}
      </div>
    </div>`;
}

        }).join('')}
        ${customAnims.map(an => `
          <div class="anim-card selected">

          </div>`).join('')}
      </div>
    </div>
    ${isOwner ? `
    <div class="detail-section">
      <h3 class="detail-section-title">Ajouter une animation personnalisée</h3>
      <div style="display: flex; gap: 0.65rem; flex-wrap: wrap; align-items: flex-end;">
        <div class="form-group" style="flex: 2; min-width: 180px; margin: 0;">
          <label class="form-label">Nom</label>
          <input class="input" id="custom-anim-name" placeholder="Village associatif, Tombola...">
        </div>
        <div class="form-group" style="flex: 3; min-width: 200px; margin: 0;">
          <label class="form-label">Description (optionnel)</label>
          <input class="input" id="custom-anim-desc" placeholder="Brève description">
        </div>
        <button class="btn btn-primary" style="height: 44px; flex-shrink: 0;" onclick="addCustomAnim('${t.id}')">+ Ajouter</button>
      </div>
    </div>` : ''}`;
}
function toggleAnim(tid, aid) {
  const t = getTournament(tid);
  if (t.animations.includes(aid)) { t.animations = t.animations.filter(a => a !== aid); toast('Retirée'); }
  else { t.animations.push(aid); toast('Ajoutée', 'success'); }
  saveState(); renderTournamentDetail(tid);
}
function addCustomAnim(tid) {
  const t = getTournament(tid);
  const name = document.getElementById('custom-anim-name').value.trim();
  if (!name) { toast('Saisis un nom', 'error'); return; }
  if (!t.customAnimations) t.customAnimations = [];
  t.customAnimations.push({ id: uid(), name, desc: document.getElementById('custom-anim-desc').value.trim() });
  saveState(); toast('Animation ajoutée', 'success');
  activeTab = 'animations'; renderTournamentDetail(tid);
}
function removeCustomAnim(tid, aid) {
  const t = getTournament(tid);
  if (!t.customAnimations) return;
  t.customAnimations = t.customAnimations.filter(a => a.id !== aid);
  saveState(); toast('Animation retirée');
  activeTab = 'animations'; renderTournamentDetail(tid);
}


// ASIDE
function renderAside(t, isOwner, a) {
  // Places: only 'approved' count against capacity; pending/withdrawn don't occupy a slot
  const conf = t.registrations.filter(r => r.status === 'approved').length;
  const spTotal = t.sponsorProposals.filter(sp => sp.status === 'confirme').reduce((s, sp) => s + sp.amount, 0);
  const animTot = t.animations.reduce((s, id) => s + (getAnim(id)?.price || 0), 0);
  const teamsRev = t.registrations.filter(r => r.status === 'approved').length * t.entryFee;
  const accountEmail = (a?.email || '').toLowerCase();
  const isRegistered = r => (r.teamId && r.teamId === a?.id) || (accountEmail && r.captainEmail && r.captainEmail.toLowerCase() === accountEmail);
  const canApply  = a?.type === 'team' && !t.registrations.some(isRegistered);
  const hasApplied = a?.type === 'team' && t.registrations.some(isRegistered);
  const myReg = hasApplied ? t.registrations.find(r => r.teamId === a.id) : null;
  const canPropose = a?.type === 'sponsor' && !t.sponsorProposals.some(sp => sp.sponsorId === a.id);
  const hasProposed = a?.type === 'sponsor' && t.sponsorProposals.some(sp => sp.sponsorId === a.id);
  const myProp = hasProposed ? t.sponsorProposals.find(sp => sp.sponsorId === a.id) : null;

  let html = `
    <div class="aside-card">
      <div class="aside-title">Inscription</div>
      <p class="aside-sub">${conf}/${t.maxTeams} équipes</p>
      <div class="aside-stats">
        <div class="aside-stat"><div class="aside-stat-label">Places</div><div class="aside-stat-val">${t.maxTeams - conf}</div></div>

      </div>`;
  if (!a) {
    if (conf < t.maxTeams) {
      html += `<button class="btn btn-orange btn-full" onclick="applyTournamentVisitorModal('${t.id}')">Inscrire mon équipe <span class="btn-arrow"></span></button>

    } else {
      html += `<button class="btn btn-outline btn-full" disabled>Complet</button>`;
    }
  } else if (canApply && conf < t.maxTeams) {
    html += `<button class="btn btn-orange btn-full" onclick="applyTournamentModal('${t.id}')">Postuler avec mon équipe <span class="btn-arrow"></span></button>`;
  } else if (hasApplied) {
    html += `<div style="padding: 0.8rem; background: var(--paper-deep); border-left: 3px solid var(--accent); font-family: var(--font-mono); font-size: 12px;">Statut : <strong>${myReg.status === 'pending' ? 'En attente' : myReg.status === 'approved' ? 'Confirmée' : 'Refusée'}</strong></div>`;
  } else if (conf >= t.maxTeams) {
    html += `<button class="btn btn-outline btn-full" disabled>Complet</button>`;
  } else if (a?.type === 'club') {
    html += `<button class="btn btn-outline btn-full" onclick="quickRegisterModal('${t.id}')">Inscrire manuellement</button>`;
  }
  const shareUrl = getTournamentShareUrl(t.id);
  // Message WhatsApp — on encode tout le texte, sinon le # d'une URL hash-route
  // coupe le paramètre text et le lien devient la page d'accueil.
  const shareText = [
    '[Le Tournoi] ' + t.name + (t.edition ? ' · ' + t.edition : ''),
    'Date : ' + tournDateRange(t),
    'Lieu : ' + (tournVenue(t).name || '') + (tournVenue(t).address ? ', ' + tournVenue(t).address : ''),
    'Categorie(s) : ' + tournCategoriesLabel(t) + (t.matchSize ? ' - ' + matchSizeLabel(t.matchSize) : ''),
    t.entryFee > 0 ? 'Inscription : ' + fmtMoney(t.entryFee) : '',
    '',
    'Infos et inscriptions -> ' + shareUrl
  ].filter(Boolean).join('\n');
  const shareMsg = encodeURIComponent(shareText);
  html += `
    <div class="aside-share">
      <div class="aside-share-label">Partager ce tournoi</div>
      <div class="share-row">
        <a href="https://wa.me/?text=${shareMsg}" target="_blank" rel="noopener noreferrer" class="share-btn" title="WhatsApp">${ICONS.wa}</a>
        <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}" target="_blank" rel="noopener noreferrer" class="share-btn" title="Facebook">${ICONS.fb}</a>
        <button class="share-btn" title="Copier le lien" onclick="copyShareLinkFn('${t.id}')">${ICONS.cp}</button>
      </div>
      <p style="font-family:var(--font-serif);font-style:italic;font-size:11px;color:var(--ink-mute);margin-top:0.6rem;">Le message WhatsApp inclut toutes les infos.</p>
    </div>
  </div>`;

  if (a?.type === 'sponsor') {
    html += `
      <div class="aside-card">
        <div class="aside-title">Sponsoring</div>
        ${canPropose ? `
          <p class="aside-sub">Soutiens ce tournoi en proposant un sponsoring.</p>
          <button class="btn btn-orange btn-full" onclick="proposeSponsorModal('${t.id}')">Proposer mon sponsoring <span class="btn-arrow"></span></button>
        ` : hasProposed ? `
          <p class="aside-sub">Tu as déjà fait une proposition.</p>
          <div style="padding: 0.8rem; background: var(--paper-deep); border-left: 3px solid var(--accent); font-family: var(--font-mono); font-size: 12px;">
            Statut : <strong>${myProp.status === 'pending' ? 'En attente' : myProp.status === 'confirme' ? 'Acceptée' : 'Refusée'}</strong><br>
            ${esc(myProp.tier).toUpperCase()} · ${myProp.amount}€
          </div>` : ''}
      </div>`;
  }

  if (isOwner) {
    html += `
      <div class="aside-card">
        <div class="aside-title">Budget</div>
        <div class="aside-stats">
          <div class="aside-stat"><div class="aside-stat-label">Recettes équipes</div><div class="aside-stat-val">${teamsRev}€</div></div>
          <div class="aside-stat"><div class="aside-stat-label">Sponsors</div><div class="aside-stat-val">${spTotal}€</div></div>
          <div class="aside-stat"><div class="aside-stat-label">Anim</div><div class="aside-stat-val">${animTot}€</div></div>
          <div class="aside-stat" style="background: var(--ink); color: var(--paper);"><div class="aside-stat-label">Solde net</div><div class="aside-stat-val" style="color: var(--accent);">${teamsRev + spTotal - animTot}€</div></div>
        </div>
      </div>`;
  }

  return html;
}

function vaCheckRequired(id, msg) {
  const el = document.getElementById(id);
  const errEl = document.getElementById(id + '-err');
  if (!errEl) return true;
  if (!el.value || !el.value.trim()) { errEl.textContent = msg; errEl.classList.add('show'); return false; }
  errEl.textContent = ''; errEl.classList.remove('show'); return true;
}
function vaCheckEmail() {
  const el = document.getElementById('va-email');
  const errEl = document.getElementById('va-email-err');
  const val = (el.value || '').trim();
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
  if (!val) { errEl.textContent = 'Indique un email.'; errEl.classList.add('show'); return false; }
  if (!ok)  { errEl.textContent = 'Format d\'email invalide.'; errEl.classList.add('show'); return false; }
  errEl.textContent = ''; errEl.classList.remove('show'); return true;
}

async function confirmApplyVisitor(tid) {
  const t = getTournament(tid);
  if (!t) return;
  const errEl = document.getElementById('va-err');
  errEl.classList.remove('show');

  // Anti-spam honeypot
  const hp = document.getElementById('va-hp');
  if (hp && hp.value.trim() !== '') { console.log('[Le Tournoi] honeypot triggered (visitor apply), blocking'); return; }

  // Validation complète avant envoi — formulaire réduit au strict minimum
  const okTeam  = vaCheckRequired('va-team', 'Indique le nom de l\'équipe.');
  const okEmail = vaCheckEmail();
  const consent = document.getElementById('va-consent-data');
  if (!okTeam || !okEmail) {
    // PostHog §4.2 : inscription_error sur validation échouée
    ph('inscription_error', { error_type: 'validation', step_name: 'formulaire_visiteur', tournoi_id: tid });
    errEl.textContent = 'Corrige les champs en rouge ci-dessus.'; errEl.classList.add('show'); return;
  }
  if (!consent || !consent.checked) {
    ph('inscription_error', { error_type: 'rgpd_missing', step_name: 'formulaire_visiteur', tournoi_id: tid });
    errEl.textContent = 'Le consentement RGPD est obligatoire pour continuer.'; errEl.classList.add('show'); return;
  }

  const teamName      = document.getElementById('va-team').value.trim();
  const email         = document.getElementById('va-email').value.trim().toLowerCase();
  const consentComms  = document.getElementById('va-consent-comms')?.checked === true;

  const submitBtn = document.getElementById('va-submit-btn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Envoi…'; }

  // PostHog §4.2 : step validation passée — formulaire valide, prêt à l'envoi
  ph('inscription_step_completed', { step_name: 'formulaire_visiteur_valide', tournoi_id: tid });

  // Club, responsable, téléphone, département, ville : laissés vides ici,
  // à compléter depuis le profil équipe une fois un compte créé.
  const registration = {
    id: uid(), teamId: null, teamName, clubName: '',
    captainName: '', captainEmail: email, captainPhone: '',
    department: '', city: '',
    status: 'pending', registeredAt: new Date().toISOString(), message: ''
  };
  t.registrations.push(registration);
  saveState();
  // syncTournament retiré ici : la candidature n'impacte pas les données du tournoi lui-même.
  // Un appel update_tournament sans recovery_code valide (visiteur sans compte) échouerait.
  await syncRegistration(t.id, registration);

  // PostHog §4.2 : inscription_completed — soumission réussie (pas de PII, pas de teamName)
  ph('inscription_completed', { tournoi_id: tid, departement: t.department || null, mode: getCurrentMode() });
  disarmInscriptionAbandoned();

  // Consentement RGPD tracé dans la table consents existante (non bloquant)
  if (supabaseClient && signupMode === 'real') {
    try {
      await supabaseClient.from('consents').insert([{
        email, account_type: 'team_visitor',
        consent_data_collection: true,
        consent_marketing: consentComms
      }]);
    } catch(e) { /* non bloquant */ }
  }

  if (submitBtn) { submitBtn.disabled = false; }

  // Écran de confirmation — recap + "créer mon espace" en option, jamais bloquant
  modal('Candidature envoyée !', `
    <div style="text-align:center;padding:0.5rem 0 1rem;">
      <div style="font-size:2.2rem;color:var(--accent);margin-bottom:0.5rem;">✓</div>
      <p class="detail-text">Ta candidature pour <strong>${esc(teamName)}</strong> a bien été envoyée à l'organisateur de <strong>${esc(t.name)}</strong>.</p>
    </div>
    <div style="background:var(--paper-soft);border:1px solid var(--line);border-radius:4px;padding:0.85rem 1rem;margin:1rem 0;">
      <div style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-mute);margin-bottom:0.5rem;">Récapitulatif</div>
      <div style="font-family:var(--font-sans);font-size:13px;line-height:1.8;color:var(--ink-soft);">
        Équipe : <strong style="color:var(--ink);">${esc(teamName)}</strong><br>
        Contact : <strong style="color:var(--ink);">${esc(email)}</strong><br>
        Statut : <strong style="color:var(--accent);">En attente de validation par l'organisateur</strong>
      </div>

  `, `

    <a href="#/signup" class="btn btn-orange" onclick="closeModal()">Créer mon espace équipe</a>
  `);
}

// B2 — mise à jour statut inscription via RPC (Note DEV-B1-B2)
// Utilisée par approveTeam, rejectTeam, confirmWithdraw
async function updateRegistrationStatus(tid, rid, newStatus, successMsg) {
  const t = getTournament(tid);
  if (!t) return;
  const r = t.registrations.find(x => x.id === rid);
  if (!r) return;

  // Mise à jour locale immédiate (optimiste)
  r.status = newStatus;
  if (newStatus === 'withdrawn') r.withdrawnAt = new Date().toISOString();
  saveState();

  // Persistance en base via RPC (mode réel uniquement)
  if (signupMode === 'real' && supabaseClient) {
    const a = getAccount();
    const recoveryCode = a?.recoveryCode || '';
    const ownerEmail   = a?.email || '';
    if (ownerEmail && recoveryCode) {
      try {
        // B2c : rid peut être un id local (id-xxx) si la registration a été créée localement
        // avant que Supabase l'ait retourné. On tente avec rid direct d'abord.
        const { data, error } = await supabaseClient.rpc('organizer_update_registration_status', {
          p_registration_id: rid,
          p_tournament_id:   tid,
          p_owner_email:     ownerEmail,
          p_recovery_code:   recoveryCode,
          p_status:          newStatus
        });
        if (error) {
          console.warn('[Le Tournoi] organizer_update_registration_status:', error.message);
          toast(successMsg + ' (sync base échouée)', 'warning');
          return;
        }
        if (data?.ok === false) {
          if (data.error === 'unauthorized') {
            toast('Vérification d\'autorisation échouée. Reconnectez-vous avec votre code de récupération.', 'error');
          } else if (data.error === 'registration_not_found') {
            // B2c : id local non reconnu en base — logguer pour diagnostic
            console.warn('[Le Tournoi] registration_not_found pour rid:', rid, '— vérifier sync entre id local et Supabase');
            toast('Inscription mise à jour localement (id non synchronisé en base)', 'warning');
          } else {
            toast(successMsg + ' (' + data.error + ')', 'warning');
          }
          return;
        }
        // B2b : succès confirmé par la RPC
        console.log('[Le Tournoi] organizer_update_registration_status ok:', tid, rid, newStatus);
      } catch(e) {
        console.warn('[Le Tournoi] organizer_update_registration_status exception:', e.message);
        toast(successMsg + ' (erreur réseau)', 'warning');
        return;
      }
    }
  }
  toast(successMsg, 'success');

  // B2a : re-render immédiat — le participant voit le changement de statut sans F5
  // Si l'équipe concernée est connectée sur ce même device, son dashboard se met à jour
  const teamEmail = r.captainEmail?.toLowerCase();
  const currentA  = getAccount();
  if (currentA?.type === 'team' && currentA.email?.toLowerCase() === teamEmail) {
    render(); // re-render le dashboard équipe participant
  }
}

// ===== ROT13 encode/decode for contact info anti-scraper =====
function rot13(s) {
  return (s || '').replace(/[A-Za-z]/g, c => {
    const base = c <= 'Z' ? 65 : 97;
    return String.fromCharCode(((c.charCodeAt(0) - base + 13) % 26) + base);
  });
}
// Alias anti-scraping — même fonction, nom explicite pour les champs contact
const encodeContact = rot13;

// ===== Render secure contact block =====
// ===== Fragmente une valeur en 3 parties pour stockage anti-scraper =====
function splitContact(v) {
  if (!v) return ['', '', ''];
  // Pour email : sépare local @ domaine
  const at = v.indexOf('@');
  if (at > 0) {
    return [rot13(v.slice(0, at)), rot13('@'), rot13(v.slice(at + 1))];
  }
  // Pour téléphone : découpe en 3 blocs
  const clean = v.replace(/\s/g, '');
  const l = Math.ceil(clean.length / 3);
  return [rot13(clean.slice(0, l)), rot13(clean.slice(l, l * 2)), rot13(clean.slice(l * 2))];
}

// ===== Assemble les fragments en mémoire JS (jamais dans le DOM) =====
function assembleContact(el) {
  const p1 = rot13(el.getAttribute('data-p1') || '');
  const p2 = rot13(el.getAttribute('data-p2') || '');
  const p3 = rot13(el.getAttribute('data-p3') || '');
  return p1 + p2 + p3;
}

// Révélation anti-bot :
// 1. Délai de 300ms (les bots cliquent instantanément)
// 2. L'email est assemblé en mémoire JS uniquement
// 3. Affiché via CSS data-attribute — jamais en clair dans innerHTML
// 4. Le lien d'action (mailto/tel) est déclenché par JS, jamais écrit dans le DOM
function revealContact(btn) {
  if (btn.getAttribute('data-ready') === '1') {
    // Déjà révélé — déclencher l'action directement
    const v = btn.getAttribute('data-revealed');
    const k = btn.getAttribute('data-k');
    if (k === 'email') window.location.href = 'mailto:' + v;
    else window.location.href = 'tel:' + v.replace(/\s/g, '');
    return;
  }
  // Désactiver pendant le délai anti-bot
  btn.disabled = true;
  btn.textContent = '···';
  // Délai 300ms minimum — trop court pour l'humain, bloquant pour les bots rapides
  setTimeout(function() {
    const v = assembleContact(btn);
    const k = btn.getAttribute('data-k');
    btn.disabled = false;
    btn.setAttribute('data-ready', '1');
    // Stocker assemblé (toujours non-indexable car pas de href)
    btn.setAttribute('data-revealed', v);
    // Afficher via CSS uniquement — le texte est dans un pseudo-élément,
    // pas dans le contenu texte du nœud DOM
    const wrap = btn.parentNode;
    const reveal = document.createElement('span');
    reveal.className = 'contact-css-reveal';
    // Fragmentation CSS : les deux moitiés dans deux attributs séparés
    // Un robot doit exécuter CSS + JS pour reconstituer — barrière haute
    const half = Math.ceil(v.length / 2);
    reveal.setAttribute('data-a', v.slice(0, half));
    reveal.setAttribute('data-b', v.slice(half));
    reveal.setAttribute('data-k', k);
    reveal.setAttribute('title', k === 'email' ? 'Cliquer pour envoyer un email' : 'Cliquer pour appeler');
    reveal.setAttribute('role', 'button');
    reveal.setAttribute('tabindex', '0');
    reveal.onclick = function() {
      if (k === 'email') window.location.href = 'mailto:' + v;
      else window.location.href = 'tel:' + v.replace(/\s/g, '');
    };
    reveal.onkeydown = function(e) {
      if (e.key === 'Enter' || e.key === ' ') reveal.onclick();
    };
    wrap.replaceChild(reveal, btn);
  }, 300);
}

function exportBilanExcel(tid) {
  // Vérifier que SheetJS est chargé
  if (typeof XLSX === 'undefined') {
    toast('Chargement en cours, veuillez réessayer dans quelques secondes', 'error');
    return;
  }

  const t = getTournament(tid);
  const club = getClub(t.clubId, t);
  const equipes = t.registrations.filter(r => r.status === 'approved').length;
  const recInscriptions = equipes * (t.entryFee || 0);
  const recSponsors = (t.sponsorProposals || [])
    .filter(sp => sp.status === 'confirme')
    .reduce((s, sp) => s + (sp.amount || 0), 0);
  const recExtra = (t.recettesExtra || []).reduce((s, r) => s + (r.montant || 0), 0);
  const totalRecettes = recInscriptions + recSponsors + recExtra;
  const depenses = t.finances || [];
  const totalDepenses = depenses.reduce((s, d) => s + (d.montant || 0), 0);
  const solde = totalRecettes - totalDepenses;
  const nbSp = (t.sponsorProposals || []).filter(sp => sp.status === 'confirme').length;

  // Construction du workbook SheetJS
  const wb = XLSX.utils.book_new();

  // Données structurées en tableau de tableaux
  const data = [
    ['BILAN FINANCIER', t.name],
    [t.edition || '', ''],
    ['Organisateur', club?.name || ''],
    ['Date', fmtDate(t.date) + (t.dateEnd && t.dateEnd !== t.date ? ' - ' + fmtDate(t.dateEnd) : '')],
    ['Lieu', (t.venueName || t.location || '')],
    ['', ''],
    ['', ''],
    // En-têtes
    ['LIBELLÉ', 'DÉTAIL', 'MONTANT (€)'],
    // Recettes
    ['RECETTES', '', ''],
    ['Inscriptions équipes', equipes + ' équipe' + (equipes > 1 ? 's' : '') + ' x ' + (t.entryFee || 0) + ' EUR', recInscriptions],
  ];

  if (recSponsors > 0) {
    data.push(['Sponsors confirmés', nbSp + ' partenaire' + (nbSp > 1 ? 's' : ''), recSponsors]);
  }
  (t.recettesExtra || []).forEach(r => {
    data.push([r.label, r.detail || '', r.montant || 0]);
  });
  data.push(['TOTAL RECETTES', '', totalRecettes]);
  data.push(['', '', '']);

  // Dépenses
  data.push(['DÉPENSES', '', '']);
  if (depenses.length === 0) {
    data.push(['Aucune dépense saisie', '', 0]);
  } else {
    depenses.forEach(d => data.push([d.label, d.detail || d.note || '', d.montant || 0]));
  }
  data.push(['TOTAL DÉPENSES', '', totalDepenses]);
  data.push(['', '', '']);

  // Résultat
  data.push([solde >= 0 ? 'BÉNÉFICE' : 'DÉFICIT', 'Recettes - Dépenses', solde]);

  // Créer la feuille depuis le tableau
  const ws = XLSX.utils.aoa_to_sheet(data);

  // Largeurs des colonnes
  ws['!cols'] = [{ wch: 36 }, { wch: 30 }, { wch: 16 }];

  // Ajouter la feuille au workbook
  XLSX.utils.book_append_sheet(wb, ws, 'Bilan');

  // Téléchargement .xlsx (UTF-8 natif, accents corrects)
  const safeName = t.name.replace(/[^a-zA-Z0-9_àâäéèêëîïôùûüç-]/gi, '_');
  XLSX.writeFile(wb, 'Bilan_' + safeName + '_' + t.date + '.xlsx');
  toast('Export Excel téléchargé', 'success');
}

function addFinLine(tid, type) {
  const t = getTournament(tid);
  const labelId  = type === 'recette' ? 'fin-rec-label'   : 'fin-dep-label';
  const detailId = type === 'recette' ? 'fin-rec-detail'  : 'fin-dep-detail';
  const montantId= type === 'recette' ? 'fin-rec-montant' : 'fin-dep-montant';
  const label  = document.getElementById(labelId)?.value.trim();
  const detail = document.getElementById(detailId)?.value.trim() || '';
  const montant= parseFloat(document.getElementById(montantId)?.value) || 0;
  if (!label)    { toast('Saisissez un libellé', 'error'); return; }
  if (montant <= 0) { toast('Saisissez un montant supérieur à 0', 'error'); return; }
  if (type === 'recette') {
    if (!t.recettesExtra) t.recettesExtra = [];
    t.recettesExtra.push({ label, detail, montant });
  } else {
    if (!t.finances) t.finances = [];
    t.finances.push({ label, detail, montant });
  }
  saveState();
  activeTab = 'finances';
  renderTournamentDetail(tid);
}

function removeFinLine(tid, type, idx) {
  const t = getTournament(tid);
  if (type === 'recette') {
    if (t.recettesExtra) t.recettesExtra.splice(idx, 1);
  } else {
    if (t.finances) t.finances.splice(idx, 1);
  }
  saveState();
  activeTab = 'finances';
  renderTournamentDetail(tid);
}

function generateBracketModal(tid) {
  const t = getTournament(tid);
  const conf = t.registrations.filter(r => r.status === 'approved');
  if (conf.length < 4) { toast('Au moins 4 équipes confirmées requises', 'error'); return; }
  modal('Générer le bracket',
    `<p>Cette action va créer automatiquement les matchs à partir des ${conf.length} équipes confirmées.</p>
     <p style="margin-top: 0.5rem;">Les matchs existants seront remplacés.</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
     <button class="btn btn-orange" onclick="confirmGenerate('${tid}')">Générer</button>`);
}
function confirmGenerate(tid) {
  const t = getTournament(tid);
  const conf = t.registrations.filter(r => r.status === 'approved');
  t.matches = [];
  const shuf = [...conf].sort(() => Math.random() - 0.5);
  let stage = shuf.length <= 4 ? 'demi' : 'quart';
  if (shuf.length === 2) stage = 'finale';
  let hr = 14, field = 1;
  for (let i = 0; i < shuf.length; i += 2) {
    if (shuf[i + 1]) {
      t.matches.push({
        id: uid(), stage, date: t.date,
        time: `${String(hr).padStart(2, '0')}:00`,
        field: `Terrain ${field}`,
        teamA: shuf[i].teamName, teamB: shuf[i + 1].teamName,
        scoreA: null, scoreB: null
      });
      field = field === 1 ? 2 : 1;
      if (field === 1) hr += 1;
    }
  }
  saveState(); closeModal(); toast(`Bracket généré : ${t.matches.length} matchs`, 'success');
  activeTab = 'calendar'; renderTournamentDetail(tid);
}

// ===== Île-de-France — source unique des départements (Brief BA Formulaires IDF) =====
const IDF_DEPARTEMENTS = [
  { code: '75', nom: 'Paris' },
  { code: '77', nom: 'Seine-et-Marne' },
  { code: '78', nom: 'Yvelines' },
  { code: '91', nom: 'Essonne' },
  { code: '92', nom: 'Hauts-de-Seine' },
  { code: '93', nom: 'Seine-Saint-Denis' },
  { code: '94', nom: 'Val-de-Marne' },
  { code: '95', nom: "Val-d'Oise" }
];
function deptLabel(code) { const d = IDF_DEPARTEMENTS.find(x => x.code === code); return d ? d.nom : (code || ''); }
function deptLabelFull(code) { const d = IDF_DEPARTEMENTS.find(x => x.code === code); return d ? d.nom + ' (' + d.code + ')' : (code || ''); }

// Génère les <option> d'un sélecteur département mono-choix IDF
function deptOptionsHTML(selected, withEmpty) {
  const empty = withEmpty ? '<option value="">Département...</option>' : '';
  return empty + IDF_DEPARTEMENTS.map(d =>
    `<option value="${d.code}" ${selected === d.code ? 'selected' : ''}>${esc(d.nom)} (${d.code})</option>`
  ).join('');
}

// Quand le département change : vide + désactive/active le champ ville lié, ferme tout dropdown ouvert
function onDeptChange(selectEl, cityInputId) {
  const cityInput = document.getElementById(cityInputId);
  if (!cityInput) return;
  cityInput.value = '';
  cityInput.disabled = !selectEl.value;
  cityInput.placeholder = selectEl.value ? 'Tape pour chercher une ville…' : 'Choisis d\'abord un département';
  const wrap = cityInput.closest('.city-wrap');
  if (wrap) _closeCityDropdown(wrap);
}

// ===== Autocomplétion adresse via api-adresse.data.gouv.fr (BAN, officielle, gratuite) =====
// Utilisée pour le champ "Adresse complète" du tournoi : format uniformisé,
// scopée au département choisi (filtre client sur le code postal).
// Au choix d'une suggestion, remplit aussi le champ ville caché (cityFieldId).
let _addrDebounce = null;
const _addrCache = {};

function addressAutocomplete(inputEl, deptInputId, cityFieldId) {
  const val = inputEl.value.trim();
  const wrap = inputEl.closest('.city-wrap') || inputEl.parentNode;
  _closeCityDropdown(wrap);
  const deptCode = deptInputId ? (document.getElementById(deptInputId)?.value || '') : '';
  if (val.length < 4) return;

  const cacheKey = deptCode + '|' + val.toLowerCase();
  clearTimeout(_addrDebounce);
  _addrDebounce = setTimeout(async () => {
    if (_addrCache[cacheKey]) { _renderAddressDropdown(inputEl, wrap, _addrCache[cacheKey], cityFieldId); return; }
    try {
      const url = 'https://api-adresse.data.gouv.fr/search/?q=' + encodeURIComponent(val) + '&limit=8&type=housenumber';
      const res  = await fetch(url);
      const data = await res.json();
      let feats = data.features || [];
      // Garde-fou IDF : ne proposer que des adresses du département choisi (préfixe code postal)
      if (deptCode) feats = feats.filter(f => (f.properties.postcode || '').startsWith(deptCode));
      _addrCache[cacheKey] = feats;
      _renderAddressDropdown(inputEl, wrap, feats, cityFieldId);
    } catch(e) { /* API optionnelle — saisie libre reste possible */ }
  }, 300);
}

function _renderAddressDropdown(inputEl, wrap, feats, cityFieldId) {
  _closeCityDropdown(wrap);
  if (!feats || feats.length === 0) return;
  const dd = document.createElement('div');
  dd.className = 'city-dropdown';
  dd.setAttribute('role', 'listbox');
  feats.forEach(f => {
    const div = document.createElement('div');
    div.className = 'city-item';
    div.setAttribute('role', 'option');
    div.innerHTML = '<span>' + esc(f.properties.label) + '</span>';
    div.addEventListener('mousedown', function(e) {
      e.preventDefault();
      clearTimeout(_addrDebounce); // annule une recherche en attente (évite la réouverture du menu)
      inputEl.value = f.properties.label; // format uniformisé BAN (officiel)
      const cityField = cityFieldId ? document.getElementById(cityFieldId) : null;
      if (cityField) cityField.value = f.properties.city || '';
      _closeCityDropdown(wrap);
      inputEl.blur(); // libère le focus — la sélection est terminée
    });
    dd.appendChild(div);
  });
  wrap.appendChild(dd);
}

// ===== Autocomplétion ville via geo.api.gouv.fr (API officielle, gratuite) =====
// Scopée Île-de-France : chaque champ ville est lié à un sélecteur département
// via l'attribut data-dept-input (id du <select> département correspondant).
const _cityCache = {};     // cache des résultats pour éviter les appels répétés
let   _cityDebounce = null; // timer debounce
let   _cityFocusIdx = -1;   // index de navigation clavier dans le dropdown

function cityAutocomplete(inputEl) {
  const val = inputEl.value.trim();
  const wrap = inputEl.closest('.city-wrap') || inputEl.parentNode;
  _closeCityDropdown(wrap);

  // Champ ville scopé IDF : pas de département sélectionné → aucune suggestion
  const deptInputId = inputEl.dataset.deptInput;
  const deptCode = deptInputId ? (document.getElementById(deptInputId)?.value || '') : '';
  if (deptInputId && !deptCode) return;
  if (val.length < 2) return;

  const cacheKey = deptCode + '|' + val.toLowerCase();

  // Debounce 250ms pour ne pas appeler l'API à chaque frappe
  clearTimeout(_cityDebounce);
  _cityDebounce = setTimeout(async () => {
    if (_cityCache[cacheKey]) {
      _renderCityDropdown(inputEl, wrap, _cityCache[cacheKey]);
      return;
    }
    try {
      let url = 'https://geo.api.gouv.fr/communes?nom=' +
        encodeURIComponent(val) +
        '&fields=nom,codesPostaux,departement&boost=population&limit=8';
      if (deptCode) url += '&codeDepartement=' + encodeURIComponent(deptCode);
      const res  = await fetch(url);
      let data = await res.json();
      // Garde-fou : ne jamais proposer une commune hors des 8 départements IDF
      if (deptCode) data = (data || []).filter(c => c.departement?.code === deptCode);
      _cityCache[cacheKey] = data;
      _renderCityDropdown(inputEl, wrap, data);
    } catch(e) {
      // Silencieux — l'API est optionnelle, la saisie libre reste possible
    }
  }, 250);
}

function _renderCityDropdown(inputEl, wrap, items) {
  _closeCityDropdown(wrap);
  if (!items || items.length === 0) return;
  _cityFocusIdx = -1;

  const dd = document.createElement('div');
  dd.className = 'city-dropdown';
  dd.setAttribute('role', 'listbox');

  items.forEach((item, i) => {
    const cp = item.codesPostaux ? item.codesPostaux[0] : '';
    const dept = item.departement ? item.departement.nom : '';
    const div = document.createElement('div');
    div.className = 'city-item';
    div.setAttribute('role', 'option');
    div.innerHTML =
      '<span>' + item.nom + (dept ? ' <span style="color:var(--ink-mute);font-size:12px;">(' + dept + ')</span>' : '') + '</span>' +
      (cp ? '<span class="city-cp">' + cp + '</span>' : '');
    div.addEventListener('mousedown', function(e) {
      e.preventDefault(); // empêche le blur du champ
      clearTimeout(_cityDebounce); // annule une recherche en attente (évite la réouverture du menu)
      inputEl.value = item.nom;
      _closeCityDropdown(wrap);
      inputEl.blur(); // libère le focus — la sélection est terminée
    });
    dd.appendChild(div);
  });

  // Assurer que wrap est en position relative pour le dropdown absolu
  if (!wrap.classList.contains('city-wrap')) {
    wrap.style.position = 'relative';
  }
  wrap.appendChild(dd);
}

function _closeCityDropdown(wrap) {
  const existing = wrap ? wrap.querySelector('.city-dropdown') : null;
  if (existing) existing.remove();
}

function _cityKeyNav(e, inputEl) {
  const wrap = inputEl.closest('.city-wrap') || inputEl.parentNode;
  const dd = wrap.querySelector('.city-dropdown');
  if (!dd) return;
  const items = dd.querySelectorAll('.city-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _cityFocusIdx = Math.min(_cityFocusIdx + 1, items.length - 1);
    items.forEach((it, i) => it.classList.toggle('focused', i === _cityFocusIdx));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _cityFocusIdx = Math.max(_cityFocusIdx - 1, 0);
    items.forEach((it, i) => it.classList.toggle('focused', i === _cityFocusIdx));
  } else if (e.key === 'Enter' && _cityFocusIdx >= 0) {
    e.preventDefault();
    items[_cityFocusIdx].dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
  } else if (e.key === 'Escape') {
    _closeCityDropdown(wrap);
  }
}

}

// User menu helpers
function toggleUserMenu(e) {
  if (e) e.stopPropagation();
  const dd = document.getElementById('nav-user-dd');
  if (!dd) return;
  dd.classList.toggle('open');
  // Close on outside click
  if (dd.classList.contains('open')) {
    setTimeout(() => {
      document.addEventListener('click', closeUserMenu, { once: true });
    }, 10);
  }
}
function closeUserMenu() {
  const dd = document.getElementById('nav-user-dd');
  if (dd) dd.classList.remove('open');
}
